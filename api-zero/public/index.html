<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Zero — REST API Gratis</title>
  <meta name="description" content="REST API gratis: downloader, AI, maker, tools, search, dan ratusan fitur lain. Contoh kode cURL, Node.js, Python, PHP, Go, dan lainnya.">
  <meta name="theme-color" content="#ffd84d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap hero-inner">
      <div class="hero-text">
        <div class="logo"><span class="logo-badge">0</span> API Zero</div>
        <h1>REST API gratis,<br><span class="squiggle">tinggal panggil!</span></h1>
        <p class="lead">Ratusan endpoint siap pakai — downloader, AI, maker gambar, tools, search, dan banyak lagi. Semua lewat satu alamat:</p>
        <div class="base-url">
          <code id="baseUrl">https://api-zero.web.id/api/(path)/(fitur)</code>
          <button class="btn btn-sm" data-copy-target="baseUrl">Salin</button>
        </div>
        <div class="stats">
          <div class="stat"><b id="statTotal">…</b><span>endpoint</span></div>
          <div class="stat"><b id="statCats">…</b><span>kategori</span></div>
          <div class="stat"><b>JSON</b><span>+ media</span></div>
        </div>
      </div>
      <div class="mascot" aria-hidden="true">
        <svg viewBox="0 0 220 220" width="220" height="220">
          <ellipse cx="110" cy="205" rx="62" ry="9" class="m-shadow"/>
          <g class="m-bob">
            <line x1="110" y1="38" x2="110" y2="16" class="m-line"/>
            <circle cx="110" cy="13" r="9" class="m-ant"/>
            <rect x="38" y="38" width="144" height="118" rx="34" class="m-head"/>
            <rect x="58" y="62" width="104" height="66" rx="22" class="m-face"/>
            <g class="m-eyes">
              <ellipse cx="88" cy="92" rx="9" ry="12" class="m-eye"/>
              <ellipse cx="132" cy="92" rx="9" ry="12" class="m-eye"/>
              <circle cx="91" cy="88" r="3" fill="#fff"/>
              <circle cx="135" cy="88" r="3" fill="#fff"/>
            </g>
            <path d="M94 112 q16 14 32 0" class="m-smile"/>
            <circle cx="70" cy="112" r="7" class="m-blush"/>
            <circle cx="150" cy="112" r="7" class="m-blush"/>
            <rect x="72" y="160" width="76" height="30" rx="14" class="m-body"/>
            <text x="110" y="182" text-anchor="middle" class="m-code">{ }</text>
          </g>
        </svg>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar card">
      <label class="search">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Cari fitur… (tiktok, gpt, brat, cuaca)" autocomplete="off">
      </label>
      <button class="btn btn-ghost" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
    </section>
    <nav class="chips" id="chips" aria-label="Kategori"></nav>
    <p class="result-info" id="resultInfo"></p>
    <section id="list" class="list" aria-live="polite">
      <div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p><b>API Zero</b> · dibuat dengan ❤ · <a href="/api/list" target="_blank" rel="noopener">/api/list</a> · <a href="/api/status" target="_blank" rel="noopener">/api/status</a></p>
    </div>
  </footer>

  <!-- Detail endpoint -->
  <dialog id="modal" class="modal">
    <form method="dialog" class="modal-close-form"><button class="btn btn-icon" aria-label="Tutup">✕</button></form>
    <div class="modal-body" id="modalBody"></div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
