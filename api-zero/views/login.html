<!doctype html>
<html lang="id">
<head>
<!--HEAD-->
<title>Masuk · API Zero</title>
<style>
  .login { min-height: 100vh; display: grid; place-items: center; padding: 30px 16px 120px; }
  .login-box { width: min(440px, 100%); }
  .login-hero { text-align: center; margin-bottom: 18px; }
  .login-hero .brand { justify-content: center; font-size: 26px; }
  .login-hero p { margin: 6px 0 0; font-weight: 800; color: var(--ink-soft); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--field); border: var(--border); border-radius: 14px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: 0; background: transparent; padding: 9px; border-radius: 10px; font: 600 15px Fredoka, sans-serif; color: var(--ink); cursor: pointer; }
  .seg button.active { background: var(--yellow); color: #1d1a2f; box-shadow: inset 0 0 0 2px var(--line); }
  .or { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-weight: 800; margin: 14px 0; }
  .or::before, .or::after { content: ""; flex: 1; border-top: 3px dashed var(--bg-dot); }
  #googleBtn { display: flex; justify-content: center; min-height: 44px; }
  .link { background: none; border: 0; color: var(--ink); text-decoration: underline; font: 800 14px Nunito, sans-serif; cursor: pointer; padding: 0; }
  .mascot { width: 92px; height: 92px; margin: 0 auto 6px; display: block; }
  .theme-corner { position: fixed; top: 14px; right: 14px; }
</style>
</head>
<body>
<button class="btn btn-ghost btn-sm icon-btn theme-corner" data-theme-btn title="Ganti tema">🌙</button>
<main class="login">
  <div class="login-box">
    <div class="login-hero">
      <svg class="mascot" viewBox="0 0 120 120" aria-hidden="true"><line x1="60" y1="22" x2="60" y2="8" stroke="#1d1a2f" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="8" r="6" fill="#ff8fb8" stroke="#1d1a2f" stroke-width="3"/><rect x="16" y="22" width="88" height="74" rx="24" fill="#7cc8ff" stroke="#1d1a2f" stroke-width="4"/><rect x="29" y="37" width="62" height="42" rx="14" fill="#fff" stroke="#1d1a2f" stroke-width="3"/><ellipse cx="48" cy="55" rx="5" ry="7" fill="#1d1a2f"/><ellipse cx="72" cy="55" rx="5" ry="7" fill="#1d1a2f"/><path d="M52 68 q8 7 16 0" stroke="#1d1a2f" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
      <div class="brand"><span class="logo-badge">0</span> API Zero</div>
      <p>REST API gratis &amp; premium, tinggal panggil!</p>
    </div>
    <div class="card">
      <div class="seg" role="tablist">
        <button class="active" data-mode="login" role="tab">Masuk</button>
        <button data-mode="register" role="tab">Daftar</button>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="field"><label for="lUser">Username atau email</label><input id="lUser" name="username" autocomplete="username" required></div>
        <div class="field"><label for="lPass">Sandi</label><input id="lPass" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn btn-pink btn-block" type="submit">Masuk 🚀</button>
        <p class="small" style="text-align:right;margin:10px 0 0"><button type="button" class="link" id="forgotLink">Lupa sandi?</button></p>
      </form>

      <form id="registerForm" class="hidden" autocomplete="on">
        <div class="field"><label for="rUser">Username <span class="req">*</span></label><input id="rUser" name="username" autocomplete="username" required pattern="[a-z0-9_]{3,20}" placeholder="huruf kecil, angka, _"></div>
        <div class="field"><label for="rPass">Sandi <span class="req">*</span></label><input id="rPass" name="password" type="password" autocomplete="new-password" required minlength="6" placeholder="minimal 6 karakter"></div>
        <div class="field"><label for="rPhone">No. HP <span class="req">*</span></label><input id="rPhone" name="phone" type="tel" autocomplete="tel" required placeholder="08xxxxxxxxxx"></div>
        <div class="field"><label for="rEmail">Email <span class="req">*</span></label><input id="rEmail" name="email" type="email" autocomplete="email" required placeholder="buat reset sandi"><div class="hint">Kode lupa sandi dikirim ke email ini.</div></div>
        <button class="btn btn-pink btn-block" type="submit">Daftar gratis ✨</button>
      </form>

      <form id="forgotForm" class="hidden">
        <h3>Lupa sandi 🔑</h3>
        <p class="small muted" style="margin-top:0">Masukkan email akun kamu. Kami kirim kode 6 digit.</p>
        <div class="field"><label for="fEmail">Email</label><input id="fEmail" type="email" required autocomplete="email"></div>
        <button class="btn btn-blue btn-block" type="submit" id="sendCode">Kirim kode</button>
        <div id="resetPart" class="hidden" style="margin-top:14px">
          <div class="field"><label for="fCode">Kode dari email</label><input id="fCode" inputmode="numeric" maxlength="6" placeholder="123456"></div>
          <div class="field"><label for="fPass">Sandi baru</label><input id="fPass" type="password" minlength="6" autocomplete="new-password"></div>
          <button class="btn btn-pink btn-block" type="button" id="doReset">Ganti sandi</button>
        </div>
        <p class="small" style="margin:12px 0 0"><button type="button" class="link" id="backLogin">← Kembali ke masuk</button></p>
      </form>

      <div id="googleArea" class="hidden">
        <div class="or">atau</div>
        <div id="googleBtn"></div>
      </div>
    </div>
  </div>
</main>
<script src="/assets/common.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
