<!doctype html>
<html lang="id">
<head>
<!--HEAD-->
<title>Live Chat · API Zero</title>
<style>
  .chat { display: flex; flex-direction: column; height: calc(100dvh - 190px); min-height: 420px; padding: 0; overflow: hidden; }
  .chat-head { padding: 12px 16px; border-bottom: var(--border); background: var(--blue); color: #1d1a2f; display: flex; align-items: center; gap: 10px; }
  .msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 85%; }
  .msg.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg .who { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; margin-bottom: 3px; }
  .msg.me .who { justify-content: flex-end; }
  .msg .who b { font-family: Fredoka, sans-serif; font-size: 15px; cursor: pointer; }
  .msg .uid { font: 700 11px "JetBrains Mono", monospace; color: var(--ink-soft); }
  .bubble { background: var(--paper); border: var(--border); border-radius: 16px 16px 16px 4px; padding: 8px 12px; box-shadow: 3px 3px 0 var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.me .bubble { background: var(--yellow); color: #1d1a2f; border-radius: 16px 16px 4px 16px; }
  .msg.dev .bubble { background: #1d1a2f; color: #ffd84d; }
  .msg time { font-size: 11px; color: var(--ink-soft); margin-left: 4px; }
  .msg .del { border: 0; background: none; cursor: pointer; font-size: 12px; color: var(--ink-soft); padding: 0 2px; }
  .msg .avatar { cursor: pointer; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: var(--border); background: var(--paper); }
  .composer textarea { min-height: 46px; height: 46px; resize: none; }
</style>
</head>
<body>
<main class="wrap page" style="padding-bottom:20px">
  <section class="card chat">
    <div class="chat-head"><span style="font-size:24px"><span class="ms">chat</span></span><div><h3 style="margin:0">Live chat</h3><div class="small" style="font-weight:800">Ngobrol bareng user &amp; developer. Sopan ya!</div></div></div>
    <div class="msgs" id="msgs" aria-live="polite"><div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
    <form class="composer" id="form">
      <textarea id="text" maxlength="500" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)" aria-label="Pesan"></textarea>
      <button class="btn btn-pink">Kirim</button>
    </form>
  </section>
</main>
<dialog id="userModal" class="modal sm">
  <form method="dialog"><button class="btn modal-close" aria-label="Tutup"><span class="ms">close</span></button></form>
  <div class="modal-body" id="userBody"></div>
</dialog>
<script src="/assets/common.js"></script>
<script src="/assets/chat.js"></script>
</body>
</html>
