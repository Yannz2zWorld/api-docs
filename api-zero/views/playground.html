<!doctype html>
<html lang="id">
<head>
<!--HEAD-->
<title>Playground · API Zero</title>
</head>
<body>
<main class="wrap page">
  <div class="page-head row">
    <div><h1><span class="ms">attractions</span> Playground</h1><p class="muted" style="margin:0">Taman endpoint: pilih fitur, isi parameter, langsung coba.</p></div>
    <span class="spacer"></span>
    <div id="planInfo" class="row"></div>
  </div>
  <section class="card searchbar">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="Cari fitur… (tiktok, gpt, brat, cuaca)" autocomplete="off" aria-label="Cari endpoint">
  </section>
  <div class="row" style="margin-top:14px">
    <label class="row small" style="font-weight:800"><span class="ms">key</span> Key <select id="keySel" style="width:auto;max-width:260px;padding:6px 10px"></select></label>
    <label class="row small" style="font-weight:800"><span class="ms">diamond</span> Plan <select id="planFilter" style="width:auto;padding:6px 10px">
      <option value="all">Semua</option><option value="free">Gratis</option><option value="premium">Premium</option><option value="mine">Bisa kupakai</option></select></label>
  </div>
  <nav class="chips" id="chips" aria-label="Kategori"></nav>
  <p class="muted" style="font-weight:800" id="resultInfo"></p>
  <section id="list" aria-live="polite"><div class="loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></section>
</main>
<dialog id="modal" class="modal">
  <form method="dialog"><button class="btn modal-close" aria-label="Tutup"><span class="ms">close</span></button></form>
  <div class="modal-body" id="modalBody"></div>
</dialog>
<script src="/assets/common.js"></script>
<script src="/assets/playground.js"></script>
</body>
</html>
