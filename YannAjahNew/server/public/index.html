<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YannAjahNew Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <main class="wrap">
    <section class="panel login-card">
      <div class="brand"><span class="brand-mark">Y</span> YannAjahNew</div>
      <h2>Masuk ke dashboard</h2>
      <p class="muted">Login memakai akun Google. Akun baru otomatis berrank <b>MEMBER</b>; rank lain diberikan oleh atasanmu.</p>
      <p id="notice" class="banner hidden" role="alert"></p>
      <a id="google" class="btn primary" href="/auth/google">Masuk dengan Google</a>
      <p id="nogoogle" class="muted hidden">Google OAuth belum dikonfigurasi di server. Admin bisa membuat link login sekali pakai lewat CLI (<span class="mono">node server/cli.js login-link</span>).</p>
    </section>
  </main>
</body>
</html>
