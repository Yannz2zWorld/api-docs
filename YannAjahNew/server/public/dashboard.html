<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YannAjahNew Dashboard</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><span class="brand-mark">Y</span> YannAjahNew</div>
      <nav class="nav" id="nav" aria-label="Menu dashboard"></nav>
      <div class="actions"><span id="who" class="muted"></span><button class="btn small" id="logout" type="button">Keluar</button></div>
    </div>
  </header>
  <main class="wrap">
    <div id="maintenance-banner" class="banner hidden" role="status"></div>
    <div id="view"></div>
  </main>
  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
