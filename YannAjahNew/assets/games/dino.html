<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Dino Runner — YannAjah AI</title>
<style>html{background:#05070d;min-height:100%}</style>
</head>
<body>
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;padding:6px;background:transparent;font-family:Arial,sans-serif;color:#eee;touch-action:manipulation;cursor:pointer;display:flex;justify-content:center}
.container{width:100%;max-width:520px;margin:auto}
.card{background:#111628;border:1px solid rgba(255,255,255,.18);border-radius:18px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.header{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;align-items:center;background:#0c101d}
.body{padding:10px}
#game{width:100%;height:auto;aspect-ratio:480/300;background:#f7f7f7;border:1px solid rgba(255,255,255,.15);border-radius:14px;display:block}
.status{text-align:center;margin-top:8px;font-size:13px;font-weight:bold;color:rgba(255,255,255,.75)}
</style>

<div class="container">
<div class="card">
<div class="header">
  <div>
    <div style="font-size:10px;letter-spacing:1.5px;color:rgba(255,255,255,.5);font-weight:bold">Yann Ai</div>
    <div style="font-size:20px;font-weight:bold;color:#fff;letter-spacing:0.5px">🦖 Dino Runner</div>
  </div>
  <div style="text-align:right">
    <div id="score" style="font-size:26px;font-weight:bold;color:#ffd32a">00000</div>
    <div id="best" style="font-size:11px;color:rgba(255,255,255,.5);margin-top:2px">HI 00000</div>
  </div>
</div>
<div class="body">
<canvas id="game" width="480" height="300"></canvas>
<div id="status" class="status">TAP untuk melompat!</div>
</div></div></div>
<script>
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === "suspended") {
    audioCtx.resume();
  }
}

function playJumpSound() {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.setValueAtTime(900, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.13);
  } catch (e) {}
}

function playPointSound() {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(800, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.21);
  } catch (e) {}
}

function playHitSound() {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.21);
  } catch (e) {}
}

const c = document.getElementById("game");
const x = c.getContext("2d");
const scEl = document.getElementById("score");
const bsEl = document.getElementById("best");
const stEl = document.getElementById("status");
const W = 480;
const H = 300;
const GY = 240;

let dino, obstacles, clouds, score, best = 0, state = "idle", speed = 5.5, spawnTimer = 0, lastTime = 0;

try {
  best = parseInt(localStorage.getItem("dino_best")) || 0;
  bsEl.textContent = "HI " + pad(best, 5);
} catch(e) {}

function pad(n, len) {
  return String(Math.floor(n)).padStart(len, "0");
}

function saveB() {
  try {
    localStorage.setItem("dino_best", best);
  } catch(e) {}
}

function reset() {
  dino = { x: 50, y: GY - 36, w: 32, h: 36, vy: 0, jump: false, legTimer: 0 };
  obstacles = [];
  clouds = [{ x: 120, y: 50 }, { x: 300, y: 70 }, { x: 440, y: 40 }];
  score = 0;
  speed = 5.5;
  spawnTimer = 0;
  state = "idle";
  scEl.textContent = "00000";
  stEl.textContent = "TAP untuk lari & lompat!";
}

function jump() {
  initAudio();
  if (state === "dead") {
    reset();
    return;
  }
  if (state === "idle") {
    state = "play";
    stEl.textContent = "Lari! (Tap untuk melompat)";
  }
  if (!dino.jump) {
    dino.vy = -10.5;
    dino.jump = true;
    playJumpSound();
  }
}

c.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  jump();
});

document.addEventListener("keydown", function(e) {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

function drawDino() {
  x.fillStyle = "#535353";
  let dx = dino.x;
  let dy = dino.y;
  
  x.fillRect(dx + 16, dy, 16, 12);
  x.fillRect(dx + 12, dy + 2, 20, 10);
  x.fillStyle = "#f7f7f7";
  x.fillRect(dx + 18, dy + 2, 3, 3);
  x.fillStyle = "#535353";
  x.fillRect(dx + 22, dy + 8, 10, 2);
  x.fillRect(dx + 6, dy + 10, 14, 18);
  x.fillRect(dx + 2, dy + 14, 10, 12);
  x.fillRect(dx, dy + 16, 4, 6);
  x.fillRect(dx - 3, dy + 14, 4, 4);
  x.fillRect(dx + 18, dy + 14, 5, 3);
  x.fillRect(dx + 21, dy + 16, 2, 4);
  
  if (dino.jump) {
    x.fillRect(dx + 6, dy + 28, 4, 8);
    x.fillRect(dx + 14, dy + 28, 4, 8);
  } else {
    let step = Math.floor(dino.legTimer / 6) % 2;
    if (step === 0) {
      x.fillRect(dx + 6, dy + 28, 4, 8);
      x.fillRect(dx + 6, dy + 34, 6, 2);
      x.fillRect(dx + 14, dy + 28, 4, 4);
    } else {
      x.fillRect(dx + 6, dy + 28, 4, 4);
      x.fillRect(dx + 14, dy + 28, 4, 8);
      x.fillRect(dx + 14, dy + 34, 6, 2);
    }
  }
}

function drawCactus(obs) {
  x.fillStyle = "#535353";
  if (obs.type === "large") {
    x.fillRect(obs.x + 8, obs.y, 8, obs.h);
    x.fillRect(obs.x, obs.y + 10, 8, 4);
    x.fillRect(obs.x, obs.y + 6, 4, 6);
    x.fillRect(obs.x + 16, obs.y + 14, 8, 4);
    x.fillRect(obs.x + 20, obs.y + 8, 4, 8);
  } else if (obs.type === "triple") {
    for (let i = 0; i < 3; i++) {
      let ox = obs.x + i * 14;
      x.fillRect(ox + 4, obs.y, 6, obs.h);
      x.fillRect(ox, obs.y + 6, 4, 3);
      x.fillRect(ox + 10, obs.y + 8, 4, 3);
    }
  } else {
    x.fillRect(obs.x + 4, obs.y, 6, obs.h);
    x.fillRect(obs.x, obs.y + 6, 4, 3);
    x.fillRect(obs.x + 10, obs.y + 8, 4, 3);
  }
}

function drawBird(obs) {
  x.fillStyle = "#535353";
  let bx = obs.x;
  let by = obs.y;
  let wing = Math.floor(dino.legTimer / 8) % 2;
  x.fillRect(bx + 6, by + 6, 18, 6);
  x.fillRect(bx, by + 4, 6, 6);
  x.fillRect(bx - 4, by + 6, 4, 3);
  if (wing === 0) {
    x.fillRect(bx + 8, by, 8, 6);
  } else {
    x.fillRect(bx + 8, by + 12, 8, 6);
  }
}

function loop(currentTime) {
  if (!lastTime) lastTime = currentTime;
  let elapsed = currentTime - lastTime;
  lastTime = currentTime;

  let dt = elapsed / 16.67;
  if (dt > 2.5) dt = 1.0;

  let isNight = Math.floor(score / 400) % 2 === 1;
  x.fillStyle = isNight ? "#1e272e" : "#f7f7f7";
  x.fillRect(0, 0, W, H);

  x.fillStyle = isNight ? "rgba(255,255,255,0.12)" : "rgba(83,83,83,0.25)";
  clouds.forEach(function(cl) {
    if (state === "play") cl.x -= (speed * 0.25) * dt;
    if (cl.x < -60) cl.x = W + Math.random() * 80;
    x.fillRect(cl.x, cl.y, 40, 10);
    x.fillRect(cl.x + 8, cl.y - 5, 24, 6);
  });

  x.fillStyle = isNight ? "#718093" : "#535353";
  x.fillRect(0, GY, W, 2);
  for (let i = 0; i < 20; i++) {
    let gx = (i * 28 - (score * 4) % 28);
    x.fillRect(gx, GY + 5, 6, 1.5);
    x.fillRect(gx + 12, GY + 10, 4, 1.5);
  }

  if (state === "play") {
    score += 0.18 * dt;
    speed = 5.5 + Math.min(8, (score * 0.005));
    dino.legTimer += dt;

    let displayScore = Math.floor(score);
    scEl.textContent = pad(displayScore, 5);

    if (displayScore > 0 && displayScore % 100 === 0 && Math.floor(score - 0.18 * dt) < displayScore) {
      playPointSound();
    }

    if (displayScore > best) {
      best = displayScore;
      saveB();
      bsEl.textContent = "HI " + pad(best, 5);
    }

    dino.vy += 0.62 * dt;
    dino.y += dino.vy * dt;
    if (dino.y >= GY - 36) {
      dino.y = GY - 36;
      dino.vy = 0;
      dino.jump = false;
    }

    spawnTimer += dt;
    if (spawnTimer >= 70 + Math.random() * 50) {
      spawnTimer = 0;
      let rand = Math.random();
      if (score > 120 && rand < 0.3) {
        let flyY = GY - 45 - (Math.random() > 0.5 ? 25 : 0);
        obstacles.push({ x: W, y: flyY, w: 26, h: 18, isBird: true });
      } else {
        let type = rand < 0.4 ? "large" : (rand < 0.7 ? "triple" : "single");
        let w = type === "triple" ? 42 : (type === "large" ? 24 : 16);
        let h = type === "large" ? 38 : 28;
        obstacles.push({ x: W, y: GY - h, w: w, h: h, type: type, isBird: false });
      }
    }

    for (let i = 0; i < obstacles.length; i++) {
      let obs = obstacles[i];
      obs.x -= speed * dt;

      let bx = dino.x + 6;
      let by = dino.y + 4;
      let bw = dino.w - 10;
      let bh = dino.h - 6;

      if (bx + bw > obs.x + 4 && bx < obs.x + obs.w - 4 &&
          by + bh > obs.y && by < obs.y + obs.h) {
        state = "dead";
        playHitSound();
        stEl.textContent = "GAME OVER - Skor: " + displayScore + " (Tap untuk main lagi)";
      }
    }

    if (obstacles.length > 0 && obstacles[0].x < -60) {
      obstacles.shift();
    }
  }

  obstacles.forEach(function(obs) {
    if (obs.isBird) drawBird(obs);
    else drawCactus(obs);
  });

  drawDino();

  if (state === "dead") {
    x.fillStyle = isNight ? "rgba(0,0,0,0.55)" : "rgba(255,255,255,0.55)";
    x.fillRect(0, 0, W, H);

    x.font = "900 24px Arial Black, Arial";
    x.textAlign = "center";
    x.fillStyle = isNight ? "#fff" : "#535353";
    x.fillText("G A M E   O V E R", W / 2, H / 2 - 20);

    x.font = "900 13px Arial";
    x.fillText("▶ TAP UNTUK MAIN LAGI", W / 2, H / 2 + 20);
  }

  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(function(time) {
  lastTime = time;
  loop(time);
});
</script>
</body>
</html>
