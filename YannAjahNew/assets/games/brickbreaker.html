<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Brick Breaker — YannAjah AI</title>
<style>html{background:#05070d;min-height:100%}</style>
</head>
<body>
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
body{margin:0;padding:6px;background:transparent;font-family:Arial,sans-serif;color:#eee;touch-action:manipulation;display:flex;justify-content:center}
.container{width:100%;max-width:480px;margin:auto}
.card{background:#0e1220;border:1px solid rgba(162,155,254,.3);border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.7)}
.header{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;background:#080a14}
.body{padding:10px}
#game{width:100%;height:auto;aspect-ratio:440/460;background:#060810;border:1px solid rgba(162,155,254,.2);border-radius:12px;display:block}
.controls{display:flex;gap:10px;margin-top:10px}
.btn-ctrl{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:18px;font-weight:bold;height:46px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn-ctrl:active{background:rgba(162,155,254,.3);transform:scale(.95)}
.status{text-align:center;margin-top:6px;font-size:12px;color:rgba(255,255,255,.7)}
</style>

<div class="container">
<div class="card">
<div class="header">
  <div>
    <div style="font-size:10px;letter-spacing:1.5px;color:#a29bfe;font-weight:bold">Yann Ai</div>
    <div style="font-size:20px;font-weight:bold;color:#fff">🧱 Brick Breaker</div>
  </div>
  <div style="text-align:right">
    <div id="score" style="font-size:24px;font-weight:bold;color:#a29bfe">0</div>
    <div id="best" style="font-size:10px;color:rgba(255,255,255,.5);margin-top:2px">BEST 0</div>
  </div>
</div>
<div class="body">
<canvas id="game" width="440" height="460"></canvas>
<div class="controls">
  <div class="btn-ctrl" id="btnL">⬅️ KIRI</div>
  <div class="btn-ctrl" id="btnR">KANAN ➡️</div>
</div>
<div id="status" class="status">Geser papan / tap layar untuk pantulkan bola!</div>
</div></div></div>
<script>
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
}

function playBounceSound(pitch) {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(pitch || 500, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime((pitch || 500) * 1.3, audioCtx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.06);
  } catch(e) {}
}

function playBrickSound() {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(750, audioCtx.currentTime);
    osc.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.06);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.16);
  } catch(e) {}
}

function playDeadSound() {
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(220, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.26);
  } catch(e) {}
}

const c = document.getElementById("game");
const x = c.getContext("2d");
const scEl = document.getElementById("score");
const bsEl = document.getElementById("best");
const stEl = document.getElementById("status");
const W = 440;
const H = 460;

let paddle, ball, bricks, particles, score = 0, best = 0, lives = 3, state = "idle", lastTime = 0;

try {
  best = parseInt(localStorage.getItem("brick_best")) || 0;
  bsEl.textContent = "BEST " + best;
} catch(e) {}

function saveB() {
  try { localStorage.setItem("brick_best", best); } catch(e) {}
}

function initBricks() {
  bricks = [];
  const rows = 5;
  const cols = 7;
  const bW = 54;
  const bH = 18;
  const bGap = 6;
  const startX = (W - (cols * bW + (cols - 1) * bGap)) / 2;
  const startY = 45;
  const colors = ["#ff4d4d", "#ff9f43", "#ffd32a", "#2ed573", "#1e90ff"];

  for (let r = 0; r < rows; r++) {
    for (let col = 0; col < cols; col++) {
      bricks.push({
        x: startX + col * (bW + bGap),
        y: startY + r * (bH + bGap),
        w: bW,
        h: bH,
        color: colors[r % colors.length],
        points: (rows - r) * 10,
        alive: true
      });
    }
  }
}

function reset() {
  paddle = { x: W / 2 - 40, y: H - 35, w: 80, h: 14, speed: 6.5, movingL: false, movingR: false };
  ball = { x: W / 2, y: H - 55, vx: 3.2 * (Math.random() > 0.5 ? 1 : -1), vy: -4.5, r: 6 };
  particles = [];
  score = 0;
  lives = 3;
  state = "idle";
  initBricks();
  scEl.textContent = "0";
  stEl.textContent = "TAP Layar / Geser papan untuk mulai!";
}

function launch() {
  initAudio();
  if (state === "dead" || state === "win") {
    reset();
    return;
  }
  if (state === "idle") {
    state = "play";
    stEl.textContent = "❤️ Nyawa: " + lives;
  }
}

const btnL = document.getElementById("btnL");
const btnR = document.getElementById("btnR");

btnL.addEventListener("touchstart", function(e) { e.preventDefault(); paddle.movingL = true; launch(); }, { passive: false });
btnL.addEventListener("touchend", function(e) { e.preventDefault(); paddle.movingL = false; }, { passive: false });
btnR.addEventListener("touchstart", function(e) { e.preventDefault(); paddle.movingR = true; launch(); }, { passive: false });
btnR.addEventListener("touchend", function(e) { e.preventDefault(); paddle.movingR = false; }, { passive: false });

btnL.addEventListener("mousedown", function(e) { e.preventDefault(); paddle.movingL = true; launch(); });
btnL.addEventListener("mouseup", function(e) { e.preventDefault(); paddle.movingL = false; });
btnR.addEventListener("mousedown", function(e) { e.preventDefault(); paddle.movingR = true; launch(); });
btnR.addEventListener("mouseup", function(e) { e.preventDefault(); paddle.movingR = false; });

c.addEventListener("pointerdown", function(e) {
  e.preventDefault();
  let rect = c.getBoundingClientRect();
  paddle.x = Math.max(10, Math.min(W - paddle.w - 10, (e.clientX - rect.left) * (W / rect.width) - paddle.w / 2));
  launch();
});

c.addEventListener("pointermove", function(e) {
  if (e.buttons === 1 || e.pointerType === "touch") {
    let rect = c.getBoundingClientRect();
    paddle.x = Math.max(10, Math.min(W - paddle.w - 10, (e.clientX - rect.left) * (W / rect.width) - paddle.w / 2));
  }
});

document.addEventListener("keydown", function(e) {
  if (e.code === "ArrowLeft" || e.code === "KeyA") paddle.movingL = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") paddle.movingR = true;
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); launch(); }
});

document.addEventListener("keyup", function(e) {
  if (e.code === "ArrowLeft" || e.code === "KeyA") paddle.movingL = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") paddle.movingR = false;
});

function createExplosion(x, y, color) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 5,
      vy: (Math.random() - 0.5) * 5,
      color: color,
      life: 18
    });
  }
}

function loop(currentTime) {
  if (!lastTime) lastTime = currentTime;
  let elapsed = currentTime - lastTime;
  lastTime = currentTime;

  let dt = elapsed / 16.67;
  if (dt > 2.5) dt = 1.0;

  x.fillStyle = "#060810";
  x.fillRect(0, 0, W, H);

  if (state === "play") {
    if (paddle.movingL) paddle.x = Math.max(10, paddle.x - paddle.speed * dt);
    if (paddle.movingR) paddle.x = Math.min(W - paddle.w - 10, paddle.x + paddle.speed * dt);

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    if (ball.x - ball.r < 0) {
      ball.x = ball.r;
      ball.vx = Math.abs(ball.vx);
      playBounceSound(400);
    } else if (ball.x + ball.r > W) {
      ball.x = W - ball.r;
      ball.vx = -Math.abs(ball.vx);
      playBounceSound(400);
    }

    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy = Math.abs(ball.vy);
      playBounceSound(450);
    }

    if (ball.y + ball.r >= paddle.y && ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x - 4 && ball.x <= paddle.x + paddle.w + 4) {
      ball.vy = -Math.abs(ball.vy);
      let hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      ball.vx = hitOffset * 5.0;
      ball.y = paddle.y - ball.r;
      playBounceSound(600);
    }

    let aliveCount = 0;
    for (let i = 0; i < bricks.length; i++) {
      let b = bricks[i];
      if (b.alive) {
        aliveCount++;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
            ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          ball.vy *= -1;
          score += b.points;
          scEl.textContent = score;
          playBrickSound();
          createExplosion(b.x + b.w / 2, b.y + b.h / 2, b.color);

          if (score > best) {
            best = score;
            saveB();
            bsEl.textContent = "BEST " + best;
          }
          break;
        }
      }
    }

    if (aliveCount === 0) {
      state = "win";
      stEl.textContent = "🎉 LEVEL BERSIH! (Tap untuk main lagi)";
    }

    if (ball.y - ball.r > H) {
      lives--;
      playDeadSound();
      if (lives <= 0) {
        state = "dead";
        stEl.textContent = "GAME OVER! Skor: " + score + " (Tap untuk main lagi)";
      } else {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = H - 55;
        ball.vx = 3.2 * (Math.random() > 0.5 ? 1 : -1);
        ball.vy = -4.5;
        stEl.textContent = "❤️ Nyawa tersisa: " + lives;
      }
    }
  }

  bricks.forEach(function(b) {
    if (b.alive) {
      x.fillStyle = b.color;
      x.beginPath();
      x.roundRect(b.x, b.y, b.w, b.h, 4);
      x.fill();
    }
  });

  x.fillStyle = "#a29bfe";
  x.beginPath();
  x.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
  x.fill();

  x.fillStyle = "#ffd32a";
  x.beginPath();
  x.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
  x.fill();

  for (let i = 0; i < particles.length; i++) {
    let p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;
    x.fillStyle = p.color;
    x.fillRect(p.x, p.y, 3, 3);
    if (p.life <= 0) {
      particles.splice(i, 1);
      i--;
    }
  }

  if (state === "dead" || state === "win") {
    x.fillStyle = "rgba(0, 0, 0, 0.65)";
    x.fillRect(0, 0, W, H);

    x.font = "900 24px Arial Black, Arial";
    x.textAlign = "center";
    x.fillStyle = state === "win" ? "#2ed573" : "#ff4d4d";
    x.fillText(state === "win" ? "VICTORY!" : "GAME OVER", W / 2, H / 2 - 20);

    x.font = "900 13px Arial";
    x.fillStyle = "#fff";
    x.fillText("TAP UNTUK MAIN LAGI", W / 2, H / 2 + 20);
  } else if (state === "idle") {
    x.fillStyle = "rgba(0, 0, 0, 0.35)";
    x.fillRect(0, 0, W, H);

    x.font = "900 22px Arial Black, Arial";
    x.textAlign = "center";
    x.fillStyle = "#a29bfe";
    x.fillText("BRICK BREAKER", W / 2, H / 2 - 20);

    x.font = "12px Arial";
    x.fillStyle = "#fff";
    x.fillText("Geser papan / tap tombol untuk Mulai", W / 2, H / 2 + 15);
  }

  requestAnimationFrame(loop);
}

reset();
requestAnimationFrame(function(time) {
  lastTime = time;
  loop(time);
});
</script>
</body>
</html>
