<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing — Yannz API</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#fffdf7;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:28px 18px}h1{font-size:42px}.panel{border:3px solid #111;padding:20px;background:#fff;box-shadow:6px 6px #111;margin:20px 0}select,button{font:inherit;padding:11px;border:2px solid #111}button{background:#ffe45e;font-weight:800;cursor:pointer;box-shadow:3px 3px #111}.item{border-top:2px solid #ddd;padding:14px 0;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main class="wrap"><a href="/home">← Home</a><h1>Billing & Orders</h1><section class="panel"><h2>New order</h2><select id="tier"><option>SULTAN</option><option>SEPUH</option><option>DEWA</option></select><button onclick="makeOrder()">Create order</button><p id="notice"></p><p style="font-size:13px">Untuk pembayaran manual, siapkan URL HTTPS bukti pembayaran (mis. file yang sudah diunggah ke storage). Gateway otomatis tidak membutuhkan bukti manual.</p></section><section class="panel"><h2>Orders</h2><div id="orders">Loading…</div></section></main><script>async function api(p,o={}){let r=await fetch(p,{credentials:'same-origin',...o});let d=await r.json();if(!r.ok)throw Error(d.message||d.error);return d}let orderRequestKey=crypto.randomUUID();async function makeOrder(){try{let d=await api('/api/orders',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':orderRequestKey},body:JSON.stringify({tier:document.getElementById('tier').value})});orderRequestKey=crypto.randomUUID();notice.textContent=`Order ${d.order.order_code} dibuat. Pilih metode di daftar order.`;load()}catch(e){notice.textContent=e.message}}async function pay(id,kind,method){try{let body={method};if(kind==='manual'){const proof=prompt('Masukkan URL HTTPS bukti pembayaran:');if(!proof)return;body.proof_url=proof.trim()}let d=await api(`/api/orders/${id}/${kind}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});alert(JSON.stringify(d.gateway||d.payment||d,null,2));load()}catch(e){alert(e.message)}}async function load(){try{let d=await api('/api/orders');orders.innerHTML=d.orders.map(o=>`<div class="item"><b>${o.order_code}</b> · ${o.tier} · Rp${Number(o.amount).toLocaleString('id-ID')} · ${o.status}<br><small>${new Date(o.created_at).toLocaleString()}</small>${o.status==='pending'?`<p><select id="m-${o.id}"><option value="qris">QRIS (Pakasir)</option><option value="payment_link">Payment Link</option>${Number(o.amount)>=10000?'<option value="bri_va">BRI VA</option><option value="bni_va">BNI VA</option>':''}<option value="DANA">DANA manual</option><option value="GOPAY">GoPay manual</option><option value="QRIS">QRIS manual</option><option value="BANK_TRANSFER">Bank transfer manual</option></select> <button onclick="startPay('${o.id}')">Continue</button></p>`:''}</div>`).join('')||'No orders.'}catch(e){orders.textContent=e.message}}async function startPay(id){const m=document.getElementById('m-'+id).value;await pay(id,['DANA','GOPAY','QRIS','BANK_TRANSFER'].includes(m)?'manual':'pakasir',m)}load();</script></body></html>
