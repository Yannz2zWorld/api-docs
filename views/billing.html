<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Billing — Yannz API</title>
<link rel="icon" href="/api/logo-proxy">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/home"><span class="brand-mark">Y</span>Yannz API</a><nav class="nav" aria-label="Navigasi utama"><a href="/home">Dashboard</a><a href="/api">Sandbox</a><a href="/keys">Keys</a><a href="/billing" aria-current="page">Billing</a><a href="/pricing">Pricing</a></nav></div></header>
<main class="wrap">
  <h1>Billing &amp; Orders</h1>
  <p class="lead loading" id="current">Memuat akun…</p>

  <section class="panel">
    <h2>Order baru</h2>
    <div class="row"><select id="tier" aria-label="Paket"></select><button id="order-btn" class="primary" type="button">Buat order</button></div>
    <p id="notice" aria-live="polite"></p>
    <p><small>Harga ditentukan server. Order berlaku 2 jam. Tier baru aktif hanya setelah pembayaran terverifikasi server atau disetujui owner.</small></p>
  </section>

  <section class="panel">
    <h2>Riwayat order</h2>
    <div id="orders" aria-live="polite"><p class="loading">Memuat order…</p></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rp = n => 'Rp' + Number(n).toLocaleString('id-ID');
const when = v => v ? new Date(v).toLocaleString('id-ID') : '—';
const LABEL = { qris: 'QRIS (otomatis)', payment_link: 'Payment link (otomatis)', bri_va: 'BRI VA', bni_va: 'BNI VA', cimb_niaga_va: 'CIMB Niaga VA', permata_va: 'Permata VA', maybank_va: 'Maybank VA', bnc_va: 'BNC VA', artha_graha_va: 'Artha Graha VA', sampoerna_va: 'Sampoerna VA', DANA: 'DANA (manual)', GOPAY: 'GoPay (manual)', QRIS: 'QRIS (manual)', BANK_TRANSFER: 'Transfer bank (manual)' };
let ctx = { gatewayMethods: [], manualMethods: [], gatewayConfigured: false };
let orderKey = crypto.randomUUID();

async function api(url, opts = {}) {
  const r = await fetch(url, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { location.replace('/'); throw Error('Sesi berakhir.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Error(`${d.message || 'Permintaan gagal.'} (${d.error || r.status})`);
  return d;
}

async function loadPlans() {
  try {
    const [dash, t] = await Promise.all([api('/api/dashboard'), api('/api/tiers')]);
    const rank = ['FREE', 'SULTAN', 'SEPUH', 'DEWA', 'OWNER'];
    const mine = rank.indexOf(dash.user.tier);
    $('#current').classList.remove('loading');
    $('#current').textContent = `Tier saat ini: ${dash.user.tier}.`;
    const options = t.tiers.filter(x => x.purchasable && rank.indexOf(x.name) > mine);
    $('#tier').innerHTML = options.map(x => `<option value="${esc(x.name)}">${esc(x.name)} — ${rp(x.price)} · ${Number(x.dailyLimit).toLocaleString('id-ID')} req/hari</option>`).join('');
    const want = new URLSearchParams(location.search).get('tier');
    if (want && options.some(o => o.name === want)) $('#tier').value = want;
    $('#order-btn').disabled = !options.length;
    if (!options.length) $('#notice').textContent = 'Kamu sudah berada di paket tertinggi.';
  } catch (e) { $('#current').textContent = e.message; }
}

function paymentState(o) {
  if (o.status === 'paid') return '<div class="box">✅ Lunas &amp; terverifikasi. Tier sudah aktif.</div>';
  if (o.status !== 'pending') return `<div class="box">Order ${esc(o.status)}.${o.status === 'expired' ? ' Buat order baru bila ingin membeli lagi.' : ''}</div>`;
  if (o.provider === 'manual' && o.payment_status === 'pending') return '<div class="box">⏳ Bukti terkirim — menunggu approval owner. Tier belum berubah.</div>';
  let gateway = '';
  if (o.provider === 'pakasir' && o.payment_status === 'pending') {
    gateway = `<div class="box">⏳ Menunggu pembayaran &amp; verifikasi server.${o.payment_url ? ` <a href="${esc(o.payment_url)}" target="_blank" rel="noopener noreferrer">Buka halaman pembayaran</a>` : ''}${o.va_number ? `<br>Nomor VA: <code>${esc(o.va_number)}</code>` : ''}${o.qr_string ? `<br>QR string: <code>${esc(o.qr_string)}</code>` : ''}${o.gateway_expires_at ? `<br><small>Berlaku sampai ${when(o.gateway_expires_at)}</small>` : ''}</div>`;
  }
  const methods = [...(ctx.gatewayConfigured ? ctx.gatewayMethods.filter(m => m === 'qris' || m === 'payment_link' || Number(o.amount) >= 10000) : []), ...ctx.manualMethods];
  return gateway + `<form class="row" data-pay="${esc(o.id)}" style="margin-top:10px">
    <select name="method" aria-label="Metode pembayaran">${methods.map(m => `<option value="${esc(m)}">${esc(LABEL[m] || m)}</option>`).join('')}</select>
    <input name="proof" type="url" placeholder="URL HTTPS bukti transfer (khusus manual)" aria-label="URL bukti pembayaran">
    <button class="primary" type="submit">Lanjutkan</button>
  </form>`;
}

async function loadOrders() {
  try {
    const d = await api('/api/orders');
    ctx = d;
    const help = [d.manualInstructions ? esc(d.manualInstructions) : 'Untuk pembayaran manual, hubungi owner untuk nomor tujuan, lalu kirim URL HTTPS bukti transfer (mis. tautan file di Google Drive/storage).', d.contact ? `Kontak: <a href="${esc(d.contact)}" target="_blank" rel="noopener noreferrer">WhatsApp owner</a>` : '', d.gatewayConfigured ? '' : 'Pembayaran otomatis belum aktif.'].filter(Boolean).join(' ');
    $('#orders').innerHTML = (d.orders.length ? d.orders.map(o => `<div class="order"><b>${esc(o.order_code)}</b> · ${esc(o.tier)} · ${rp(o.amount)}<br><span class="chip ${esc(o.status)}">order: ${esc(o.status)}</span>${o.payment_status ? `<span class="chip ${esc(o.payment_status)}">bayar: ${esc(o.payment_status)}</span>` : ''}<br><small>Dibuat ${when(o.created_at)}${o.status === 'pending' ? ' · berlaku sampai ' + when(o.expires_at) : ''}${o.paid_at ? ' · lunas ' + when(o.paid_at) : ''}</small>${paymentState(o)}</div>`).join('') : '<p>Belum ada order.</p>') + `<p><small>${help}</small></p>`;
  } catch (e) { $('#orders').innerHTML = `<p class="error">${esc(e.message)}</p>`; }
}

$('#order-btn').addEventListener('click', async () => {
  const btn = $('#order-btn'); btn.disabled = true; $('#notice').textContent = 'Membuat order…';
  try {
    const d = await api('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Idempotency-Key': orderKey }, body: JSON.stringify({ tier: $('#tier').value }) });
    orderKey = crypto.randomUUID();
    $('#notice').textContent = `Order ${d.order.order_code} dibuat (${rp(d.order.amount)}). Pilih metode pembayaran di bawah.`;
    loadOrders();
  } catch (e) { $('#notice').textContent = e.message; }
  finally { btn.disabled = false; }
});

$('#orders').addEventListener('submit', async e => {
  const form = e.target.closest('form[data-pay]'); if (!form) return;
  e.preventDefault();
  const id = form.dataset.pay, method = form.querySelector('[name=method]').value, manual = ctx.manualMethods.includes(method);
  const body = { method };
  if (manual) {
    body.proof_url = form.querySelector('[name=proof]').value.trim();
    if (!/^https:\/\//i.test(body.proof_url)) { alert('Pembayaran manual butuh URL HTTPS bukti transfer.'); return; }
  }
  form.querySelector('button').disabled = true;
  try {
    await api(`/api/orders/${encodeURIComponent(id)}/${manual ? 'manual' : 'pakasir'}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch (err) { alert(err.message); }
  loadOrders();
});

loadPlans();
loadOrders();
</script>
</body>
</html>
