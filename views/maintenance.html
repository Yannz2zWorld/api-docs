<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Maintenance — Yannz API</title>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/i18n.js"></script>
<script src="/assets/ui-theme.js"></script>
<script src="/assets/scythe-color.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .box { max-width: 520px; width: 100%; text-align: center; }
  .mark { width: 120px; height: auto; margin: 0 auto 18px; display: block; filter: drop-shadow(0 0 22px color-mix(in srgb, var(--scythe-fx, #c8202f) 45%, transparent)); animation: float 3.2s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-8px); } }
  @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  h1 { margin: 6px 0 10px; }
  .msg { white-space: pre-line; overflow-wrap: anywhere; }
  .dots::after { content: ''; animation: dots 1.6s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .owner { margin-top: 26px; font-size: 13px; }
  .lang-row { margin: 0 0 16px; }
</style>
</head>
<body>
<main class="box panel">
  <div class="lang-row"><div data-lang-switch></div></div>
  <img class="mark" src="/assets/scythe-mark.webp" data-scythe-mark alt="">
  <span class="kicker">Info Maintenance</span>
  <h1>Website lagi maintenance</h1>
  <p class="msg" data-no-i18n>{{MESSAGE}}</p>
  <p class="muted">Kami lagi benerin website-nya. Tunggu bentar sampai maintenance selesai, terus muat ulang halaman ini<span class="dots"></span></p>
  <p><button type="button" class="primary" onclick="location.reload()">Coba lagi</button></p>
  <p class="owner muted"><a href="/developer-login">Masuk sebagai developer</a></p>
</main>
</body>
</html>
