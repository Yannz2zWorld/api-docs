<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0b0b0c">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crimson Requiem 3D — Yannz API</title>
<link rel="icon" href="/api/logo-proxy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Same visual language as the rest of Yannz API: dark neutral surfaces, 2px borders, hard offset shadows,
   Space Grotesk / Outfit / DM Mono, one crimson accent. */
:root{
  --bg:#0b0b0c; --surface:#141416; --surface-2:#1b1b1e; --surface-3:#232327;
  --ink:#f4f4f5; --muted:#a1a1aa; --faint:#71717a; --edge:#d4d4d8; --edge-soft:#3f3f46; --drop:#3f3f46;
  --red:#c8202f; --red-deep:#a3172a; --red-ink:#fff;
  --stage-core:#2a2a2e; --stage-edge:#0b0b0c;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.5 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:var(--red);color:#fff}
#stage{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 42%,var(--stage-core) 0%,#18181b 40%,var(--stage-edge) 78%)}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}

.hud{position:fixed;left:0;right:0;z-index:5;pointer-events:none;display:flex;justify-content:center}
.hud>*{pointer-events:auto}
.top{top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
.bottom{bottom:0;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}

.plate{background:var(--surface);border:2px solid var(--edge);border-radius:12px;box-shadow:5px 5px 0 var(--drop)}
.title{width:min(100%,720px);display:flex;align-items:center;gap:14px;padding:10px 14px}
.back{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:2px solid var(--edge);border-radius:9px;background:var(--surface-2);color:var(--ink);
  font:500 10px "DM Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;box-shadow:3px 3px 0 var(--drop);transition:transform .15s,box-shadow .15s,background .15s}
.back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--red-deep);background:var(--surface-3)}
.back:focus-visible,.btn:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.back b{width:22px;height:22px;border-radius:6px;background:var(--red);color:#fff;display:grid;place-items:center;font:800 11px "Space Grotesk",sans-serif}
.title .grow{flex:1;min-width:0}
.title h1{margin:0;font:700 clamp(20px,4.6vw,26px)/1.05 "Space Grotesk",sans-serif;letter-spacing:-.04em;color:var(--ink)}
.title p{margin:3px 0 0;font:500 10px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat{font:500 10px/1.5 "DM Mono",monospace;letter-spacing:.04em;color:var(--muted);text-align:right;white-space:nowrap;padding-left:12px;border-left:2px solid var(--edge-soft)}
.stat b{color:var(--ink);font:700 15px "Space Grotesk",sans-serif;letter-spacing:-.02em}

.dock{width:min(100%,760px);padding:10px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 4px 5px 2px}
.row::-webkit-scrollbar{display:none}
.btn{flex:0 0 auto;appearance:none;border:2px solid var(--edge-soft);background:var(--surface-2);color:var(--ink);cursor:pointer;
  font:500 10px/1 "DM Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;padding:10px 12px;border-radius:9px;
  transition:transform .15s,box-shadow .15s,background .15s,border-color .15s}
.btn:hover{border-color:var(--edge);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--drop)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:3px 3px 0 var(--red-deep)}
.toggles .btn{padding:8px 11px}
.toggles .btn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:7px;vertical-align:0;background:var(--faint)}
.toggles .btn[aria-pressed="true"]::before{background:var(--red)}
.attacks{gap:8px}
.atk{flex:1 0 auto;padding:12px 14px;font-weight:500;border-color:var(--edge);background:var(--surface-3)}
.atk:active{transform:translate(1px,1px);box-shadow:none}
.atk.firing{background:var(--red);border-color:var(--red);color:#fff;box-shadow:3px 3px 0 var(--red-deep)}
.atk.combo{border-style:dashed}
.ctl{flex:1 0 auto;padding:12px 14px;background:var(--red);border-color:var(--red);color:#fff;box-shadow:3px 3px 0 var(--red-deep)}
.ctl:hover{border-color:var(--red);box-shadow:4px 4px 0 var(--red-deep)}
.ctl[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fs{flex:0 0 auto}
.ctrlhint{display:none;font-size:13px;line-height:1.4;color:var(--muted);padding:0 4px}
body.ctrl .ctrlhint{display:block}
body.ctrl #views, body.ctrl .toggles{display:none}
.world-ui{display:none}
body.world .world-ui{display:flex}
body.world .ctrlhint{display:none}
#joy{position:fixed;left:calc(env(safe-area-inset-left,0px) + 14px);bottom:var(--joyB,110px);width:104px;height:104px;border-radius:50%;z-index:6;align-items:center;justify-content:center;background:rgba(20,20,22,.7);border:2px solid var(--edge-soft);touch-action:none}
#joy .knob{width:44px;height:44px;border-radius:50%;background:var(--red);border:2px solid var(--edge);pointer-events:none}
#vbtns{position:fixed;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:var(--joyB,110px);z-index:6;flex-direction:column;gap:8px}
#vbtns button{width:42px;height:42px;border-radius:9px;border:2px solid var(--edge-soft);background:var(--surface-2);color:var(--ink);font:500 12px/1 "DM Mono",monospace;touch-action:none;padding:0;box-shadow:3px 3px 0 var(--drop)}
#vbtns button.on{background:var(--red);border-color:var(--red);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 96px);transform:translateX(-50%);z-index:7;width:max-content;max-width:min(92vw,520px);
  padding:10px 14px;border:2px solid var(--edge);border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:4px 4px 0 var(--drop);
  font:500 13px/1.45 Outfit,sans-serif;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
.hint{font:500 10px "DM Mono",monospace;letter-spacing:.04em;color:var(--faint);padding:0 4px;white-space:nowrap;align-self:center}
body.world .title p{display:none}
body.world .title{padding:6px 12px}
body.world .title h1{font-size:19px}
body.world .atk{display:none}
body.world .dock{width:auto;padding:6px}
body.world .attacks .ctl{padding:8px 14px}
@media (orientation: landscape) and (max-height: 560px){
  .top{padding-top:calc(env(safe-area-inset-top,0px) + 6px)}
  .title{padding:5px 10px;width:min(100%,560px)}
  .title p,.hint{display:none}
  .title h1{font-size:18px}
  .back{height:32px}
  .dock{padding:6px;gap:5px;width:min(100%,900px)}
  .btn{padding:7px 10px}
  .atk,.ctl{padding:8px 11px}
  #joy{width:88px;height:88px}
  #joy .knob{width:38px;height:38px}
  #vbtns{flex-direction:row}
  #toast{top:calc(env(safe-area-inset-top,0px) + 50px)}
  .floattxt{font-size:18px}
}
@media (max-width:560px){ .title p{display:none} .stat{display:none} }
#flash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(170,10,30,.5) 100%)}
#flash.go{animation:flash .38s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.floattxt{position:fixed;z-index:5;pointer-events:none;transform:translate(-50%,-50%);font:700 22px/1 "Space Grotesk",sans-serif;letter-spacing:-.03em;color:#fff;
  text-shadow:3px 3px 0 var(--red-deep);animation:floatup .9s ease-out forwards}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}

#loader{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--ink);background:var(--bg);transition:opacity .4s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .sigil{width:44px;height:44px;border:2px solid var(--edge-soft);border-top-color:var(--red);border-radius:50%;animation:spin .9s linear infinite}
#loader .msg{font:500 11px "DM Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);max-width:32ch;text-align:center;line-height:1.5}
#loader.err .sigil{display:none}
#loader.err .msg{color:#fca5a5}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){#loader .sigil{animation-duration:3s}}
</style>
</head>
<body>
<div id="stage" aria-label="Tampilan 3D sabit. Geser untuk memutar, cubit atau scroll untuk zoom, dua jari untuk menggeser."></div>

<header class="hud top">
  <div class="title plate">
    <a class="back" href="/home" aria-label="Kembali ke dashboard Yannz API"><b>Y</b>Dashboard</a>
    <div class="grow">
      <h1>Crimson Requiem</h1>
      <p>Sabit tulang, baja hitam, dan cahaya merah darah</p>
    </div>
    <div class="stat" id="stats">menempa…</div>
  </div>
</header>

<nav class="hud bottom" aria-label="Kontrol">
  <div class="dock plate">
    <div class="row attacks" role="group" aria-label="Serangan">
      <button class="btn ctl" id="tCtrl" aria-pressed="false">Kendalikan</button>
      <button class="btn fs" id="tFull">Layar penuh</button>
      <button class="btn atk" data-move="slash" title="Tombol 1">Tebasan</button>
      <button class="btn atk" data-move="slam" title="Tombol 2">Hantaman</button>
      <button class="btn atk" data-move="spin" title="Tombol 3">Putaran</button>
      <button class="btn atk combo" data-move="combo" title="Spasi">Kombo</button>
    </div>
    <div class="ctrlhint">Seret jari memutari titik merah di gagang untuk mengayun sabit. Ayun cepat untuk tebasan, hantam ke tanah untuk ledakan, ketuk 2× untuk Putaran.</div>
    <div class="row" id="views" role="group" aria-label="Sudut kamera">
      <button class="btn" data-view="full">Seluruh senjata</button>
      <button class="btn" data-view="battle">Arena</button>
      <button class="btn" data-view="head">Bilah &amp; kepala</button>
      <button class="btn" data-view="front">Depan</button>
      <button class="btn" data-view="back">Belakang</button>
      <button class="btn" data-view="left">Kiri</button>
      <button class="btn" data-view="right">Kanan</button>
      <button class="btn" data-view="qfront">¾ depan</button>
      <button class="btn" data-view="qback">¾ belakang</button>
    </div>
    <div class="row toggles" role="group" aria-label="Opsi tampilan">
      <button class="btn" id="tSound" aria-pressed="true">Suara</button>
      <button class="btn" id="tRotate" aria-pressed="false">Putar otomatis</button>
      <button class="btn" id="tGlow" aria-pressed="true">Cahaya merah</button>
      <button class="btn" id="tSway" aria-pressed="true">Kain bergoyang</button>
      <button class="btn" id="tAura" aria-pressed="true">Aura gelap</button>
      <button class="btn" id="tPose" aria-pressed="false">Pose miring</button>
      <button class="btn" id="tWire" aria-pressed="false">Wireframe</button>
      <span class="hint">Geser untuk memutar, cubit untuk zoom</span>
    </div>
  </div>
</nav>

<div id="joy" class="world-ui" aria-label="Joystick gerak"><div class="knob"></div></div>
<div id="vbtns" class="world-ui"><button id="bUp" aria-label="Naik">▲</button><button id="bDown" aria-label="Turun">▼</button></div>
<div id="flash"></div>
<div id="toast" role="status"></div>
<div id="loader"><div class="sigil"></div><div class="msg">Menempa sabit…</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
function fail(msg){ const l=$('#loader'); l.classList.add('err'); l.querySelector('.msg').textContent=msg; }
if (typeof THREE === 'undefined'){ fail('Three.js gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.'); return; }

/* ============================================================
   Basic helpers
   ============================================================ */
const TAU = Math.PI*2;
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const clamp = (x,a,b) => Math.min(b, Math.max(a,x));
const lerp = (a,b,t) => a+(b-a)*t;
const ss = (e0,e1,x) => { const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
function rng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
let rand = rng(31337);
const R = (a,b) => a+(b-a)*rand();

function M(pos, q, s){
  const m=new THREE.Matrix4();
  const p = pos && pos.isVector3 ? pos : V3(...(pos||[0,0,0]));
  const sc = typeof s==='number' ? V3(s,s,s) : (s ? (s.isVector3 ? s : V3(...s)) : V3(1,1,1));
  m.compose(p, q||new THREE.Quaternion(), sc); return m;
}
const QE = (x,y,z) => new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));
function alignQ(dir, roll){
  const q=new THREE.Quaternion().setFromUnitVectors(V3(0,1,0), dir.clone().normalize());
  if (roll) q.multiply(new THREE.Quaternion().setFromAxisAngle(V3(0,1,0), roll));
  return q;
}
function flat(g){ const n=g.index?g.toNonIndexed():g; n.computeVertexNormals(); return n; }
function spikeGeo(len, r, sides){ const g=new THREE.ConeGeometry(r,len,sides||4,1); g.translate(0,len/2,0); return flat(g); }
function diamondGeo(rx,ry,rz){ const g=new THREE.OctahedronGeometry(1,0); g.scale(rx,ry,rz); return g; }

/* Grid surface: fn(a,b) -> Vector3, a,b in [0,1] */
function gridGeo(nI,nJ,fn,flip,colFn,uvS){
  const n=(nI+1)*(nJ+1), pos=new Float32Array(n*3), uv=new Float32Array(n*2), col=colFn?new Float32Array(n*3):null;
  const us=uvS||[1,1]; let k=0;
  for(let i=0;i<=nI;i++) for(let j=0;j<=nJ;j++){
    const a=i/nI, b=j/nJ, p=fn(a,b);
    pos[k*3]=p.x; pos[k*3+1]=p.y; pos[k*3+2]=p.z; uv[k*2]=a*us[0]; uv[k*2+1]=b*us[1];
    if(col){ const c=colFn(a,b); col[k*3]=c; col[k*3+1]=c; col[k*3+2]=c; }
    k++;
  }
  const idx=[];
  for(let i=0;i<nI;i++) for(let j=0;j<nJ;j++){
    const a=i*(nJ+1)+j, b=(i+1)*(nJ+1)+j, c=a+1, d=b+1;
    if(flip) idx.push(a,b,c, c,b,d); else idx.push(a,c,b, c,d,b);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  if(col) g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}

/* Tube whose radius follows a profile (tapered horns, ribs, fingers, veins) */
function taperedTube(pts, r0, r1, segs, radial, profile){
  const curve = Array.isArray(pts) ? new THREE.CatmullRomCurve3(pts) : pts; // accepts point arrays or ready-made curves
  segs = segs||20; radial = radial||6;
  const g=new THREE.TubeGeometry(curve, segs, 1, radial, false);
  const pos=g.attributes.position, c=new THREE.Vector3(), v=new THREE.Vector3();
  for(let i=0;i<=segs;i++){
    const t=i/segs; curve.getPointAt(t,c);
    const r = profile ? profile(t) : lerp(r0,r1,t);
    for(let j=0;j<=radial;j++){
      const k=i*(radial+1)+j; v.fromBufferAttribute(pos,k).sub(c).multiplyScalar(r).add(c); pos.setXYZ(k,v.x,v.y,v.z);
    }
  }
  g.computeVertexNormals(); return g;
}

/* Merge many geometries (position/normal/uv) into one mesh-ready geometry */
function mergeGeos(list){
  const arr=[]; let total=0;
  for(const g0 of list){ const g=g0.index?g0.toNonIndexed():g0; if(!g.attributes.normal) g.computeVertexNormals(); arr.push(g); total+=g.attributes.position.count; }
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2); let o=0;
  for(const g of arr){
    const c=g.attributes.position.count;
    pos.set(g.attributes.position.array.subarray(0,c*3), o*3);
    nor.set(g.attributes.normal.array.subarray(0,c*3), o*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array.subarray(0,c*2), o*2);
    o+=c;
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.BufferAttribute(nor,3));
  out.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  out.computeBoundingSphere(); return out;
}

/* Collects parts per material, then emits one merged mesh per material */
class Builder{
  constructor(name){ this.name=name; this.b={}; }
  add(g,key,m){ if(m) g.applyMatrix4(m); (this.b[key]||(this.b[key]=[])).push(g); return g; }
  addAll(list,key,m){ for(const g of list) this.add(g.clone(),key,m); }
  build(){
    const grp=new THREE.Group(); grp.name=this.name;
    for(const k in this.b){
      const mesh=new THREE.Mesh(mergeGeos(this.b[k]), MAT[k]);
      mesh.name=this.name+':'+k; mesh.castShadow=true; mesh.receiveShadow=true; grp.add(mesh);
    }
    return grp;
  }
}

/* ============================================================
   Procedural textures
   ============================================================ */
function canvas(s){ const c=document.createElement('canvas'); c.width=c.height=s; return [c,c.getContext('2d')]; }
function blotches(g,s,n,cols,rmin,rmax,amin,amax,yMax){
  for(let i=0;i<n;i++){
    const x=rand()*s, y=rand()*s*(yMax||1), r=R(rmin,rmax), c=cols[Math.floor(rand()*cols.length)], a=R(amin,amax);
    for(const ox of [-s,0,s]) for(const oy of [-s,0,s]){
      const cx=x+ox, cy=y+oy; if(cx+r<0||cx-r>s||cy+r<0||cy-r>s) continue;
      const gr=g.createRadialGradient(cx,cy,0,cx,cy,r); gr.addColorStop(0,'rgba('+c+','+a+')'); gr.addColorStop(1,'rgba('+c+',0)');
      g.fillStyle=gr; g.fillRect(cx-r,cy-r,2*r,2*r);
    }
  }
}
function grain(g,s,amt){ const id=g.getImageData(0,0,s,s), d=id.data; for(let i=0;i<d.length;i+=4){ const n=(rand()-.5)*amt; d[i]+=n; d[i+1]+=n; d[i+2]+=n; } g.putImageData(id,0,0); }
function cracks(g,s,n,col,wmin,wmax){
  g.strokeStyle=col; g.lineCap='round'; g.lineJoin='round';
  for(let i=0;i<n;i++){
    let x=rand()*s, y=rand()*s, a=rand()*TAU; g.lineWidth=R(wmin,wmax); g.beginPath(); g.moveTo(x,y);
    const st=Math.floor(R(5,16));
    for(let k=0;k<st;k++){ a+=R(-.8,.8); const l=R(3,11); x+=Math.cos(a)*l; y+=Math.sin(a)*l; g.lineTo(x,y); }
    g.stroke();
  }
}
function scratches(g,s,n,col,wmin,wmax,lmin,lmax){
  g.strokeStyle=col; g.lineCap='round';
  for(let i=0;i<n;i++){ const x=rand()*s, y=rand()*s, a=rand()*TAU, l=R(lmin,lmax); g.lineWidth=R(wmin,wmax);
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+Math.cos(a)*l*.5+R(-4,4), y+Math.sin(a)*l*.5+R(-4,4), x+Math.cos(a)*l, y+Math.sin(a)*l); g.stroke(); }
}
function toTex(c, srgb){ const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; if(srgb) t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t; }

function makeTextures(){
  const S=512, T={};
  // aged bone
  let [c,g]=canvas(S);
  g.fillStyle='#cdbd9f'; g.fillRect(0,0,S,S);
  blotches(g,S,240,['118,92,62','150,141,128','236,226,204','96,84,72'],8,70,.06,.22);

function boneParts(L, r, bend){
  const prof=[[0,-.5],[.5,-.5],[.9,-.48],[1,-.43],[.86,-.37],[.6,-.3],[.49,-.15],[.45,0],[.49,.15],[.6,.3],[.86,.37],[1,.43],[.9,.48],[.5,.5],[0,.5]];
  const g=new THREE.LatheGeometry(prof.map(([x,y])=>new THREE.Vector2(Math.max(.0005,x*r), y*L)), 8);
  const p=g.attributes.position, ph=rand()*10, b=bend||0;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    const n=1+.13*Math.sin(x*41+y*17+ph)*Math.cos(z*37+y*11);
    x*=n; z*=n*.86; x+=b*r*(1-Math.pow(2*y/L,2)); p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals();
  const parts=[g], s=r*.55;
  for(const sy of [-1,1]) for(const sx of [-1,1]){ const sp=new THREE.SphereGeometry(s,7,5); sp.translate(sx*r*.42, sy*(L*.5-s*.7), 0); parts.push(sp); }
  return parts;
}
function addBoneBetween(B,a,b,r,key,shorten){
  const d=b.clone().sub(a), len=d.length()*(shorten||0.9), mid=a.clone().add(b).multiplyScalar(.5);
  B.addAll(boneParts(len,r,R(-.6,.6)), key||'bone', M(mid, alignQ(d, R(0,TAU))));
}
function addSphere(B,p,r,key,sc){ const g=new THREE.SphereGeometry(r,9,7); if(sc) g.scale(...sc); B.add(g,key,M(p)); }

/* Rose: layered, cupped and curled petals */
function petalGeo(h,w,lean,cup,curl){
  return gridGeo(6,6,(a,b)=>{
    const hw=w*Math.sin(Math.PI*(.12+.76*a))*(.55+.45*a);
    const x=(b-.5)*2*hw, s=a*h;
    const zc=-cup*x*x*(.3+a)+curl*Math.pow(Math.max(0,a-.55),2)*h*3;
    return V3(x, s*Math.cos(lean)-zc*Math.sin(lean), s*Math.sin(lean)+zc*Math.cos(lean));
  });
}
function roseParts(){
  const outer=[], inner=[], leaf=[];
  const layers=[
    {n:3,h:.34,w:.17,lean:.05,cup:1.7,r0:.015,curl:0,y:.06,inner:true},
    {n:4,h:.40,w:.22,lean:.3,cup:1.25,r0:.045,curl:.05,y:.03,inner:true},
    {n:5,h:.44,w:.28,lean:.72,cup:.9,r0:.08,curl:.12,y:.01},
    {n:5,h:.46,w:.32,lean:1.28,cup:.7,r0:.11,curl:.22,y:0}
  ];
  let rot=rand()*TAU;
  for(const L of layers){
    for(let k=0;k<L.n;k++){
      const phi=rot+k/L.n*TAU+R(-.15,.15);
      const g=petalGeo(L.h*R(.92,1.08), L.w*R(.92,1.08), L.lean+R(-.08,.08), L.cup, L.curl);
      g.applyMatrix4(M(V3(Math.sin(phi)*L.r0, L.y, Math.cos(phi)*L.r0), new THREE.Quaternion().setFromAxisAngle(V3(0,1,0),phi)));
      (L.inner?inner:outer).push(g);
    }
    rot+=.63;
  }
  const bud=new THREE.SphereGeometry(.065,8,6); bud.scale(1,1.5,1); bud.translate(0,.1,0); inner.push(bud);
  for(let k=0;k<2;k++){
    const phi=rand()*TAU+k*Math.PI;
    const g=petalGeo(.62,.2,1.75,.5,.05);
    g.applyMatrix4(M(V3(Math.sin(phi)*.1,-.04,Math.cos(phi)*.1), new THREE.Quaternion().setFromAxisAngle(V3(0,1,0),phi)));
    leaf.push(g);
  }
  return {outer,inner,leaf};
}
function addRose(B,pos,dir,scale){
  const r=roseParts(), m=M(pos, alignQ(dir, R(0,TAU)), scale);
  for(const g of r.outer) B.add(g,'rose',m);
  for(const g of r.inner) B.add(g,'roseInner',m);
  for(const g of r.leaf) B.add(g,'leaf',m);
}

/* Torn cloth strip with real thickness. Hangs from origin along -Y, width on X, billows toward +Z. */
function clothGeo(o){
  const w=o.w||.4, L=o.L||2, cols=o.cols||8, rows=o.rows||26, thick=o.thick||.014;
  const r=rng(o.seed||1);
  const lens=[]; for(let c=0;c<=cols;c++){ let l=L*(1-(o.tear||.3)*r()); if(r()<.28) l*=lerp(.5,.8,r()); lens.push(l); }
  lens[0]=Math.max(lens[0],L*.55); lens[cols]=Math.max(lens[cols],L*.45);
  const notch=[]; for(let i=0;i<=rows;i++) notch.push(r()<.2 ? 1-r()*.3 : 1);
  const ph=r()*6, n=(cols+1)*(rows+1);
  const F=[], Bk=[];
  for(let i=0;i<=rows;i++) for(let c=0;c<=cols;c++){
    const a=i/rows, s=a*lens[c];
    const hw=w/2*(1-(o.taper||.2)*a)*notch[i]*(1+.08*Math.sin(s*7+ph));
    const x0=(c/cols*2-1)*hw;
    let x=x0+(o.drift||0)*s*s;
    let z=(o.flare||0)*.3*s*s+(o.wave||.045)*Math.sin(s*3.1+ph+x0*5)+.03*Math.sin(x0*14+ph);
    const ang=(o.twist||0)*s;
    const X=x*Math.cos(ang)+z*Math.sin(ang), Z=-x*Math.sin(ang)+z*Math.cos(ang);
    F.push(V3(X,-s,Z)); Bk.push(V3(X-Math.sin(ang)*thick, -s, Z-Math.cos(ang)*thick));
  }
  const id=(c,i)=>i*(cols+1)+c;
  const pos=new Float32Array(n*2*3), uv=new Float32Array(n*2*2);
  for(let k=0;k<n;k++){ pos.set([F[k].x,F[k].y,F[k].z],k*3); pos.set([Bk[k].x,Bk[k].y,Bk[k].z],(k+n)*3);
    const c=k%(cols+1), i=Math.floor(k/(cols+1)); uv.set([c/cols*w*2, i/rows*L],k*2); uv.set([c/cols*w*2, i/rows*L],(k+n)*2); }
  const idx=[];
  for(let i=0;i<rows;i++) for(let c=0;c<cols;c++){
    const a=id(c,i), b=id(c+1,i), cc=id(c,i+1), d=id(c+1,i+1);
    idx.push(a,cc,b, b,cc,d); idx.push(a+n,b+n,cc+n, b+n,d+n,cc+n);
  }
  const surf=new THREE.BufferGeometry(); surf.setAttribute('position',new THREE.BufferAttribute(pos,3)); surf.setAttribute('uv',new THREE.BufferAttribute(uv,2)); surf.setIndex(idx); surf.computeVertexNormals();
  // rim walls (separate vertices so edges stay crisp)
  const wp=[]; const quad=(p1,p2,p3,p4)=>{ wp.push(p1,p2,p3, p1,p3,p4); };
  for(let i=0;i<rows;i++){ quad(F[id(0,i)],F[id(0,i+1)],Bk[id(0,i+1)],Bk[id(0,i)]); quad(F[id(cols,i)],Bk[id(cols,i)],Bk[id(cols,i+1)],F[id(cols,i+1)]); }
  for(let c=0;c<cols;c++){ quad(F[id(c,rows)],F[id(c+1,rows)],Bk[id(c+1,rows)],Bk[id(c,rows)]); quad(F[id(c,0)],Bk[id(c,0)],Bk[id(c+1,0)],F[id(c+1,0)]); }
  const walls=new THREE.BufferGeometry(); const wa=new Float32Array(wp.length*3); wp.forEach((p,k)=>wa.set([p.x,p.y,p.z],k*3));
  walls.setAttribute('position',new THREE.BufferAttribute(wa,3)); walls.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(wp.length*2),2)); walls.computeVertexNormals();
  return mergeGeos([surf,walls]);
}

/* ============================================================
   BLADE
   ============================================================ */
const SPINE_PTS=[[0.12,10.12],[0.803,10.091],[1.478,10.0],[2.133,9.813],[2.774,9.579],[3.399,9.31],[3.995,8.978],[4.564,8.605],[5.095,8.175],[5.578,7.695],[6.02,7.175],[6.391,6.604],[6.672,5.983],[6.796,5.316]];
const EDGE_PTS =[[0.038,8.572],[0.72,8.657],[1.186,8.71],[1.745,8.669],[2.381,8.559],[2.965,8.435],[3.546,8.243],[4.132,8.0],[4.671,7.714],[5.209,7.349],[5.713,6.942],[6.16,6.48],[6.544,5.939],[6.796,5.316]];
const spineC=new THREE.CatmullRomCurve3(SPINE_PTS.map(p=>V3(p[0],p[1],0)));
const edgeC =new THREE.CatmullRomCurve3(EDGE_PTS.map(p=>V3(p[0],p[1],0)));
const SPINE_LEN=spineC.getLength();
const T_R0=spineC.getUtoTmapping(.3/SPINE_LEN), T_R1=spineC.getUtoTmapping(2.7/SPINE_LEN); // bone frame over the root of the blade
const frameCache=new Map();
function bladeFrame(t){
  let f=frameCache.get(t);
  if(!f){
    const s=spineC.getPoint(t), e=edgeC.getPoint(t), tg=spineC.getTangent(t).normalize(); // paired params keep spine/edge rulings aligned
    const n=V3(-tg.y,tg.x,0); if(n.dot(s.clone().sub(e))<0) n.negate(); n.normalize();
    f={s,e,n,tg}; frameCache.set(t,f);
  }
  return f;
}
function halfT(t,u){
  const T=.094*(1-.72*Math.pow(t,1.2))*Math.min(1,(1-t)*12);
  const gl=.58; const pr= u<gl ? 1-.1*u/gl : .9*Math.pow(Math.max(0,1-(u-gl)/(1-gl)),1.1);
  return T*pr;
}
function bladeP(t,u,side,off){ const f=bladeFrame(t); const p=f.s.clone().lerp(f.e,u); p.z=side*(halfT(t,u)+(off||0)); return p; }

function buildBlade(){
  const B=new Builder('Blade'), grp=new THREE.Group(); grp.name='Blade';
  const nT=150, nU=22;
  // OuterBlade: two beveled faces + rounded spine + base cap => solid wedge with a true cutting edge
  B.add(gridGeo(nT,nU,(a,b)=>bladeP(a,b,1),false,null,[6,1]),'steel');
  B.add(gridGeo(nT,nU,(a,b)=>bladeP(a,b,-1),true,null,[6,1]),'steel');
  B.add(gridGeo(nT,8,(a,b)=>{ const f=bladeFrame(a), T=halfT(a,0), ang=b*Math.PI;
    return f.s.clone().add(f.n.clone().multiplyScalar(Math.sin(ang)*T*.7)).add(V3(0,0,Math.cos(ang)*T)); },true,null,[6,.2]),'metal');
  B.add(gridGeo(1,nU,(a,b)=>bladeP(0,b,a<.5?1:-1)),'metal');

  // layered metal: grind-line ridge + spine ridge
  for(const side of [1,-1]){
    const pts=[]; for(let i=0;i<=44;i++){ const t=lerp(.05,.975,i/44); pts.push(bladeP(t,.585,side,.004)); }
    B.add(taperedTube(pts,0,0,90,5,t=>lerp(.017,.004,t)),'metal');
    const pts2=[]; for(let i=0;i<=30;i++){ const t=lerp(T_R1,.96,i/30); pts2.push(bladeP(t,.1,side,.002)); }
    B.add(taperedTube(pts2,0,0,70,5,t=>lerp(.012,.003,t)),'metal');
  }
  { const pts=[]; for(let i=0;i<=40;i++){ const t=lerp(T_R1-.02,.995,i/40), f=bladeFrame(t); pts.push(f.s.clone().add(f.n.clone().multiplyScalar(.012))); }
    B.add(taperedTube(pts,0,0,110,6,t=>lerp(.05,.005,t)),'metal'); }
  // skeletal reinforcement continuing along the thick outer spine
  for(let k=0;k<14;k++){
    const t0=lerp(T_R1+.01,.88,k/14), t1=lerp(T_R1+.01,.88,(k+1)/14), f0=bladeFrame(t0), f1=bladeFrame(t1);
    addBoneBetween(B,f0.s.clone().add(f0.n.clone().multiplyScalar(.055)),f1.s.clone().add(f1.n.clone().multiplyScalar(.055)),.052*(1-.45*k/14),'bone',.9);
  }

  // InnerEnergyChannel: dark core strip + bright crimson channel + hot cutting edge
  for(const side of [1,-1]){
    B.add(gridGeo(100,5,(a,b)=>{ const t=lerp(.025,.99,a); return bladeP(t,lerp(.635,.955,b),side,.0035); }, side<0),'energyCore');
    B.add(gridGeo(100,4,(a,b)=>{ const t=lerp(.03,.985,a); const u0=.72+.025*Math.sin(t*41), u1=.905-.02*Math.sin(t*23+1); return bladeP(t,lerp(u0,u1,b),side,.007); }, side<0),'energy');
  }
  { const pts=[]; for(let i=0;i<=60;i++) pts.push(bladeFrame(lerp(.015,.998,i/60)).e.clone());
    B.add(taperedTube(pts,0,0,160,5,t=>lerp(.008,.002,t)),'energy'); }

  // crack-like energy veins spreading into the blade body
  function vein(side,t,u,steps,depth){
    const pts=[]; let dt=R(-.006,.012);
    for(let k=0;k<steps;k++){
      pts.push(bladeP(t,u,side,.005));
      t=clamp(t+dt+R(-.012,.012),.05,.9); u=clamp(u-R(.025,.055),.14,.7);
      if(depth<2 && rand()<.22 && k>1) vein(side,t,u,Math.max(3,Math.floor(steps*.5)),depth+1);
    }
    if(pts.length>2) B.add(taperedTube(pts,0,0,pts.length*3,4,x=>lerp(.011/(depth+1),.002,x)),'energy');
  }
  for(const side of [1,-1]) for(let k=0;k<9;k++) vein(side,R(.16,.84),R(.6,.66),Math.floor(R(6,12)),0);

  // BladeSpikes: serrated thorns along the spine, pointing toward the tip
  for(let t=T_R1+.025;t<.94;t+=.032){
    const f=bladeFrame(t), big=Math.sin((t-T_R1)/(.94-T_R1)*Math.PI);
    const dir=f.n.clone().add(f.tg.clone().multiplyScalar(.6)).normalize();
    B.add(spikeGeo(.08+.14*big*R(.7,1.1), .034, 4),'metal', M(f.s.clone().add(f.n.clone().multiplyScalar(.015)), alignQ(dir,Math.PI/4)));
  }
  // thorns on the faces near the base
  for(const side of [1,-1]) for(const [t,u] of [[T_R1+.02,.35],[T_R1+.07,.5],[T_R1+.13,.28],[T_R1+.19,.42]]){
    const f=bladeFrame(t); const dir=V3(0,0,side).add(f.tg.clone().multiplyScalar(.7)).add(f.n.clone().multiplyScalar(.25)).normalize();
    B.add(spikeGeo(.12,.03,4),'metal',M(bladeP(t,u,side),alignQ(dir)));
  }

  // BoneFrame: vertebral column along the spine with ribs clasping both faces
  const nV=12;
  for(let k=0;k<nV;k++){
    const t=lerp(T_R0,T_R1,k/(nV-1)), f=bladeFrame(t);
    const c=f.s.clone().add(f.n.clone().multiplyScalar(.07));
    const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(f.tg,f.n,V3(0,0,1)));
    const body=new THREE.SphereGeometry(.09,10,8); body.scale(1.15,.85,1.05); B.add(body,'bone',M(c,q));
    const sp=f.n.clone().multiplyScalar(1).add(f.tg.clone().multiplyScalar(-.38)).normalize();
    B.add(taperedTube([c.clone(), c.clone().add(sp.clone().multiplyScalar(.14)), c.clone().add(sp.clone().multiplyScalar(.26)).add(f.tg.clone().multiplyScalar(-.03))],0,0,8,5,x=>lerp(.04,.01,x)),'bone');
    for(const side of [1,-1]) B.add(taperedTube([c.clone(), c.clone().add(V3(0,0,side*.13)).add(f.n.clone().multiplyScalar(.02))],0,0,4,5,x=>lerp(.035,.018,x)),'bone');
    if(k>0){ const tp=lerp(T_R0,T_R1,(k-.5)/(nV-1)), fp=bladeFrame(tp); const disc=new THREE.CylinderGeometry(.06,.06,.04,8); B.add(disc,'bone',M(fp.s.clone().add(fp.n.clone().multiplyScalar(.07)),alignQ(fp.tg))); }
    if(k>=1 && k<=10){
      const h=.5+.16*Math.sin(k/10*Math.PI);
      for(const side of [1,-1]){
        const Z=V3(0,0,side), ht=halfT(t,.4);
        const pts=[
          c.clone().add(Z.clone().multiplyScalar(.07)),
          f.s.clone().add(f.n.clone().multiplyScalar(.21)).add(Z.clone().multiplyScalar(.15)),
          f.s.clone().add(f.n.clone().multiplyScalar(-.08)).add(Z.clone().multiplyScalar(ht+.085)),
          f.s.clone().add(f.n.clone().multiplyScalar(-h*.55)).add(Z.clone().multiplyScalar(ht+.05)).add(f.tg.clone().multiplyScalar(.03)),
          f.s.clone().add(f.n.clone().multiplyScalar(-h)).add(Z.clone().multiplyScalar(ht+.03)).add(f.tg.clone().multiplyScalar(.07))
        ];
        B.add(taperedTube(pts,0,0,22,6,x=>lerp(.036,.017,x)),'bone');
        addSphere(B,pts[4],.022,'bone');
      }
    }
  }

  grp.add(B.build());

  // additive "bloom" shells around the energy (bloom-free glow that stays cheap on phones)
  const fade=(a,b)=>Math.pow(Math.sin(Math.PI*b),2)*ss(0,.06,a)*ss(1,.9,a);
  for(const side of [1,-1]){
    const g=gridGeo(80,6,(a,b)=>bladeP(lerp(.03,.99,a),lerp(.56,1,b),side,.03),false,fade);
    const m=new THREE.Mesh(g,glowMat); m.renderOrder=2; grp.add(m); glowObjects.push(m);
  }
  const eg1=gridGeo(90,6,(a,b)=>{ const f=bladeFrame(lerp(.02,.995,a)); return f.e.clone().add(f.n.clone().multiplyScalar(lerp(.17,-.13,b))); },false,fade);
  const eg2=gridGeo(90,6,(a,b)=>{ const f=bladeFrame(lerp(.02,.995,a)); return f.e.clone().add(V3(0,0,lerp(-.11,.11,b))); },false,fade);
  for(const g of [eg1,eg2]){ const m=new THREE.Mesh(g,glowMat); m.renderOrder=2; grp.add(m); glowObjects.push(m); }

  // crimson light cast onto nearby bone and metal
  // two lights (one on light devices) carry the glow that four used to: each point light costs every pixel
  for(const [t,z] of (LITE ? [[.46,.6]] : [[.3,.6],[.62,-.6]])){
    const f=bladeFrame(t); const L=new THREE.PointLight(0xff1a2c,LITE?2.2:1.7,4.2,2);
    L.position.copy(f.e.clone().lerp(f.s,.3)).add(V3(0,0,z)); grp.add(L); redLights.push(L);
  }
  return grp;
}

/* ============================================================
   HEAD ASSEMBLY: skull, jaw, halo frame, horns, blade mount
   ============================================================ */
const SKULL_POS=V3(-0.05,9.0,0), SKULL_SCALE=0.5;
const SKULL_Q=QE(0.04,-Math.PI/2+0.12,0.05);
const skullM=M(SKULL_POS,SKULL_Q,SKULL_SCALE);
const sk=(m)=>skullM.clone().multiply(m||new THREE.Matrix4());
const skP=(x,y,z)=>V3(x,y,z).applyMatrix4(skullM);

function craniumGeo(){
  const g=new THREE.SphereGeometry(1,72,54), p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i), y=p.getY(i), z=p.getZ(i);
    x*=.8; y*=.86; z*=1.04;
    if(z<0) z*=1.1;
    if(y<-.42){ const k=ss(.35,.1,z); y=-.42+(y+.42)*lerp(1,.35,k); }
    const fr=ss(.05,.85,z), low=ss(0,-.6,y);
    x*=1-.28*fr*low;
    if(y<-.3) z+=.06*fr*ss(-.3,-.6,y);
    if(y<-.6 && z>.1) y=-.6+(y+.6)*.25;
    for(const s of [-1,1]){
      const dx=(x-s*.3)/.26, dy=(y-.04)/.23, d2=dx*dx+dy*dy;
      if(z>.25){ const w=ss(.25,.65,z); if(d2<1) z-=.4*(1-d2)*w; else if(d2<1.6) z+=.035*Math.sin((d2-1)/.6*Math.PI)*w; }
      const dc=Math.hypot(x-s*.52,y+.22,z-.55); if(dc<.28) x+=s*.065*(1-Math.pow(dc/.28,2));
      const dt=Math.hypot(x-s*.7,y-.08,z-.12); if(dt<.38) x-=s*.07*(1-Math.pow(dt/.38,2));
    }
    const nd=Math.pow(x/.1,2)+Math.pow((y+.28)/.16,2);
    if(nd<1 && z>.3) z-=.3*(1-nd)*ss(.3,.7,z);
    if(y>.2 && y<.42 && z>.5) z+=.05*ss(.2,.29,y)*ss(.42,.33,y)*ss(.5,.8,z);
    p.setXYZ(i,x,y,z);
  }
  g.computeVertexNormals(); return g;
}

function buildHead(){
  const B=new Builder('HeadAssembly'), grp=new THREE.Group(); grp.name='HeadAssembly';

  // Skull + upper teeth
  B.add(craniumGeo(),'skull',sk());
  for(let k=0;k<12;k++){
    const a=lerp(-1.3,1.3,k/11), molar=Math.abs(a)>.7;
    const t=new THREE.CylinderGeometry(molar?.058:.044,molar?.046:.03,.15,6); t.translate(0,-.075,0);

  const pivot=V3(0,-.33,-.1);

  const jaw=(m)=>sk(jawM.clone().multiply(m||new THREE.Matrix4()));
  const side=s=>[V3(s*.5,-.3,-.12),V3(s*.53,-.62,-.02),V3(s*.42,-.84,.25),V3(s*.24,-.91,.6)];

  B.add(taperedTube([V3(-.45,-.56,.06),V3(-.36,-.72,.32),V3(-.2,-.78,.6),V3(0,-.8,.7),V3(.2,-.78,.6),V3(.36,-.72,.32),V3(.45,-.56,.06)],0,0,48,6,()=>.05),'skull',jaw());
  for(const s of [-1,1]){
    addSphere(B,V3(s*.5,-.3,-.12).applyMatrix4(jaw()),.05,'skull');
    B.add(taperedTube([V3(s*.47,-.58,.1),V3(s*.46,-.45,.16),V3(s*.44,-.36,.2)],0,0,6,5,x=>lerp(.045,.012,x)),'skull',jaw());

  for(let k=0;k<12;k++){

    const t=new THREE.CylinderGeometry(molar?.04:.026,molar?.05:.04,.13,6); t.translate(0,.065,0);

  // metal diadem with thorns (ornament fused to the cranium)
  { const band=new THREE.TorusGeometry(1,.035,6,56); band.rotateX(Math.PI/2); band.scale(.75,1,1.0); B.add(band,'metal',sk(M(V3(0,.42,.02),QE(-.1,0,0))));
    for(let k=0;k<9;k++){ const a=lerp(-2.6,2.6,k/8); const px=.75*Math.sin(a), pz=1.0*Math.cos(a)+.02;
      const dir=V3(Math.sin(a)*.4,1,Math.cos(a)*.4).normalize(); B.add(spikeGeo(k===4?.32:.16+.06*Math.cos(a),.035,4),'metal',sk(M(V3(px,.44-.1*pz*.1,pz),alignQ(dir,Math.PI/4)))); }
    B.add(diamondGeo(.05,.09,.03),'gem',sk(M(V3(0,.47,1.05)))); }

  // SkullSpikes: two swept horns
  for(const s of [-1,1]){

    B.add(taperedTube(pts,0,0,24,6,x=>lerp(.07,.004,x)),'metal');
    B.add(taperedTube([V3(.2,9.75,s*.43),V3(.34,9.86,s*.5),V3(.42,9.9,s*.5)],0,0,8,4,x=>lerp(.03,.003,x)),'metal');
  }

  // MetalFrame: spiked halo ring around the skull, open toward the blade
  const HC=V3(-.05,9.0,0), HR=.92, arc=TAU*2/3, a0=Math.PI/3;

  const ring2=new THREE.TorusGeometry(HR-.09,.018,5,64,arc-.25); ring2.rotateZ(a0+.125); B.add(ring2,'metal',M(HC));
  const onRing=(a,r)=>HC.clone().add(V3(Math.cos(a)*(r||HR),Math.sin(a)*(r||HR),0));
  for(const a of [a0,a0+arc]){ const tg=V3(-Math.sin(a),Math.cos(a),0).multiplyScalar(a===a0?-1:1); B.add(spikeGeo(.2,.045,4),'metal',M(onRing(a),alignQ(tg))); }
  for(const deg of [90,240,300]){ const a=deg*Math.PI/180; B.add(taperedTube([onRing(a,.32),onRing(a,HR)],0,0,4,5,()=>.024),'metal'); }
  for(const deg of [68,118,168,212,258]){
    const a=deg*Math.PI/180, c=onRing(a), rd=V3(Math.cos(a),Math.sin(a),0), tg=V3(-Math.sin(a),Math.cos(a),0);
    B.add(spikeGeo(.34,.05,4),'metal',M(c,alignQ(rd,Math.PI/4)));
    B.add(spikeGeo(.12,.04,4),'metal',M(c,alignQ(rd.clone().negate(),Math.PI/4)));
    B.add(spikeGeo(.15,.04,4),'metal',M(c,alignQ(tg,Math.PI/4)));
    B.add(spikeGeo(.15,.04,4),'metal',M(c,alignQ(tg.clone().negate(),Math.PI/4)));
    B.add(spikeGeo(.09,.03,4),'metal',M(c,alignQ(V3(0,0,1))));
    B.add(spikeGeo(.09,.03,4),'metal',M(c,alignQ(V3(0,0,-1))));
    B.add(diamondGeo(.055,.055,.055),'gem',M(c.clone().add(V3(0,0,.0)),QE(0,0,Math.PI/4)));
  }
  for(let deg=92;deg<290;deg+=25){ const a=deg*Math.PI/180; if([118,168,212,258].some(d=>Math.abs(d-deg)<9)) continue; B.add(spikeGeo(.12,.025,4),'metal',M(onRing(a),alignQ(V3(Math.cos(a),Math.sin(a),0)))); }

  // BladeConnector: collar socket, claws cradling the skull, side clamp plates, central joint
  const collar=new THREE.LatheGeometry([[.12,7.92],[.2,7.98],[.23,8.06],[.16,8.12],[.17,8.2],[.27,8.28],[.29,8.38],[.22,8.43],[.31,8.48],[.31,8.54],[.19,8.57],[.0,8.57]].map(([r,y])=>new THREE.Vector2(r,y)),8);
  B.add(flat(collar),'metal');
  for(let k=0;k<4;k++){ const a=Math.PI/4+k*Math.PI/2, d=V3(Math.cos(a),0,Math.sin(a));
    B.add(taperedTube([d.clone().multiplyScalar(.27).setY(8.52), d.clone().multiplyScalar(.42).setY(8.64), d.clone().multiplyScalar(.43).setY(8.82), d.clone().multiplyScalar(.36).setY(8.98)],0,0,14,5,x=>lerp(.05,.008,x)),'metal');
    B.add(spikeGeo(.16,.035,4),'metal',M(d.clone().multiplyScalar(.27).setY(8.3),alignQ(d.clone().setY(-.5)))); }
  const bshape=new THREE.Shape([[-.05,8.62],[.3,8.6],[.42,8.35],[.55,8.6],[.9,8.72],[1.05,9.15],[.95,9.6],[.65,9.98],[.25,10.1],[-.08,9.85]].map(([x,y])=>new THREE.Vector2(x,y)));
  for(const s of [1,-1]){
    const g=new THREE.ExtrudeGeometry(bshape,{depth:.035,bevelEnabled:true,bevelThickness:.01,bevelSize:.012,bevelSegments:1});
    g.translate(0,0,s>0?.095:-.095-.035); B.add(flat(g),'metal');
    for(const [x,y] of [[.8,8.85],[.92,9.17],[.77,9.52],[.45,9.8]]) addSphere(B,V3(x,y,s*.142),.03,'steel');
    const boss=new THREE.CylinderGeometry(.11,.14,.05,8); boss.rotateX(Math.PI/2); B.add(flat(boss),'steel',M(V3(.6,9.25,s*.152)));
    B.add(diamondGeo(.05,.08,.03),'gem',M(V3(.6,9.25,s*.18)));

  // cloth hanger bar under the head
  B.add(taperedTube([V3(-.62,8.45,0),V3(.4,8.45,0),V3(1.3,8.5,0)],0,0,16,6,()=>.022),'metal');
  B.add(spikeGeo(.16,.03,4),'metal',M(V3(-.62,8.45,0),alignQ(V3(-1,0,0))));
  // pendant spike hanging from the blade base
  { const top=V3(1.52,8.68,0);
    B.add(taperedTube([top,V3(1.52,8.27,0),V3(1.52,8.02,0)],0,0,6,5,()=>.018),'metal');
    B.add(spikeGeo(.13,.03,4),'metal',M(V3(1.52,8.08,0),alignQ(V3(1,0,0))));
    B.add(spikeGeo(.13,.03,4),'metal',M(V3(1.52,8.08,0),alignQ(V3(-1,0,0))));
    B.add(diamondGeo(.075,.13,.045),'gem',M(V3(1.52,7.88,0)));
    B.add(spikeGeo(.42,.05,4),'metal',M(V3(1.52,7.78,0),alignQ(V3(0,-1,0),Math.PI/4)));

  grp.add(B.build());
  return grp;
}

/* ============================================================
   SHAFT
   ============================================================ */
const cyl=(r,a,y)=>V3(r*Math.cos(a),y,r*Math.sin(a));
function buildShaft(){
  const B=new Builder('Shaft'), grp=new THREE.Group(); grp.name='Shaft';
  // dark iron core
  const prof=[]; for(let y=HANDLE_BOTTOM;y<=8.0;y+=.125){ prof.push(new THREE.Vector2(.11+(Math.round((y+20)/.125)%2?.008:0),y)); }
  B.add(new THREE.LatheGeometry(prof,12),'metal');

  // UpperBones: stacked vertebrae under the collar
  for(let k=0;k<5;k++){
    const y=7.3+k*.15, rot=k*.18;
    const q=QE(0,rot,0), m=M(V3(0,y,0),q);
    const body=new THREE.TorusGeometry(.17,.06,6,16); body.rotateX(Math.PI/2); body.scale(1,1,1); B.add(body,'bone',m);
    B.add(taperedTube([V3(-.2,0,0),V3(-.32,-.04,0),V3(-.42,-.13,0)],0,0,6,5,x=>lerp(.045,.008,x)),'bone',m);
    for(const s of [-1,1]) B.add(taperedTube([V3(0,0,s*.2),V3(.03,.01,s*.33)],0,0,4,5,x=>lerp(.035,.014,x)),'bone',m);
  }
  // forearm bones (radius + ulna) leading into the hand
  addBoneBetween(B,V3(-.04,6.74,-.27),V3(-.02,7.2,-.3),.06,'bone',.96);
  addBoneBetween(B,V3(.08,6.72,-.25),V3(.1,7.16,-.27),.05,'bone',.96);

  // skeletal hand gripping the shaft
  const palmA=-Math.PI/2;
  for(let k=0;k<5;k++) addSphere(B,cyl(.25,palmA+R(-.25,.25),6.7+R(-.03,.03)),.04,'bone');
  for(let f=0;f<4;f++){
    const y=6.6-f*.088, a0=palmA+.22-f*.05;
    const wrist=V3(.02+(f-1.5)*.03,6.73,-.25), knuck=cyl(.205,a0,y);
    addBoneBetween(B,wrist,knuck,.032,'bone',.92);
    addSphere(B,knuck,.03,'bone');
    let a=a0, py=y, prev=knuck;
    for(const seg of [.21,.15,.1]){
      a+=seg/.19; py-=.01; const nxt=cyl(.19,a,py);
      addBoneBetween(B,prev,nxt,.026,'bone',.88); addSphere(B,nxt,.024,'bone'); prev=nxt;
    }
    B.add(spikeGeo(.06,.016,4),'bone',M(prev,alignQ(V3(-Math.sin(a),0,Math.cos(a)))));
  }
  { let a=palmA-.5, py=6.64, prev=cyl(.23,a,py+.05);
    addBoneBetween(B,V3(-.08,6.72,-.24),prev,.032,'bone',.9);
    for(const seg of [.17,.11]){ a-=seg/.2; py-=.02; const nxt=cyl(.2,a,py); addBoneBetween(B,prev,nxt,.028,'bone',.88); addSphere(B,nxt,.025,'bone'); prev=nxt; } }

  // VertebraSegments / LowerBones: interlocking helical bone chains
  function strand(y0,y1,turns,phase,rad,r,dir){
    const n=Math.round((y1-y0)/.42), pts=[];
    for(let k=0;k<=n;k++){ const a=k/n, ang=phase+dir*turns*TAU*a; pts.push(cyl(rad+R(-.01,.01),ang,lerp(y0,y1,a))); }
    for(let k=0;k<n;k++){ addBoneBetween(B,pts[k],pts[k+1],r,'bone',.9); }
    pts.forEach((p,k)=>{ addSphere(B,p,r*.85,'bone',[1,.8,1]);
      if(k%3===1){ const out=V3(p.x,0,p.z).normalize().add(V3(0,.55,0)).normalize(); B.add(spikeGeo(.13,.028,5),'bone',M(p,alignQ(out))); } });
  }
  strand(1.98,6.12,1.3,0,.185,.056,1);
  strand(1.98,6.12,1.3,Math.PI,.185,.056,1);
  strand(1.98,4.24,.75,Math.PI/2,.205,.05,-1);
  strand(4.62,6.05,.5,Math.PI*1.5,.205,.05,-1);

  // MetalBindings
  for(const [y,spiked] of [[1.97,true],[4.27,false],[4.6,false],[6.16,true],[7.18,false]]){
    const t=new THREE.TorusGeometry(.215,.034,6,22); t.rotateX(Math.PI/2); B.add(t,'metal',M(V3(0,y,0)));
    if(spiked) for(let k=0;k<6;k++){ const a=k/6*TAU+.3; B.add(spikeGeo(.13,.03,4),'metal',M(cyl(.23,a,y),alignQ(V3(Math.cos(a),.25,Math.sin(a))))); }
  }
  // Spikes: thorn clusters on the shaft
  for(const [y,a] of [[5.25,.6],[5.25,2.7],[3.25,1.6],[3.25,4.4],[2.55,3.3]]){
    B.add(spikeGeo(.16,.032,4),'metal',M(cyl(.12,a,y),alignQ(V3(Math.cos(a),.35,Math.sin(a)))));
  }


  grp.add(B.build());
  return grp;
}

/* ============================================================
   LOWER HANDLE: long slender extension (proportions from the new reference)
   grip wrap, rune ring with hanging skull charm, bladed flanges, spear pommel
   ============================================================ */
const HANDLE_DROP=4.4;                 // how much longer the handle got
const HANDLE_BOTTOM=1.9-HANDLE_DROP;   // where the core meets the pommel
function buildLowerHandle(){
  const grp=new THREE.Group(); grp.name='LowerHandle';
  const B=new Builder('LowerHandleParts');

  // grip: dark leather spiral wrap between two bone rings
  { const pts=[]; const y0=.12, y1=1.72, turns=11;
    for(let i=0;i<=turns*14;i++){ const u=i/(turns*14), a=u*turns*TAU; pts.push(V3(Math.cos(a)*.122, lerp(y0,y1,u)+.012*Math.sin(a*2), Math.sin(a)*.122)); }
    B.add(taperedTube(new THREE.CatmullRomCurve3(pts),0,0,turns*40,5,()=>.03),'leather');
    for(const y of [.06,1.78]){ const r=new THREE.TorusGeometry(.15,.045,7,20); r.rotateX(Math.PI/2); B.add(r,'bone',M(V3(0,y,0)));
      for(let k=0;k<6;k++){ const a=k/6*TAU+(y>1?0.5:0); B.add(spikeGeo(.1,.024,5),'bone',M(cyl(.17,a,y),alignQ(V3(Math.cos(a),y>1?.6:-.6,Math.sin(a))))); } }
    for(let k=0;k<5;k++){ const y=lerp(.35,1.5,k/4), a=k*1.3; addSphere(B,cyl(.15,a,y),.028,'bone'); } }

function uiInsets(){
  const t=$('.top .plate').getBoundingClientRect(), b=$('.bottom .plate').getBoundingClientRect();
  return {top:t.bottom+8, bottom:window.innerHeight-b.top+8};
}
function viewFor(name){
  const v=VIEWS[name], box=v.box==='head'?headBox:(v.box==='battle'?battleBox:(v.box==='ctrl'?ctrlBox:modelBox));
  const target=box.getCenter(new THREE.Vector3());
  const dir=v.dir.clone().normalize();
  const fwd=dir.clone().negate(), right=new THREE.Vector3().crossVectors(fwd,V3(0,1,0)).normalize(), up=new THREE.Vector3().crossVectors(right,fwd);
  let hw=0, hh=0, dd=0;
  for(let i=0;i<8;i++){
    const c=V3(i&1?box.max.x:box.min.x, i&2?box.max.y:box.min.y, i&4?box.max.z:box.min.z).sub(target);
    hw=Math.max(hw,Math.abs(c.dot(right))); hh=Math.max(hh,Math.abs(c.dot(up))); dd=Math.max(dd,c.dot(dir));
  }
  if(v.cropW && camera.aspect<.9) hw*=v.cropW;
  const ins=uiInsets(), H=window.innerHeight, frac=Math.max(.35,(H-ins.top-ins.bottom)/H);
  const tf=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const dist=Math.max(hh/(tf*frac), hw/(tf*camera.aspect))*1.1+dd;
  return {target, pos:target.clone().add(dir.multiplyScalar(dist))};
}
let tween=null;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function goTo(name,instant){
  const v=viewFor(name); current=name; markView(name);
  if(!controls||instant){ camera.position.copy(v.pos); if(controls){controls.target.copy(v.target); controls.update();} else camera.lookAt(v.target); tween=null; return; }
  const s0=new THREE.Spherical().setFromVector3(camera.position.clone().sub(controls.target));
  const s1=new THREE.Spherical().setFromVector3(v.pos.clone().sub(v.target));
  let dTheta=s1.theta-s0.theta; while(dTheta>Math.PI) dTheta-=TAU; while(dTheta<-Math.PI) dTheta+=TAU;
  tween={s0,s1,dTheta,t0:controls.target.clone(),t1:v.target,start:performance.now(),dur:reduceMotion?1:850};
}

function updateAction(dt){
  if(!action && ctrlOn){ if(world.on) updateWorldControl(dt); else updateControl(dt); return; }
  if(!action){ omega.multiplyScalar(Math.max(0,1-dt*6)); boostTarget=0; emitting=swirling=petalRain=false; trailOn=false; return; }
  const a=action, mv=a.move; a.prev=a.t; a.t+=dt; const t=a.t;
  if(t<0) return;
  const ks=mv.keys; let k=0; while(k<ks.length-2 && t>ks[k+1].t) k++;
  const k0=ks[k], k1=ks[k+1], u=clamp((t-k0.t)/(k1.t-k0.t),0,1), e=EASE[k1.e||'inout'](u);
  const rx=lerp(k0.r[0],k1.r[0],e), ry=lerp(k0.r[1],k1.r[1],e), rz=lerp(k0.r[2],k1.r[2],e);
  rig.rotation.set(rx,ry+(world.on?world.yawS:0),rz);
  rig.position.set(RIG_BASE.x+lerp(k0.p[0],k1.p[0],e), RIG_BASE.y+lerp(k0.p[1],k1.p[1],e), RIG_BASE.z+lerp(k0.p[2],k1.p[2],e));

  trailOn=inWin(mv.trail,t); emitting=inWin(mv.emit,t); swirling=inWin(mv.swirl,t); petalRain=inWin(mv.petals,t);
  boostTarget=inWin(mv.boost,t)?1:0;
  if(t>=mv.dur){
    rig.rotation.set(0,0,0); rig.position.copy(RIG_BASE); prevRot.set(0,0,0);
    action=null; trailOn=false; C.target=C.phi=C.w=0;
    if(queue.length) startMove(queue.shift()); else { comboOn=false; setFiring(null); }
  }
}

function updateControl(dt){

{

function sliceGeo(geo,plane){
  const P=geo.attributes.position, N=geo.attributes.normal, U=geo.attributes.uv;
  const out=[[],[]], cut=[];
  const vtx=i=>({p:new THREE.Vector3().fromBufferAttribute(P,i), n:new THREE.Vector3().fromBufferAttribute(N,i), u:U?new THREE.Vector2().fromBufferAttribute(U,i):new THREE.Vector2(), d:0});
  const mix=(a,b,t)=>({p:a.p.clone().lerp(b.p,t), n:a.n.clone().lerp(b.n,t).normalize(), u:a.u.clone().lerp(b.u,t), d:0});
  for(let i=0;i+2<P.count;i+=3){
    const tri=[vtx(i),vtx(i+1),vtx(i+2)]; tri.forEach(v=>v.d=plane.distanceToPoint(v.p));
    for(let side=0;side<2;side++){
      const sg=side===0?1:-1, poly=[];
      for(let k=0;k<3;k++){ const a=tri[k], b=tri[(k+1)%3], ia=a.d*sg>=0, ib=b.d*sg>=0;
        if(ia) poly.push(a);
        if(ia!==ib){ const v=mix(a,b,a.d/(a.d-b.d)); poly.push(v); if(side===0) cut.push(v.p); } }
      for(let k=1;k+1<poly.length;k++) out[side].push(poly[0],poly[k],poly[k+1]);
    }
  }
  const build=list=>{ if(!list.length) return null;
    const pos=new Float32Array(list.length*3), nor=new Float32Array(list.length*3), uv=new Float32Array(list.length*2);
    list.forEach((v,k)=>{ pos[k*3]=v.p.x; pos[k*3+1]=v.p.y; pos[k*3+2]=v.p.z; nor[k*3]=v.n.x; nor[k*3+1]=v.n.y; nor[k*3+2]=v.n.z; uv[k*2]=v.u.x; uv[k*2+1]=v.u.y; });
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2)); return g; };
  return {pos:build(out[0]), neg:build(out[1]), cut};
}
function capGeo(points,normal){
  if(points.length<3) return null;
  const n=normal.clone().normalize(), ax=Math.abs(n.y)<.9?V3(0,1,0):V3(1,0,0);
  const u=new THREE.Vector3().crossVectors(n,ax).normalize(), v=new THREE.Vector3().crossVectors(n,u), o=points[0];
  const pts=points.map(p=>{ const d=p.clone().sub(o); return {x:d.dot(u),y:d.dot(v),p}; }).sort((a,b)=>a.x-b.x||a.y-b.y);
  const cr=(O,A,B)=>(A.x-O.x)*(B.y-O.y)-(A.y-O.y)*(B.x-O.x), lo=[], up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  const hull=lo.slice(0,-1).concat(up.slice(0,-1)); if(hull.length<3) return null;
  const c=new THREE.Vector3(); hull.forEach(h=>c.add(h.p)); c.multiplyScalar(1/hull.length);
  const pos=[], nor=[], uvs=[];
  for(let i=0;i<hull.length;i++){
    let b=hull[i].p, d=hull[(i+1)%hull.length].p;
    const fn=new THREE.Vector3().subVectors(b,c).cross(new THREE.Vector3().subVectors(d,c)); if(fn.dot(n)<0){ const t=b; b=d; d=t; }
    for(const q of [c,b,d]){ pos.push(q.x,q.y,q.z); nor.push(n.x,n.y,n.z); const dd=q.clone().sub(o); uvs.push(dd.dot(u),dd.dot(v)); }
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2)); return g;
}
function makeScarecrow(x,z){

  for(const k in buckets){ const mesh=new THREE.Mesh(mergeGeos(buckets[k]),SC_MAT[k]); mesh.castShadow=true; mesh.receiveShadow=true; g.add(mesh); }
  g.position.set(x,groundY,z); g.rotation.y=Math.atan2(REST_RIG.x-x, REST_RIG.z-z); worldGroup.add(g);
  const ring=new THREE.Mesh(ringG,new THREE.MeshBasicMaterial({color:0x6b5a55,transparent:true,opacity:.35,depthWrite:false,toneMapped:false}));
  ring.scale.setScalar(1.35); ring.position.set(x,groundY+.02,z); worldGroup.add(ring);
  return {g,parts,x,z,state:'idle',halves:[],t:0,wob:new THREE.Vector2(),wobV:new THREE.Vector2(),ring};

function sliceScarecrow(sc,hitP,v){
  sc.state='cut'; sc.t=0; sc.g.visible=false; sc.ring.visible=false;
  camBasis(); const f=_cF.clone();
  // cut along the plane the blade actually swept: (blade radius) × (blade velocity)
  const grip=rig.getWorldPosition(new THREE.Vector3()), r=hitP.clone().sub(grip);
  const n=new THREE.Vector3().crossVectors(r,v);
  if(n.lengthSq()<1e-6) n.crossVectors(v,f); if(n.lengthSq()<1e-8) n.set(1,0,0); n.normalize();
  const center=V3(sc.x,hitP.y,sc.z);

  const halves=[{},{}], push=(h,k,g)=>(h[k]||(h[k]=[])).push(g);
  for(const part of sc.parts){
    const res=sliceGeo(part.geo,plane);
    if(res.pos) push(halves[0],part.mat,res.pos);
    if(res.neg) push(halves[1],part.mat,res.neg);
    if(part.cap!==false && res.pos && res.neg){
      const c0=capGeo(res.cut,plane.normal.clone().negate()), c1=capGeo(res.cut,plane.normal);
      if(c0) push(halves[0],part.cap,c0); if(c1) push(halves[1],part.cap,c1);
    }
  }
  const vdir=v.clone().normalize();
  halves.forEach((h,idx)=>{
    const keys=Object.keys(h); if(!keys.length) return;
    const cen=new THREE.Vector3(); let cnt=0;
    keys.forEach(k=>h[k].forEach(g=>{ const a=g.attributes.position; for(let i=0;i<a.count;i+=3){ cen.x+=a.getX(i); cen.y+=a.getY(i); cen.z+=a.getZ(i); cnt++; } }));
    if(!cnt) return; cen.multiplyScalar(1/cnt);
    const grp=new THREE.Group(); grp.name='ScarecrowHalf'; const box=new THREE.Box3();
    keys.forEach(k=>{ const geo=mergeGeos(h[k]); geo.translate(-cen.x,-cen.y,-cen.z); geo.computeBoundingBox(); box.union(geo.boundingBox);
      const mesh=new THREE.Mesh(geo,SC_MAT[k]); mesh.castShadow=true; mesh.receiveShadow=true; grp.add(mesh); });
    grp.position.copy(cen).applyMatrix4(sc.g.matrixWorld); grp.quaternion.copy(sc.g.quaternion); worldGroup.add(grp);
    const side=n.clone().multiplyScalar(idx===0?1:-1);
    const anchored=Math.abs(n.y)>.55 && grp.position.y<hitP.y;
    const vel=anchored?V3(0,0,0):side.clone().multiplyScalar(R(2.2,3.4)).addScaledVector(vdir,5).add(V3(0,R(2,3.5),0));
    const av=anchored?V3(0,0,0):new THREE.Vector3().crossVectors(V3(0,1,0),side).multiplyScalar(R(2,3.5)).add(V3(R(-1,1),R(-1,1),R(-1,1)));
    const corners=[]; for(let i=0;i<8;i++) corners.push(V3(i&1?box.max.x:box.min.x,i&2?box.max.y:box.min.y,i&4?box.max.z:box.min.z));
    sc.halves.push({g:grp,vel,av,anchored,corners,rest:anchored});
  });
  // straw burst + crimson sparks + plane flash + streak + vignette + text + heavy SFX + hit-stop
  for(let i=0;i<90;i++){ const d=V3(R(-1,1),R(-.2,1),R(-1,1)).normalize(); d.addScaledVector(n,-d.dot(n)); const s=R(2,7), p=center.clone().addScaledVector(d,R(0,.6));
    spawnSmoke(p.x,p.y,p.z,d.x*s,d.y*s+R(1,3),d.z*s,R(.6,1.3),R(.09,.18),.62,.47,.2,.95,-9,1.2); }
  const line=new THREE.Vector3().crossVectors(n,f); if(line.lengthSq()<.05) line.copy(vdir); line.normalize();
  for(let i=0;i<80;i++){ const p=center.clone().addScaledVector(line,R(-1.8,1.8));
    spawn(p.x,p.y,p.z,vdir.x*R(1,5)+R(-.5,.5),vdir.y*R(1,5)+R(-.2,.8),vdir.z*R(1,5)+R(-.5,.5),R(.25,.6),R(.08,.17),1,.15,.2,-1,1.5); }
  burst(center,40,6,0,.5,.07,()=>[1,.6,.4],-7,.8);
  shockwave(V3(sc.x,groundY+.03,sc.z),4.5,.55);
  cutFlash(center,n,line); screenFlash(); floatText(center.clone().add(V3(0,1.2,0)),'TERBELAH!');

}
function inReach(sc){
  const dx=sc.x-RIG_BASE.x, dz=sc.z-RIG_BASE.z, d=Math.hypot(dx,dz);
  return d>2.2 && d<8.7 && RIG_BASE.y-groundY<12;
}
function checkHits(dt){
  if(!world.on) return;
  _mv.copy(RIG_BASE).sub(world.lastBase); world.lastBase.copy(RIG_BASE);
  for(const sc of scarecrows){
    if(sc.state!=='idle') continue;
    let hit=null, hv=null;
    for(let i=0;i<edgeW.length&&!hit;i++){
      const a=edgePrev[i], b=edgeW[i];
      for(let s=0;s<=4;s++){ const t=s/4, px=lerp(a.x,b.x,t), py=lerp(a.y,b.y,t), pz=lerp(a.z,b.z,t), dx=px-sc.x, dz=pz-sc.z;
        if(dx*dx+dz*dz<1.1 && py>groundY+.15 && py<groundY+6.9){ hit=V3(px,py,pz); hv=b.clone().sub(a).sub(_mv); break; } }
    }
    if(!hit) continue;
    if(hv.length()/Math.max(dt,1e-3)>5) sliceScarecrow(sc,hit,hv);
    else { sc.wobV.x+=clamp(hv.z*4,-2,2); sc.wobV.y+=clamp(-hv.x*4,-2,2); }
  }
}
function updateScarecrows(dt,time){
  if(!world.on) return;
  updateFx(dt);
  for(const sc of scarecrows){
    if(sc.state==='idle'){
      sc.wobV.x+=(-40*sc.wob.x-4*sc.wobV.x)*dt; sc.wobV.y+=(-40*sc.wob.y-4*sc.wobV.y)*dt; sc.wob.addScaledVector(sc.wobV,dt);
      sc.g.rotation.x=sc.wob.x; sc.g.rotation.z=sc.wob.y;
      const ok=inReach(sc); sc.ring.material.color.setHex(ok?0xff2a3a:0x6b5a55); sc.ring.material.opacity=ok?.7+.25*Math.sin(time*8):.35;
    } else if(sc.state==='cut'){
      sc.t+=dt;
      for(const h of sc.halves){
        if(!h.rest){
          h.vel.y-=14*dt; h.g.position.addScaledVector(h.vel,dt);
          const ang=h.av.length(); if(ang>1e-4){ _q.setFromAxisAngle(_cw.copy(h.av).divideScalar(ang),ang*dt); h.g.quaternion.premultiply(_q); }
          h.g.updateMatrixWorld(true); let minY=Infinity;
          for(const c of h.corners){ _cw.copy(c).applyMatrix4(h.g.matrixWorld); if(_cw.y<minY) minY=_cw.y; }
          if(minY<groundY){ h.g.position.y+=groundY-minY; h.vel.y*=-.25; h.vel.x*=.6; h.vel.z*=.6; h.av.multiplyScalar(.55); if(h.vel.length()<.8) h.rest=true; }
        }
        if(sc.t>6) h.g.position.y-=dt*1.3;
      }
      if(sc.t>7.8){
        sc.halves.forEach(h=>{ worldGroup.remove(h.g); h.g.traverse(o=>{ if(o.isMesh) o.geometry.dispose(); }); });
        sc.halves=[]; sc.state='rise'; sc.t=0; sc.g.visible=true; sc.ring.visible=true; sc.wob.set(0,0); sc.wobV.set(0,0); sc.g.rotation.x=sc.g.rotation.z=0;
      }
    } else if(sc.state==='rise'){
      sc.t+=dt; const k=Math.min(1,sc.t/.9); sc.g.position.y=groundY-7*(1-easeIO(k));
      if(rand()<dt*40) spawnSmoke(sc.x+R(-1,1),groundY+.2,sc.z+R(-1,1),R(-.5,.5),R(.5,1.5),R(-.5,.5),R(.6,1),R(.4,.7),.16,.12,.09,.6,.4,2);
      if(k>=1){ sc.state='idle'; sc.g.position.y=groundY; }
    }
  }
}

function updateWorldMove(dt){
  const k=world.keys;
  const jx=world.joy.x+(k.d?1:0)-(k.a?1:0), jy=world.joy.y+(k.s?1:0)-(k.w?1:0), vy=world.vy+(k.e?1:0)-(k.q?1:0);
  if(k.arrowleft) world.yaw+=dt*1.8; if(k.arrowright) world.yaw-=dt*1.8;
  if(k.arrowup) world.pitch=clamp(world.pitch+dt*1.2,-.15,1.25); if(k.arrowdown) world.pitch=clamp(world.pitch-dt*1.2,-.15,1.25);
  const ys=world.yawS, f=V3(-Math.sin(ys),0,-Math.cos(ys)), r=V3(Math.cos(ys),0,-Math.sin(ys));
  const tv=r.multiplyScalar(clamp(jx,-1,1)*12).addScaledVector(f,-clamp(jy,-1,1)*12).add(V3(0,clamp(vy,-1,1)*7,0));
  world.vel.lerp(tv,Math.min(1,dt*6));
  RIG_BASE.addScaledVector(world.vel,dt);
  if(RIG_BASE.y<REST_RIG.y){ RIG_BASE.y=REST_RIG.y; if(world.vel.y<0) world.vel.y=0; }
  if(RIG_BASE.y>REST_RIG.y+12){ RIG_BASE.y=REST_RIG.y+12; if(world.vel.y>0) world.vel.y=0; }
  const dx=RIG_BASE.x-REST_RIG.x, dz=RIG_BASE.z-REST_RIG.z, d=Math.hypot(dx,dz);
  if(d>170){ RIG_BASE.x=REST_RIG.x+dx/d*170; RIG_BASE.z=REST_RIG.z+dz/d*170; }
}
function updateWorldCam(dt){
  world.yawS+=(world.yaw-world.yawS)*Math.min(1,dt*10); world.pitchS+=(world.pitch-world.pitchS)*Math.min(1,dt*10);
  const focus=_fc.copy(RIG_BASE).add(V3(0,3.2,0)), cp=Math.cos(world.pitchS), sp=Math.sin(world.pitchS);
  _cp.set(focus.x+Math.sin(world.yawS)*cp*world.dist, Math.max(groundY+1,focus.y+sp*world.dist), focus.z+Math.cos(world.yawS)*cp*world.dist);
  camera.position.lerp(_cp,Math.min(1,dt*10)); controls.target.lerp(focus,Math.min(1,dt*10)); camera.lookAt(controls.target);

/* ---------- scythe orientation: aim (free 3D rotate), directional swings, free spins ---------- */
const W={q:new THREE.Quaternion(), aim:new THREE.Quaternion(), mode:'idle', swing:null, spinW:0, spinAxis:new THREE.Vector3(0,0,-1), spinAcc:0, prevFrame:new THREE.Quaternion(), impactCd:0};
const TIP_RIG=new THREE.Vector3();
const SW={wind:.11, swing:.24, hold:.07, rec:.42};
function neutralQ(out){ return out.setFromAxisAngle(V3(0,1,0),world.yawS); }
function applyW(){ rig.quaternion.copy(W.q); rig.position.copy(RIG_BASE); rig.updateMatrixWorld(true); }
function startSwing(sx,sy,power){
  camBasis();
  const d=_cR.clone().multiplyScalar(sx).addScaledVector(_cU,-sy).normalize(), f=_cF.clone();
  const k=new THREE.Vector3().crossVectors(f,d).normalize();
  const T0=TIP_RIG.clone().normalize(), Z=V3(0,0,1), B0=new THREE.Vector3().crossVectors(Z,T0);
  const Ml=new THREE.Matrix4().makeBasis(T0,B0,Z), Mt=new THREE.Matrix4().makeBasis(d.clone().negate(),f.clone().negate(),k.clone().negate());
  const align=new THREE.Quaternion().setFromRotationMatrix(Mt.multiply(Ml.transpose()));
  W.swing={k,align,t:0,from:W.q.clone(),endQ:null,th0:-.45,th1:Math.PI+.35};
  W.mode='swing'; AudioFX.whoosh(power>1.7?1:0);
}
function swingQ(sw,th){ return _q2.setFromAxisAngle(sw.k,th).multiply(sw.align); }
function updateWorldControl(dt){
  W.impactCd-=dt;
  const before=W.q.clone();
  if(W.mode==='swing'){
    const sw=W.swing; sw.t+=dt; const t=sw.t, t1=SW.wind, t2=t1+SW.swing, t3=t2+SW.hold, t4=t3+SW.rec;
    if(t<t1){ W.q.copy(sw.from).slerp(swingQ(sw,sw.th0),EASE.out(t/t1)); trailOn=false; emitting=false; boostTarget=.6; }
    else if(t<t2){
      const u=(t-t1)/SW.swing, e=u*u*(3-2*u);
      W.q.copy(swingQ(sw,lerp(sw.th0,sw.th1,e))); trailOn=true; emitting=true; boostTarget=1;
      applyW();
      if(lowestBladeY()<groundY+.03){ // blade bites into the floor: stop the swing there
        W.q.copy(before); sw.t=t2; sampleWorld();
        if(W.impactCd<=0){ W.impactCd=.5; fire({fx:'impact'}); }
      }
    }
    else if(t<t3){ trailOn=true; emitting=false; boostTarget=.8; }
    else if(t<t4){ if(!sw.endQ) sw.endQ=W.q.clone(); W.q.copy(sw.endQ).slerp(W.aim,easeIO((t-t3)/SW.rec)); trailOn=false; boostTarget=0; }
    else { W.mode='idle'; W.q.copy(W.aim); }
  } else if(W.mode==='spin'){
    if(!G.down) W.spinW*=Math.exp(-1.5*dt);
    const ang=W.spinW*dt; W.q.premultiply(_q2.setFromAxisAngle(W.spinAxis,ang));
    applyW();
    if(lowestBladeY()<groundY+.03){ W.q.copy(before); const sp=Math.abs(W.spinW); W.spinW*=-.3; sampleWorld(); if(sp>4&&W.impactCd<=0){ W.impactCd=.5; fire({fx:'impact'}); } }
    W.spinAcc+=Math.abs(ang); if(W.spinAcc>Math.PI){ W.spinAcc=0; if(Math.abs(W.spinW)>3) AudioFX.whoosh(Math.abs(W.spinW)>10?1:0); }
    const sp=Math.abs(W.spinW); trailOn=sp>3; emitting=sp>4; boostTarget=clamp(sp/10,0,1); petalRain=sp>12;
    if(!G.down && sp<.6){ W.mode='idle'; W.aim.copy(W.q); }
  } else {
    W.q.slerp(W.aim,Math.min(1,dt*14)); trailOn=false; emitting=false; boostTarget=0; petalRain=false;
    applyW(); if(lowestBladeY()<groundY+.03){ W.q.copy(before); W.aim.copy(before); }
  }
  applyW();
  // cloth/charm react to how fast the scythe turns
  const ang=2*Math.acos(clamp(Math.abs(W.prevFrame.dot(W.q)),0,1))/Math.max(dt,1e-3);
  omega.set(0,ang*.5,ang*.6*(W.spinW<0?-1:1)); W.prevFrame.copy(W.q);
}

/* ---------- touch gestures on the 3D view ---------- */
const G={down:false,id:null,pts:[],startQ:new THREE.Quaternion(),attacked:false,lastAtkDir:null,lastAtkT:0,turnAcc:0,lastDir:null,angRate:0,lastV:{x:1,y:0},spin:false,arcPrev:null,lastTap:0,downT:0,downX:0,downY:0,moved:0};
const _gp2=new THREE.Vector3();
function arcVec(x,y){
  const rect=renderer.domElement.getBoundingClientRect(); rig.getWorldPosition(_gp2).project(camera);
  const gx=(_gp2.x+1)/2*rect.width+rect.left, gy=(1-_gp2.y)/2*rect.height+rect.top, Rr=Math.min(rect.width,rect.height)*.38;
  let nx=(x-gx)/Rr, ny=-(y-gy)/Rr; const l2=nx*nx+ny*ny; let nz=0;
  if(l2>1){ const l=Math.sqrt(l2); nx/=l; ny/=l; } else nz=Math.sqrt(1-l2);
  camBasis(); return new THREE.Vector3().addScaledVector(_cR,nx).addScaledVector(_cU,ny).addScaledVector(_cF,-nz).normalize();
}
function gestureDown(e){
  G.down=true; G.id=e.pointerId; const now=performance.now();
  G.pts=[{x:e.clientX,y:e.clientY,t:now}]; G.startQ.copy(W.aim); G.attacked=false; G.turnAcc=0; G.lastDir=null; G.angRate=0; G.spin=false;
  G.arcPrev=arcVec(e.clientX,e.clientY); G.downT=now; G.downX=e.clientX; G.downY=e.clientY; G.moved=0;
}
function gestureMove(e){
  const now=performance.now(), x=e.clientX, y=e.clientY;
  const last=G.pts[G.pts.length-1]; G.moved+=Math.hypot(x-last.x,y-last.y);
  G.pts.push({x,y,t:now}); while(G.pts.length>2&&now-G.pts[0].t>400) G.pts.shift();
  const sdx=x-last.x, sdy=y-last.y, sl=Math.hypot(sdx,sdy);
  if(sl>2.5){
    const a=Math.atan2(sdy,sdx);
    if(G.lastDir!==null){ let da=a-G.lastDir; while(da>Math.PI) da-=TAU; while(da<-Math.PI) da+=TAU;
      G.turnAcc=G.turnAcc*.985+da; G.angRate=G.angRate*.6+.4*(da/Math.max(.008,(now-last.t)/1000)); }
    G.lastDir=a; G.lastV={x:sdx/sl,y:sdy/sl};
  }
  // circling the finger → free tumbling spin (axis precesses with the finger, so it turns every which way)
  if(!G.spin && Math.abs(G.turnAcc)>4.2 && W.mode!=='swing'){ G.spin=true; W.mode='spin'; W.spinW=0; W.spinAcc=0; W.aim.copy(G.startQ); }
  if(G.spin){
    W.spinW+=(clamp(G.angRate*1.5,-30,30)-W.spinW)*.25;
    camBasis(); const dv=_cR.clone().multiplyScalar(G.lastV.x).addScaledVector(_cU,-G.lastV.y);
    W.spinAxis.copy(_cF).addScaledVector(new THREE.Vector3().crossVectors(_cF,dv),.8).normalize();
    return;
  }
  // fast straight stroke → swing in that direction (down = overhead chop, sideways = horizontal sweep, …)
  let j=G.pts.length-1; while(j>0&&now-G.pts[j-1].t<90) j--;
  const p0=G.pts[j], dx=x-p0.x, dy=y-p0.y, dist=Math.hypot(dx,dy), speed=dist/Math.max(16,now-p0.t);
  let path=0; for(let i=j+1;i<G.pts.length;i++) path+=Math.hypot(G.pts[i].x-G.pts[i-1].x,G.pts[i].y-G.pts[i-1].y);
  if(speed>1.05 && dist>36 && dist/Math.max(1,path)>.8){
    const dir={x:dx/dist,y:dy/dist};
    const ready=W.mode!=='swing' || W.swing.t>SW.wind+SW.swing;
    const fresh=!G.lastAtkDir || (dir.x*G.lastAtkDir.x+dir.y*G.lastAtkDir.y)<.6 || now-G.lastAtkT>420;
    if(ready && fresh){ if(!G.attacked) W.aim.copy(G.startQ); G.attacked=true; G.lastAtkDir=dir; G.lastAtkT=now; startSwing(dir.x,dir.y,speed); return; }
  }
  // slow drag → rotate the scythe freely (virtual trackball around the grip)
  if(!G.attacked && W.mode!=='swing'){
    const v=arcVec(x,y), ax=new THREE.Vector3().crossVectors(G.arcPrev,v), s=ax.length();
    if(s>1e-6){ W.aim.premultiply(_q3.setFromAxisAngle(ax.divideScalar(s),Math.asin(Math.min(1,s))*1.5)); if(W.mode==='spin') W.mode='idle'; }
    G.arcPrev=v;
  }
}
function gestureUp(e){
  G.down=false; const now=performance.now();
  if(now-G.downT<230 && G.moved<14){
    if(now-G.lastTap<340){ neutralQ(W.aim); W.mode='idle'; G.lastTap=0; showToast('Posisi sabit direset',1200); } else G.lastTap=now;
  }
}
function resetOrientationNow(){ neutralQ(W.q); W.aim.copy(W.q); W.prevFrame.copy(W.q); W.mode='idle'; W.spinW=0; }

function enterWorld(){
  stand.position.set(0,0,0); stand.rotation.set(0,0,0); stand.updateMatrixWorld(true); $('#tPose').setAttribute('aria-pressed','false');
  modelBox=REST.model.clone(); headBox=REST.head.clone(); battleBox=REST.battle.clone(); ctrlBox=REST.ctrl.clone();
  if(!world.built) buildWorld();
  TIP_RIG.copy(TRAIL_OUT).sub(GRIP);
  world.on=true; worldGroup.visible=true; document.body.classList.add('world');
  scene.fog=new THREE.Fog(FOG_COL,70,300); scene.background=new THREE.Color(FOG_COL); camera.fov=52; camera.far=600;
  if(shadowPlane) shadowPlane.visible=false;
  world.yaw=world.yawS=0; world.pitch=world.pitchS=.38; world.vel.set(0,0,0); world.lastBase.copy(RIG_BASE); tween=null;
  resetOrientationNow();
  camera.position.copy(RIG_BASE).add(V3(0,3.2+Math.sin(.38)*world.dist,Math.cos(.38)*world.dist)); controls.target.copy(RIG_BASE).add(V3(0,3.2,0));
  updateScore();
  showToast('Joystick kiri: terbang. ▲▼: naik/turun. Usap cepat: tebas ke arah usapan. Putar jari melingkar: sabit berputar bebas. Seret pelan: putar sabit. Ketuk 2×: reset. Dua jari: putar kamera & zoom.',8000);
}
function exitWorld(){
  world.on=false; worldGroup.visible=false; document.body.classList.remove('world');
  scene.fog=null; scene.background=null; if(shadowPlane) shadowPlane.visible=true; camera.fov=32; camera.far=300;
  RIG_BASE.copy(REST_RIG); rig.position.copy(RIG_BASE); rig.quaternion.identity();
  if(keyLight){ keyLight.position.set(-6,9,10); keyLight.target.position.set(0,0,0); keyLight.target.updateMatrixWorld(); }
  world.joy.set(0,0); world.vy=0; for(const k in world.keys) world.keys[k]=false; G.down=false; W.mode='idle';
  scarecrows.forEach(sc=>{ sc.halves.forEach(h=>worldGroup.remove(h.g)); sc.halves=[]; sc.state='idle'; sc.g.visible=true; sc.ring.visible=true; sc.g.position.y=groundY; });
  countStats();
}

/* ---------- input wiring: joystick, small up/down buttons, keyboard, view gestures ---------- */
{
  const joy=$('#joy'), knob=joy.querySelector('.knob'); let jid=null;
  const upd=e=>{ const r=joy.getBoundingClientRect(); let dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height/2); const mg=Math.hypot(dx,dy), mx=r.width*.38;
    if(mg>mx){ dx*=mx/mg; dy*=mx/mg; } knob.style.transform='translate('+dx+'px,'+dy+'px)'; world.joy.set(dx/mx,dy/mx); };
  joy.addEventListener('pointerdown',e=>{ jid=e.pointerId; try{ joy.setPointerCapture(jid); }catch(_){} upd(e); e.preventDefault(); });
  joy.addEventListener('pointermove',e=>{ if(e.pointerId===jid) upd(e); });
  const jend=e=>{ if(e.pointerId!==jid) return; jid=null; knob.style.transform=''; world.joy.set(0,0); };
  joy.addEventListener('pointerup',jend); joy.addEventListener('pointercancel',jend);
  for(const [id,val] of [['#bUp',1],['#bDown',-1]]){
    const b=$(id); let bid=null;
    b.addEventListener('pointerdown',e=>{ bid=e.pointerId; try{ b.setPointerCapture(bid); }catch(_){} world.vy=val; b.classList.add('on'); e.preventDefault(); });
    const off=e=>{ if(e.pointerId!==bid) return; bid=null; if(world.vy===val) world.vy=0; b.classList.remove('on'); };
    b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off);
  }
  window.addEventListener('keydown',e=>{ if(!world.on) return; const k=e.key.toLowerCase(); world.keys[k]=true; if(k.startsWith('arrow')) e.preventDefault(); });
  window.addEventListener('keyup',e=>{ world.keys[e.key.toLowerCase()]=false; });

  const cv=renderer.domElement, ptrs=new Map(); let cam=null;
  const pair=()=>{ const [a,b]=[...ptrs.values()]; return {mx:(a.x+b.x)/2, my:(a.y+b.y)/2, d:Math.hypot(a.x-b.x,a.y-b.y)}; };
  cv.addEventListener('contextmenu',e=>{ if(world.on) e.preventDefault(); });
  cv.addEventListener('pointerdown',e=>{
    if(!world.on) return; AudioFX.init();
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(e.button===2){ cam={mouse:true,x:e.clientX,y:e.clientY,id:e.pointerId}; return; }      // right mouse = camera
    if(ptrs.size===2){ if(G.down&&!G.attacked&&!G.spin) W.aim.copy(G.startQ); G.down=false; cam=pair(); return; } // two fingers = camera
    if(ptrs.size===1) gestureDown(e);
  });
  cv.addEventListener('pointermove',e=>{
    if(!world.on||!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(cam&&cam.mouse&&e.pointerId===cam.id){ world.yaw-=(e.clientX-cam.x)*.007; world.pitch=clamp(world.pitch+(e.clientY-cam.y)*.005,-.15,1.25); cam.x=e.clientX; cam.y=e.clientY; return; }
    if(cam&&ptrs.size===2){ const g=pair(); world.yaw-=(g.mx-cam.mx)*.008; world.pitch=clamp(world.pitch+(g.my-cam.my)*.006,-.15,1.25);
      if(cam.d>10&&g.d>10) world.dist=clamp(world.dist*cam.d/g.d,10,80); cam=g; return; }

  });
  const pend=e=>{
    if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(cam&&(cam.mouse?e.pointerId===cam.id:ptrs.size<2)) cam=null;
