  };
  cv.addEventListener('pointerup',pend); cv.addEventListener('pointercancel',pend);
  cv.addEventListener('wheel',e=>{ if(!world.on) return; e.preventDefault(); world.dist=clamp(world.dist*(1+e.deltaY*.001),10,80); },{passive:false});
}

/* ============================================================
   UI wiring
   ============================================================ */
let current='full', swayOn=true, glowOn=true;
document.querySelectorAll('#views .btn').forEach(b=>b.addEventListener('click',()=>goTo(b.dataset.view)));
document.querySelectorAll('.atk').forEach(b=>b.addEventListener('click',()=>requestMove(b.dataset.move)));
function toggle(id,fn){ const b=$(id); b.addEventListener('click',()=>{ const on=b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on?'true':'false'); fn(on); }); }
toggle('#tSound',on=>{ AudioFX.init(); AudioFX.setMuted(!on); });
$('#tCtrl').addEventListener('click',()=>{ AudioFX.init(); setCtrl(!ctrlOn); });
toggle('#tRotate',on=>{ if(controls) controls.autoRotate=on; });
toggle('#tGlow',on=>{ glowOn=on; glowObjects.forEach(o=>o.visible=on); redLights.forEach(l=>l.visible=on); });
toggle('#tSway',on=>{ swayOn=on; });
let REST=null;
toggle('#tAura',on=>{ auraOn=on; });
toggle('#tPose',on=>{
  stand.position.set(0,0,0); stand.rotation.set(0,0,on?0.61:0); stand.updateMatrixWorld(true);
  if(on){ const b=new THREE.Box3().setFromObject(root); stand.position.y=REST.model.min.y-b.min.y; stand.updateMatrixWorld(true); }
  modelBox=REST.model.clone().applyMatrix4(stand.matrix); headBox=REST.head.clone().applyMatrix4(stand.matrix); battleBox=REST.battle.clone().applyMatrix4(stand.matrix); ctrlBox=REST.ctrl.clone().applyMatrix4(stand.matrix);
  goTo(current||'full');
});
toggle('#tWire',on=>{ Object.values(MAT).forEach(m=>m.wireframe=on); glowObjects.forEach(o=>o.visible=!on&&glowOn); });
if(controls) controls.addEventListener('start',()=>{ tween=null; current=null; markView(null); });
window.addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')) return;
  const map={'1':'slash','2':'slam','3':'spin','4':'combo'};
  if(map[e.key]) requestMove(map[e.key]); else if(e.code==='Space'){ e.preventDefault(); requestMove('combo'); }
});
function resize(){
  document.documentElement.style.setProperty('--joyB',(window.innerHeight-$('.bottom .plate').getBoundingClientRect().top+14)+'px');
  renderer.setSize(window.innerWidth,window.innerHeight,false); applyViewOffset();
  pMat.uniforms.uScale.value=renderer.domElement.height/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)));
  sMat.uniforms.uScale.value=pMat.uniforms.uScale.value;
}
window.addEventListener('resize',resize);
// re-layout after the phone is rotated (some browsers report the new size a moment later)
const relayout=()=>{ resize(); setTimeout(resize,150); setTimeout(resize,450); };
window.addEventListener('orientationchange',relayout);
if(screen.orientation&&screen.orientation.addEventListener) screen.orientation.addEventListener('change',relayout);
if(window.visualViewport) window.visualViewport.addEventListener('resize',()=>resize());
document.addEventListener('fullscreenchange',()=>{ $('#tFull').textContent=document.fullscreenElement?'Keluar layar penuh':'Layar penuh'; relayout(); });
{ const fb=$('#tFull'); const el=document.documentElement, req=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!req) fb.style.display='none';
  fb.addEventListener('click',()=>{ if(document.fullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); } else { try{ const r=req.call(el); if(r&&r.catch) r.catch(()=>{}); }catch(_){} } }); }
function countStats(){
  let tris=0, meshes=0;
  root.traverse(o=>{ if(o.isMesh){ meshes++; const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3; } });
  $('#stats').innerHTML='<b>'+Math.round(tris).toLocaleString('id-ID')+'</b> segitiga<br>'+meshes+' mesh';
}

/* ============================================================
   Loop
   ============================================================ */
const clock=new THREE.Clock(); let time=0;
const _shk=new THREE.Vector3();
// dynamic resolution: average the frame time over ~1.5 s, step the pixel ratio down when slow, up when smooth
const perf={t:0,n:0,good:0};
function adaptResolution(raw){
  perf.t+=raw; perf.n++;
  if(perf.t<1.5) return;
  const fps=perf.n/perf.t; perf.t=0; perf.n=0;
  let next=pixelRatio;
  if(fps<40 && pixelRatio>PR_MIN){ next=Math.max(PR_MIN,pixelRatio-(fps<25?0.25:0.15)); perf.good=0; }
  else if(fps>57 && pixelRatio<PR_MAX){ if(++perf.good>=2){ next=Math.min(PR_MAX,pixelRatio+0.1); perf.good=0; } }
  else perf.good=0;
  if(Math.abs(next-pixelRatio)>0.01){ pixelRatio=next; renderer.setPixelRatio(pixelRatio); resize(); }
}
function animate(){
  requestAnimationFrame(animate);
  const rawDt=clock.getDelta();
  if(rawDt<0.5) adaptResolution(rawDt);
  let dt=Math.min(.05,rawDt); if(hitStop>0){ hitStop-=dt; dt*=.15; } time+=dt;
  if(tween&&controls){
    const k=clamp((performance.now()-tween.start)/tween.dur,0,1), e=easeIO(k);
    controls.target.lerpVectors(tween.t0,tween.t1,e);
    const s=new THREE.Spherical(lerp(tween.s0.radius,tween.s1.radius,e), lerp(tween.s0.phi,tween.s1.phi,e), tween.s0.theta+tween.dTheta*e);
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
    if(k>=1) tween=null;
  }
  if(world.on){ updateWorldMove(dt); updateWorldCam(dt); }
  if(controls) controls.update();

  updateAction(dt);
  rig.updateMatrixWorld(true);
  sampleWorld();
  emitFrame(dt,time);
  checkHits(dt);
  updateScarecrows(dt,time);
  updateTrail(time,wIn,wOut);
  if(pivotGlow.visible){ rig.getWorldPosition(pivotGlow.position); pivotGlow.material.opacity=.55+.3*Math.sin(time*4); }
  updateParticles(dt,time);
  updateSmoke(dt,time);
  updatePetals(dt,time);
  updateWaves(dt);
  flashLevel=Math.max(0,flashLevel-dt*22); flash.intensity=flashLevel;

  boost+=(boostTarget-boost)*Math.min(1,dt*6);
  const pulse=.5+.5*Math.sin(time*2.1);
  MAT.energy.emissiveIntensity=2.1+.6*pulse+2.6*boost;
  MAT.gem.emissiveIntensity=1.3+.5*pulse+1.5*boost;
  glowMat.opacity=Math.min(1,.48+.18*pulse+.4*boost);
  redLights.forEach(l=>l.intensity=(l.userData.base||(l.userData.base=l.intensity))*(.85+.3*pulse)*(1+1.6*boost));

  const fling=Math.min(.75,Math.abs(omega.y)*.07+Math.abs(omega.z)*.05), lag=clamp(-omega.z*.08,-.6,.6);
  for(const s of swayers){
    const idleX=swayOn?Math.sin(time*.8+s.ph)*.03*s.amp:0, idleZ=swayOn?Math.sin(time*.63+s.ph*1.7)*.025*s.amp:0;
    const flutter=fling*.25*Math.sin(time*17+s.ph*3);
    s.lx+=(fling*s.sign-s.lx)*Math.min(1,dt*7); s.lz+=(lag-s.lz)*Math.min(1,dt*7);
    s.obj.rotation.x=s.base.x+idleX+s.lx+flutter; s.obj.rotation.z=s.base.z+idleZ+s.lz;
  }

  let shook=false;
  if(shakeT<shakeDur){
    shakeT+=dt; const k=1-shakeT/shakeDur, d=controls?camera.position.distanceTo(controls.target):20;
    _shk.set(R(-1,1),R(-1,1),R(-1,1)).multiplyScalar(shakeAmp*k*k*d*.03); camera.position.add(_shk); shook=true;
  }
  renderer.render(scene,camera);
  if(shook) camera.position.sub(_shk);
}

/* ============================================================
   Boot
   ============================================================ */
setTimeout(()=>{
  try{
    const center=assemble(); REST_RIG.copy(RIG_BASE);
    modelBox=new THREE.Box3().setFromObject(root);
    headBox=new THREE.Box3(V3(-1.15,7.55,-.8).sub(center), V3(3.6,11.05,.8).sub(center));
    battleBox=modelBox.clone().union(new THREE.Box3(V3(RIG_BASE.x-5.6,modelBox.min.y-.5,RIG_BASE.z-2.4),V3(RIG_BASE.x+5.6,modelBox.max.y+.9,RIG_BASE.z+2.4)));
    ctrlBox=new THREE.Box3(V3(RIG_BASE.x-8.4,modelBox.min.y-.3,RIG_BASE.z-1.5),V3(RIG_BASE.x+8.4,RIG_BASE.y+8.6,RIG_BASE.z+1.5));
    REST={model:modelBox.clone(), head:headBox.clone(), battle:battleBox.clone(), ctrl:ctrlBox.clone()};
    setupLights();
    prepareSamples();
    resize();
    goTo('full',true);
    countStats();
    $('#loader').classList.add('done');
    animate();
  }catch(err){
    console.error(err);
    fail('Model gagal dibuat di perangkat ini: '+(err&&err.message?err.message:err));
  }
},40);
})();
