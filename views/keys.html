<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Keys — Yannz</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#fffdf7;color:#111;margin:0}.wrap{max-width:900px;margin:auto;padding:28px 18px}h1{font-size:42px}.panel{border:3px solid #111;padding:20px;background:#fff;box-shadow:6px 6px #111;margin:20px 0}input,button{font:inherit;padding:11px;border:2px solid #111}button{background:#ffe45e;font-weight:800;cursor:pointer;box-shadow:3px 3px #111}.key{overflow-wrap:anywhere;background:#fff4b8;padding:14px;border:2px dashed #111}li{margin:12px 0}small{color:#555}</style></head><body><main class="wrap"><a href="/home">← Home</a><h1>API Keys</h1><section class="panel"><h2>Create key</h2><input id="name" maxlength="80" placeholder="Key name"><button onclick="createKey()">Create API key</button><p><small>Plaintext hanya tampil sekali. Simpan di password manager; jangan bagikan atau taruh di frontend publik.</small></p><div id="newkey"></div></section><section class="panel"><h2>Your keys</h2><div id="list">Loading…</div></section></main><script>async function call(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Request failed');return d}async function load(){try{const d=await call('/api/keys');list.innerHTML=`<p>Active keys: ${d.keys.filter(k=>k.status==='active').length} / ${d.limit===null?'Unlimited':d.limit}</p>`+(d.keys.length?'<ul>'+d.keys.map(k=>`<li><b>${esc(k.name)}</b><br><code>${esc(k.key_prefix)}••••••</code> · ${k.status} · created ${new Date(k.created_at).toLocaleString()}<br><small>Last used: ${k.last_used_at?new Date(k.last_used_at).toLocaleString():'Never'}</small> ${k.status==='active'?`<button onclick="revoke('${k.id}')">Revoke</button>`:''}</li>`).join('')+'</ul>':'No keys yet.');}catch(e){list.textContent=e.message}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function createKey(){try{const d=await call('/api/keys',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({name:name.value})});newkey.innerHTML=`<p><b>Copy now — this is the only plaintext display.</b></p><div class="key" id="once"></div><button onclick="navigator.clipboard.writeText(document.querySelector('#once').textContent)">Copy key</button>`;once.textContent=d.key;await load()}catch(e){newkey.textContent=e.message}}async function revoke(id){if(!confirm('Revoke this key?'))return;try{await call(`/api/keys/${id}/revoke`,{method:'POST'});await load()}catch(e){alert(e.message)}}load();</script></body></html>
