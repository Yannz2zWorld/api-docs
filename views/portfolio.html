<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Portfolio pribadi">
<link rel="icon" href="/views/assets/favicon.png">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f7f9f9;
    --card: #ffffff;
    --text: #0f1419;
    --muted: #536471;
    --line: #eff3f4;
    --accent: #1d9bf0;
    --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(15, 20, 25, .06), 0 8px 24px rgba(15, 20, 25, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000;
      --surface: #16181c;
      --card: #0b0c0e;
      --text: #e7e9ea;
      --muted: #71767b;
      --line: #2f3336;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000;
    --surface: #16181c;
    --card: #0b0c0e;
    --text: #e7e9ea;
    --muted: #71767b;
    --line: #2f3336;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img, video { display: block; }
  button { font: inherit; color: inherit; }

  .page {
    max-width: 640px;
    margin: 0 auto;
    min-height: 100vh;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
  @media (max-width: 640px) { .page { border: 0; } }

  /* Top bar */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .topbar .t-name { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 4px; }
  .topbar .t-sub { color: var(--muted); font-size: 13px; }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%;
    display: grid; place-items: center;
    border: 0; background: transparent; cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface); }
  .icon-btn svg { width: 20px; height: 20px; }

  /* Banner (header) */
  .banner {
    position: relative;
    aspect-ratio: var(--banner-ratio, 16 / 9);
    background: linear-gradient(135deg, #1d9bf0 0%, #7856ff 50%, #f91880 100%);
    overflow: hidden;
  }
  .banner > img, .banner > video { width: 100%; height: 100%; object-fit: cover; }

  /* Profile head */
  .head { padding: 0 16px; position: relative; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .avatar-wrap {
    position: relative;
    width: clamp(88px, 25vw, 136px); aspect-ratio: 1;
    margin-top: calc(clamp(88px, 25vw, 136px) / -2);
    border-radius: 50%;
    border: 4px solid var(--bg);
    background: var(--surface);
    overflow: hidden;
  }
  .avatar-wrap img, .avatar-wrap video { width: 100%; height: 100%; object-fit: cover; }
  .avatar-fallback {
    width: 100%; height: 100%; display: grid; place-items: center;
    font-size: 44px; font-weight: 800; color: #fff;
    background: linear-gradient(135deg, #1d9bf0, #7856ff);
  }
  .head-actions { display: flex; gap: 8px; padding-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 0 18px; height: 36px; border-radius: 999px;
    font-weight: 700; font-size: 15px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--text);
    text-decoration: none !important;
  }
  .btn:hover { background: var(--surface); }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: .88; }
  .btn.round { width: 36px; padding: 0; justify-content: center; }
  .btn svg { width: 18px; height: 18px; }

  .name {
    margin: 12px 0 0;
    font-size: 21px; font-weight: 800; line-height: 1.2;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    overflow-wrap: anywhere;
  }
  .verified { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .verified.sm { width: 18px; height: 18px; }
  .handle { color: var(--muted); margin-top: 1px; overflow-wrap: anywhere; }
  .bio { margin: 12px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .meta span, .meta a { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg { width: 17px; height: 17px; }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; font-size: 14px; }
  .stats b { font-weight: 700; }
  .stats span { color: var(--muted); }

  /* Tabs */
  .tabs {
    position: sticky; top: 52px; z-index: 10;
    display: flex; margin-top: 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .tab {
    flex: 1; padding: 0; background: none; border: 0; cursor: pointer;
    color: var(--muted); font-weight: 600;
  }
  .tab:hover { background: var(--surface); }
  .tab span { display: inline-block; padding: 15px 2px 13px; border-bottom: 4px solid transparent; }
  .tab[aria-selected="true"] { color: var(--text); font-weight: 700; }
  .tab[aria-selected="true"] span { border-bottom-color: var(--accent); }

  .panel { display: none; }
  .panel.on { display: block; }

  /* Portfolio grid (Instagram-like) */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px 0; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .tile {
    position: relative; aspect-ratio: 4 / 5; overflow: hidden;
    border: 0; padding: 0; cursor: pointer; background: var(--surface);
  }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  .tile:hover img, .tile:hover video { transform: scale(1.04); }
  .tile .ph { width: 100%; height: 100%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 26px; }
  .tile .cap {
    position: absolute; inset: auto 0 0 0; padding: 22px 10px 8px;
    color: #fff; font-size: 13px; font-weight: 600; text-align: left;
    background: linear-gradient(transparent, rgba(0,0,0,.65));
  }
  .tile .kind {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; color: #fff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }

  /* Skills & about */
  .section { padding: 16px; border-bottom: 1px solid var(--line); }
  .section h2 { margin: 0 0 12px; font-size: 20px; font-weight: 800; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--surface); font-size: 14px; font-weight: 600; }
  .bar { margin-bottom: 12px; }
  .bar-top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
  .bar-top span { color: var(--muted); }
  .bar-track { height: 6px; border-radius: 999px; background: var(--surface); overflow: hidden; }
  .bar-fill { height: 100%; border-radius: inherit; background: var(--accent); }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { position: relative; padding: 0 0 16px 22px; border-left: 2px solid var(--line); margin-left: 6px; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before {
    content: ""; position: absolute; left: -7px; top: 3px;
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg);
  }
  .timeline .when { color: var(--muted); font-size: 13px; }
  .timeline .what { font-weight: 700; }
  .timeline .where { color: var(--muted); font-size: 14px; }

  /* Contact & socials */
  .contact-card {
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border: 1px solid var(--line); border-radius: 16px; margin-bottom: 10px;
    color: var(--text); text-decoration: none !important;
  }
  .contact-card:hover { background: var(--surface); }
  .contact-card .ci { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
  .contact-card .ci svg { width: 20px; height: 20px; }
  .contact-card .ct { min-width: 0; }
  .contact-card .ct b { display: block; }
  .contact-card .ct span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .socials { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .social {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    border-radius: 16px; color: #fff; font-weight: 700; text-decoration: none !important;
    background: var(--brand); transition: transform .15s, box-shadow .15s;
  }
  .social:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
  .social svg { width: 22px; height: 22px; flex: none; }
  .social small { display: block; font-weight: 500; opacity: .85; font-size: 12px; overflow-wrap: anywhere; }
  .social.youtube { --brand: #ff0033; }
  .social.tiktok { --brand: #111111; box-shadow: inset 0 0 0 1px #2a2a2a; }
  .social.x { --brand: #0f1419; box-shadow: inset 0 0 0 1px #2f3336; }
  .social.instagram { --brand: linear-gradient(45deg, #feda75, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5); }
  .social.whatsapp { --brand: #25d366; }

  .form { display: grid; gap: 10px; margin-top: 14px; }
  .form input, .form textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  .form input:focus, .form textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .form textarea { min-height: 100px; resize: vertical; }
  .form .btn { justify-self: start; }

  footer { padding: 24px 16px 40px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Modal */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(0,0,0,.8); padding: 16px;
    align-items: center; justify-content: center;
  }
  .modal.on { display: flex; }
  .modal-box {
    width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    background: var(--bg); border-radius: 16px;
  }
  .modal-media { background: #000; }
  .modal-media img, .modal-media video { width: 100%; max-height: 70vh; object-fit: contain; }
  .modal-media .ph { aspect-ratio: 16 / 9; display: grid; place-items: center; color: #fff; font-size: 40px; font-weight: 800; }
  .modal-body { padding: 16px; }
  .modal-body h3 { margin: 0 0 6px; font-size: 19px; }
  .modal-body p { margin: 0 0 12px; color: var(--muted); }
  .modal-close {
    position: fixed; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%;
    border: 0; background: rgba(255,255,255,.15); color: #fff; cursor: pointer; font-size: 22px;
  }

  /* Edit mode (?edit=1): try banner / avatar from device, not saved */
  .edit-pick {
    position: absolute; z-index: 2; width: 42px; height: 42px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,.55); color: #fff; cursor: pointer;
    display: none; place-items: center;
  }
  .edit-pick svg { width: 20px; height: 20px; }
  body.editing .edit-pick { display: grid; }
  .banner .edit-pick { top: 50%; left: 50%; transform: translate(-50%, -50%); }
  .avatar-wrap .edit-pick { top: 50%; left: 50%; transform: translate(-50%, -50%); }
</style>
</head>

    mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
    camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.6" cy="6.4" r="1.2" fill="currentColor" stroke="none"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5l1.3-4.2A8.7 8.7 0 1 1 8 19.4z"/><path fill="currentColor" stroke="none" d="M9.2 7.6c.2-.4.5-.4.7-.4h.5c.2 0 .4 0 .6.5l.7 1.7c.1.2.1.4 0 .6l-.4.6c-.1.2-.2.3 0 .6.4.7 1 1.4 1.6 1.9.6.5 1.1.7 1.4.8.2.1.4.1.5-.1l.7-.8c.2-.2.3-.2.6-.1l1.6.8c.2.1.4.2.4.3.1.2.1.8-.2 1.5-.3.6-1.4 1.2-1.9 1.2-.5.1-1.1.2-3.4-.8-2.8-1.2-4.5-4.1-4.7-4.3-.1-.2-1.1-1.5-1.1-2.9 0-1.4.7-2 1-2.3z"/></svg>',
  };
  const SOCIALS = [
    { key: 'youtube', label: 'YouTube' },
    { key: 'tiktok', label: 'TikTok' },
    { key: 'x', label: 'X (Twitter)' },
    { key: 'instagram', label: 'Instagram' },
    { key: 'whatsapp', label: 'WhatsApp' },
  ];

  function media(src, { autoplay = true, controls = false } = {}) {
    if (!src) return '';
    if (isVideo(src)) {
      const s = src.replace(/#video$/, '');
      return `<video src="${esc(s)}" ${autoplay ? 'autoplay loop muted' : ''} ${controls ? 'controls' : ''} playsinline preload="metadata"></video>`;
    }
    return `<img src="${esc(src)}" alt="" loading="lazy">`;
  }

  function setMedia(el, src) {
    el.querySelectorAll('img,video,.avatar-fallback').forEach(n => n.remove());
    if (src) el.insertAdjacentHTML('afterbegin', media(src));
    else if (el.id === 'avatar') el.insertAdjacentHTML('afterbegin', `<div class="avatar-fallback">${esc((P.name || '?').trim().charAt(0).toUpperCase())}</div>`);
  }

  function socialUrl(key, v) {
    if (key === 'whatsapp') return /^https?:/i.test(v) ? v : 'https://wa.me/' + String(v).replace(/\D/g, '');
    return v;
  }
  function socialHandle(key, v) {
    if (key === 'whatsapp') return /^https?:/i.test(v) ? 'Chat' : '+' + String(v).replace(/\D/g, '');
    const m = String(v).match(/@[\w.\-]+/) || String(v).match(/\.com\/([\w.\-]+)/);
    return m ? (m[0].startsWith('@') ? m[0] : '@' + m[1]) : 'Kunjungi';
  }

  // ---- Header
  document.title = `${P.name} (@${P.username}) · Portfolio`;
  const badge = P.verified ? ICON.verified : '';
  $('tName').textContent = P.name; $('tBadge').innerHTML = badge.replace('class="verified"', 'class="verified sm"');
  $('tSub').textContent = `${P.projects.length} proyek`;
  document.documentElement.style.setProperty('--banner-ratio', P.bannerRatio || '16 / 9');
  setMedia($('banner'), P.banner);
  setMedia($('avatar'), P.avatar);
  $('name').textContent = P.name; $('badge').innerHTML = badge;
  $('handle').textContent = '@' + P.username;
  $('bio').textContent = P.bio;

  const meta = [];
  if (P.location) meta.push(`<span>${ICON.pin}${esc(P.location)}</span>`);
  if (P.website) meta.push(`<a href="${esc(P.website)}" target="_blank" rel="noopener">${ICON.link}${esc(P.website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>`);
  if (P.joined) meta.push(`<span>${ICON.cal}${esc(P.joined)}</span>`);
  $('meta').innerHTML = meta.join('');
  $('stats').innerHTML = (P.stats || []).map(s => `<div><b>${esc(s.value)}</b> <span>${esc(s.label)}</span></div>`).join('');

  const mailBtn = $('mailBtn');
  if (P.contact?.email) { mailBtn.href = 'mailto:' + P.contact.email; mailBtn.innerHTML = ICON.mail; }
  else mailBtn.remove();

  // ---- Tabs
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', x === t));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'p-' + t.dataset.tab));
  }));

  // ---- Portfolio grid
  $('grid').innerHTML = P.projects.map((p, i) => `
    <button class="tile" data-i="${i}" aria-label="${esc(p.title)}">
      ${p.media ? media(p.media) : `<div class="ph" style="background:${GRADS[i % GRADS.length]}">${esc(p.title.charAt(0))}</div>`}
      ${p.media && isVideo(p.media) ? `<span class="kind">${ICON.play}</span>` : ''}
      <span class="cap">${esc(p.title)}</span>
    </button>`).join('');

  const modal = $('modal'), box = $('modalBox');
  function openProject(i) {
    const p = P.projects[i];
    box.innerHTML = `
      <div class="modal-media">${p.media ? media(p.media, { autoplay: true, controls: isVideo(p.media) }) : `<div class="ph" style="background:${GRADS[i % GRADS.length]}">${esc(p.title.charAt(0))}</div>`}</div>
      <div class="modal-body">
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        ${p.tags?.length ? `<div class="chips" style="margin-bottom:12px">${p.tags.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div>` : ''}
        ${p.link ? `<a class="btn primary" href="${esc(p.link)}" target="_blank" rel="noopener">Lihat proyek</a>` : ''}
      </div>`;
    modal.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() { modal.classList.remove('on'); box.innerHTML = ''; document.body.style.overflow = ''; }
  $('grid').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openProject(+t.dataset.i); });
  $('modalClose').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('on')) closeModal(); });

  // ---- Skills & experience
  $('chips').innerHTML = (P.skills || []).map(s => `<span class="chip">${esc(s)}</span>`).join('');
  if (P.skillBars?.length) {
    $('bars').innerHTML = P.skillBars.map(b => `
      <div class="bar"><div class="bar-top"><b>${esc(b.name)}</b><span>${+b.level}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(0, Math.min(100, +b.level))}%"></div></div></div>`).join('');
  } else $('barsSec').remove();
  $('timeline').innerHTML = (P.experience || []).map(x => `
    <li><div class="when">${esc(x.when)}</div><div class="what">${esc(x.what)}</div><div class="where">${esc(x.where)}</div></li>`).join('');

  // ---- Contact
  const cards = [];
  if (P.contact?.email) cards.push(`<a class="contact-card" href="mailto:${esc(P.contact.email)}"><span class="ci">${ICON.mail}</span><span class="ct"><b>Email</b><span>${esc(P.contact.email)}</span></span></a>`);
  if (P.contact?.phone) cards.push(`<a class="contact-card" href="tel:${esc(P.contact.phone.replace(/[^\d+]/g, ''))}"><span class="ci">${ICON.phone}</span><span class="ct"><b>Telepon</b><span>${esc(P.contact.phone)}</span></span></a>`);
  if (P.socials?.whatsapp) cards.push(`<a class="contact-card" href="${esc(socialUrl('whatsapp', P.socials.whatsapp))}" target="_blank" rel="noopener"><span class="ci" style="color:#25d366">${ICON.whatsapp}</span><span class="ct"><b>WhatsApp</b><span>${esc(socialHandle('whatsapp', P.socials.whatsapp))}</span></span></a>`);
  $('contactCards').innerHTML = cards.join('');

  // The form opens WhatsApp (if set) or the mail app with the message filled in; no server needed.
  $('form').addEventListener('submit', e => {
    e.preventDefault();
    const f = e.target, text = `Halo ${P.name}, saya ${f.name.value.trim()}.\n\n${f.msg.value.trim()}`;
    if (P.socials?.whatsapp) window.open(socialUrl('whatsapp', P.socials.whatsapp) + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
    else if (P.contact?.email) location.href = `mailto:${P.contact.email}?subject=${encodeURIComponent('Pesan dari portfolio')}&body=${encodeURIComponent(text)}`;
  });

  // ---- Socials
  $('socials').innerHTML = SOCIALS.filter(s => P.socials?.[s.key]).map(s => `
    <a class="social ${s.key}" href="${esc(socialUrl(s.key, P.socials[s.key]))}" target="_blank" rel="noopener">
      ${ICON[s.key]}<span>${s.label}<small>${esc(socialHandle(s.key, P.socials[s.key]))}</small></span>
    </a>`).join('');

  $('footer').textContent = `© ${new Date().getFullYear()} ${P.name} · @${P.username}`;

  // ---- Theme toggle (remembered per browser)
  const root = document.documentElement;
  try { const t = localStorage.getItem('pf-theme'); if (t) root.dataset.theme = t; } catch (_) {}
  $('themeBtn').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('pf-theme', root.dataset.theme); } catch (_) {}
  });

  // ---- Share
  $('shareBtn').addEventListener('click', async () => {
    const data = { title: document.title, url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else { await navigator.clipboard.writeText(location.href); alert('Link disalin!'); }
    } catch (_) {}
  });

  // ---- Edit mode: open /portfolio?edit=1 to preview a banner/avatar from your device (not saved)
  if (new URLSearchParams(location.search).has('edit')) {
    document.body.classList.add('editing');
    let target = null;
    document.querySelectorAll('.edit-pick').forEach(b => {
      b.innerHTML = ICON.camera;
      b.addEventListener('click', () => { target = b.dataset.pick; $('filePick').click(); });
    });
    $('filePick').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f || !target) return;
      const url = URL.createObjectURL(f) + (f.type.startsWith('video/') ? '#video' : '');
      setMedia($(target), url);
      e.target.value = '';
    });
  }
})();
</script>
</body>
</html>
