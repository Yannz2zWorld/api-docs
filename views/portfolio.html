<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<meta name="description" content="Portfolio pribadi">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/views/assets/favicon.png">
<style>
  :root {
    --bg: #ffffff;
    --soft: #f5f5f5;
    --text: #0a0a0a;
    --muted: #737373;
    --line: #e5e5e5;
    --accent: #1d9bf0;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --soft: #171717;
      --text: #fafafa;
      --muted: #a3a3a3;
      --line: #262626;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  img, video { display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 18px; height: 18px; flex: none; }

  .page { max-width: 600px; margin: 0 auto; min-height: 100vh; }

  /* Banner */
  .banner {
    position: relative; overflow: hidden;
    aspect-ratio: var(--banner-ratio, 16 / 9);
    background: var(--soft);
  }
  .banner > img, .banner > video { width: 100%; height: 100%; object-fit: cover; }
  @media (min-width: 600px) { .banner { border-radius: 0 0 16px 16px; } }

  /* Profile */
  .head { padding: 0 20px; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-end; }
  .avatar {
    --size: clamp(84px, 24vw, 120px);
    position: relative; overflow: hidden; flex: none;
    width: var(--size); height: var(--size);
    margin-top: calc(var(--size) / -2);
    border-radius: 50%;
    border: 4px solid var(--bg);
    background: var(--soft);
  }
  .avatar img, .avatar video { width: 100%; height: 100%; object-fit: cover; }
  .avatar-initial { width: 100%; height: 100%; display: grid; place-items: center; font-size: 36px; font-weight: 600; color: var(--muted); }
  .actions { display: flex; gap: 8px; padding-top: 12px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 36px; padding: 0 16px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 14px; font-weight: 600;
    transition: background-color .15s;
  }
  .btn:hover { background: var(--soft); }
  .btn.icon { width: 36px; padding: 0; }
  .btn.solid { background: var(--text); border-color: var(--text); color: var(--bg); }
  .btn.solid:hover { opacity: .85; background: var(--text); }

  .name { margin: 12px 0 0; font-size: 20px; font-weight: 700; line-height: 1.25; display: flex; align-items: center; gap: 4px; overflow-wrap: anywhere; }
  .verified { width: 20px; height: 20px; color: var(--accent); }
  .handle { color: var(--muted); }
  .bio { margin: 12px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; color: var(--muted); font-size: 14px; }
  .meta > * { display: inline-flex; align-items: center; gap: 5px; }
  .meta svg { width: 16px; height: 16px; }
  .meta a:hover { color: var(--text); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-top: 12px; font-size: 14px; color: var(--muted); }
  .stats b { color: var(--text); font-weight: 600; }

  /* Tabs */
  .tabs {
    position: sticky; top: 0; z-index: 10;
    display: flex; margin-top: 20px;
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .tab { flex: 1; padding: 14px 0 12px; color: var(--muted); font-size: 14px; font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--text); }
  .panel[hidden] { display: none; }

  /* Portfolio grid */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; }
  .tile { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--soft); }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; }
  .tile .over {
    position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 10px;
    background: linear-gradient(transparent 50%, rgba(0,0,0,.6));
    color: #fff; font-size: 13px; font-weight: 600; text-align: left;
    opacity: 0; transition: opacity .2s;
  }
  .tile:hover .over, .tile:focus-visible .over { opacity: 1; }
  .tile .badge { position: absolute; top: 8px; right: 8px; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
  @media (hover: none) { .tile.has-media .over { opacity: 1; } }

  /* Sections */
  .section { padding: 24px 20px; border-bottom: 1px solid var(--line); }
  #sec-social { border-bottom: 0; }
  .section h2 { margin: 0 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; }
  .exp { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .exp li { display: flex; justify-content: space-between; gap: 12px; }
  .exp b { font-weight: 600; display: block; }
  .exp span { color: var(--muted); font-size: 14px; }
  .exp time { color: var(--muted); font-size: 13px; white-space: nowrap; }

  /* Contact list */
  .list { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; transition: background-color .15s; }
  .row + .row { border-top: 1px solid var(--line); }
  .row:hover { background: var(--soft); }
  .row .lbl { flex: 1; min-width: 0; }
  .row .lbl b { display: block; font-weight: 600; font-size: 14px; }
  .row .lbl span { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
  .row .go { color: var(--muted); }

  /* Socials */
  .socials { display: flex; flex-wrap: wrap; gap: 10px; }
  .social {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid var(--line); color: var(--text);
    transition: background-color .15s, color .15s, border-color .15s;
  }
  .social svg { width: 20px; height: 20px; }
  .social:hover { background: var(--text); border-color: var(--text); color: var(--bg); }

  footer { padding: 28px 20px 40px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Project dialog */
  dialog {
    width: min(520px, calc(100% - 32px)); max-height: calc(100vh - 32px);
    padding: 0; border: 1px solid var(--line); border-radius: 16px;
    background: var(--bg); color: var(--text); overflow: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  .d-media { background: #000; }
  .d-media img, .d-media video { width: 100%; max-height: 65vh; object-fit: contain; }
  .d-body { padding: 20px; }
  .d-body h3 { margin: 0 0 6px; font-size: 18px; }
  .d-body p { margin: 0 0 14px; color: var(--muted); }
  .d-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* Edit mode (?edit=1): preview banner/avatar from your device, not saved */
  .pick { position: absolute; z-index: 2; inset: 0; margin: auto; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: none; place-items: center; }
  body.editing .pick { display: grid; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<script>

const PROFILE = {

<main class="page">
  <div class="banner" id="banner"><button class="pick" data-pick="banner" aria-label="Ganti banner"></button></div>

  <section class="head">
    <div class="head-row">
      <div class="avatar" id="avatar"><button class="pick" data-pick="avatar" aria-label="Ganti foto profil"></button></div>
      <div class="actions">
        <button class="btn icon" id="share" aria-label="Bagikan profil" title="Bagikan"></button>

  <footer id="footer"></footer>
</main>

<dialog id="dialog"></dialog>
<input type="file" id="file" accept="image/*,video/*" hidden>

<script>
(function () {
  const P = PROFILE;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isVideo = src => /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(src) || /#video$/.test(src);
  const svg = (d, fill) => `<svg viewBox="0 0 24 24" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${d}</svg>`;

  const I = {
    verified: '<svg class="verified" viewBox="0 0 24 24" role="img" aria-label="Terverifikasi"><path fill="currentColor" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34zm-11.71 4.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/></svg>',
    pin: svg('<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'),
    link: svg('<path d="M10 13a5 5 0 0 0 7.07 0l3-3a5 5 0 0 0-7.07-7.07l-1.5 1.5"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3a5 5 0 0 0 7.07 7.07l1.5-1.5"/>'),
    cal: svg('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>'),
    share: svg('<path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'),
    mail: svg('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>'),
    phone: svg('<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>'),
    arrow: svg('<path d="M7 17 17 7M8 7h9v9"/>'),
    camera: svg('<path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/>'),
    play: svg('<path d="M8 5v14l11-7z"/>', true),
    youtube: svg('<path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>', true),
    tiktok: svg('<path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>', true),
    x: svg('<path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>', true),
    instagram: svg('<rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.3"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor"/>'),
    whatsapp: svg('<path d="M3.5 20.5l1.3-4.2A8.7 8.7 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.5-2-1-1 .8a5 5 0 0 1-2.3-2.3l.8-1-1-2z"/>'),
  };
  const SOCIALS = [['youtube', 'YouTube'], ['tiktok', 'TikTok'], ['x', 'X'], ['instagram', 'Instagram'], ['whatsapp', 'WhatsApp']];
  const waUrl = v => /^https?:/i.test(v) ? v : 'https://wa.me/' + String(v).replace(/\D/g, '');

  function media(src, { controls = false, eager = false } = {}) {
    if (!src) return '';
    if (isVideo(src)) return `<video src="${esc(src.replace(/#video$/, ''))}" ${controls ? 'controls' : 'autoplay loop muted'} playsinline preload="${eager ? 'auto' : 'metadata'}"></video>`;
    return `<img src="${esc(src)}" alt="" decoding="async" ${eager ? 'fetchpriority="high"' : 'loading="lazy"'}>`;
  }
  function setMedia(el, src) {
    el.querySelectorAll('img, video, .avatar-initial').forEach(n => n.remove());
    if (src) el.insertAdjacentHTML('afterbegin', media(src, { eager: true }));
    else if (el.id === 'avatar') el.insertAdjacentHTML('afterbegin', `<div class="avatar-initial">${esc((P.name || '?').trim().charAt(0).toUpperCase())}</div>`);
  }
  const hide = id => $(id).remove();

  // Profile
  document.title = `${P.name} (@${P.username})`;
  document.querySelector('meta[name="description"]').content = P.bio.replace(/\n/g, ' ');
  document.documentElement.style.setProperty('--banner-ratio', P.bannerRatio || '16 / 9');
  setMedia($('banner'), P.banner);
  setMedia($('avatar'), P.avatar);
  $('name').textContent = P.name;
  $('badge').innerHTML = P.verified ? I.verified : '';
  $('handle').textContent = '@' + P.username;
  $('bio').textContent = P.bio;
  $('meta').innerHTML = [
    P.location && `<span>${I.pin}${esc(P.location)}</span>`,
    P.website && `<a href="${esc(P.website)}" target="_blank" rel="noopener">${I.link}${esc(P.website.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>`,
    P.joined && `<span>${I.cal}${esc(P.joined)}</span>`,
  ].filter(Boolean).join('');
  $('stats').innerHTML = (P.stats || []).map(s => `<span><b>${esc(s.value)}</b> ${esc(s.label)}</span>`).join('');

  // Tabs
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(t => t.addEventListener('click', () => tabs.forEach(x => {
    x.setAttribute('aria-selected', x === t);
    $(x.getAttribute('aria-controls')).hidden = x !== t;
  })));

  // Portfolio
  $('grid').innerHTML = (P.projects || []).map((p, i) => `
    <button class="tile${p.media ? ' has-media' : ''}" data-i="${i}" aria-label="${esc(p.title)}">
      ${p.media ? media(p.media) : `<span class="ph">${esc(p.title)}</span>`}
      ${p.media && isVideo(p.media) ? `<span class="badge">${I.play}</span>` : ''}
      ${p.media ? `<span class="over">${esc(p.title)}</span>` : ''}
    </button>`).join('');

  const dlg = $('dialog');
  $('grid').addEventListener('click', e => {
    const t = e.target.closest('.tile'); if (!t) return;
    const p = P.projects[+t.dataset.i];
    dlg.innerHTML = `
      ${p.media ? `<div class="d-media">${media(p.media, { controls: isVideo(p.media), eager: true })}</div>` : ''}
      <div class="d-body">
        <h3>${esc(p.title)}</h3>
        ${p.desc ? `<p>${esc(p.desc)}</p>` : ''}
        ${p.tags?.length ? `<div class="chips">${p.tags.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : ''}
        <div class="d-foot">
          <button class="btn" data-close>Tutup</button>
          ${p.link ? `<a class="btn solid" href="${esc(p.link)}" target="_blank" rel="noopener">Lihat proyek</a>` : ''}
        </div>
      </div>`;
    dlg.showModal();
  });
  dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
  dlg.addEventListener('close', () => { dlg.innerHTML = ''; });

  // About
  if (P.skills?.length) $('skills').innerHTML = P.skills.map(s => `<span class="chip">${esc(s)}</span>`).join('');
  else hide('sec-skills');
  if (P.experience?.length) $('exp').innerHTML = P.experience.map(x => `<li><div><b>${esc(x.what)}</b><span>${esc(x.where)}</span></div><time>${esc(x.when)}</time></li>`).join('');
  else hide('sec-exp');

  // Contact
  const c = P.contact || {}, wa = P.socials?.whatsapp;
  const rows = [
    c.email && [`mailto:${c.email}`, I.mail, 'Email', c.email],
    wa && [waUrl(wa), I.whatsapp, 'WhatsApp', /^https?:/i.test(wa) ? 'Kirim pesan' : '+' + String(wa).replace(/\D/g, '')],
    c.phone && [`tel:${c.phone.replace(/[^\d+]/g, '')}`, I.phone, 'Telepon', c.phone],
  ].filter(Boolean);
  if (rows.length) $('contact').innerHTML = rows.map(([href, icon, label, value]) => `
    <a class="row" href="${esc(href)}" ${href.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>
      ${icon}<span class="lbl"><b>${label}</b><span>${esc(value)}</span></span><span class="go">${I.arrow}</span>
    </a>`).join('');
  else hide('kontak');

  // Socials
  const socials = SOCIALS.filter(([k]) => P.socials?.[k]);
  if (socials.length) $('socials').innerHTML = socials.map(([k, label]) => `
    <a class="social" href="${esc(k === 'whatsapp' ? waUrl(P.socials[k]) : P.socials[k])}" target="_blank" rel="noopener" aria-label="${label}" title="${label}">${I[k]}</a>`).join('');
  else hide('sec-social');

  $('footer').textContent = `© ${new Date().getFullYear()} ${P.name}`;

  // Share
  $('share').innerHTML = I.share;
  $('share').addEventListener('click', async () => {
    try {
      if (navigator.share) await navigator.share({ title: document.title, url: location.href });
      else { await navigator.clipboard.writeText(location.href); $('share').title = 'Link disalin'; }
    } catch (_) {}
  });

  // Pause looping videos for visitors who prefer reduced motion
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelectorAll('video[autoplay]').forEach(v => { v.autoplay = false; v.pause(); });

  // Edit mode: /portfolio?edit=1 previews a banner/avatar from your device (not saved)
  if (new URLSearchParams(location.search).has('edit')) {
    document.body.classList.add('editing');
    let target = null;
    document.querySelectorAll('.pick').forEach(b => {
      b.innerHTML = I.camera;
      b.addEventListener('click', () => { target = b.dataset.pick; $('file').click(); });
    });
    $('file').addEventListener('change', e => {
      const f = e.target.files[0]; if (!f || !target) return;
      setMedia($(target), URL.createObjectURL(f) + (f.type.startsWith('video/') ? '#video' : ''));
      e.target.value = '';
    });
  }
})();
</script>
</body>
</html>
