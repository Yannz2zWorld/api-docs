<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner — Yannz API</title><style>*{box-sizing:border-box}body{font:15px system-ui;background:#fffdf7;color:#111;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}h1{font-size:42px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs a,button{border:2px solid #111;padding:10px;background:#ffe45e;color:#111;font-weight:700;box-shadow:3px 3px #111;text-decoration:none;cursor:pointer}.panel{margin-top:24px;border:3px solid #111;padding:20px;background:white;box-shadow:6px 6px #111;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}input,select{padding:9px;border:2px solid #111;max-width:100%}.muted{color:#666}</style></head><body><main class="wrap"><a href="/home">← Home</a><h1>Owner Console</h1><nav class="tabs"><a href="#dash">Dashboard</a><a href="#users">Users</a><a href="#endpoints">Endpoints</a><a href="#payments">Payments</a><a href="#server">Server</a><a href="/owner/backup">Backup JSON</a><a href="#audit">Audit Logs</a></nav><section class="panel" id="dash"><h2>Dashboard</h2><pre id="dash-data">Loading…</pre></section><section class="panel" id="users"><h2>Users</h2><input id="q" placeholder="Search email/name"><button onclick="loadUsers()">Search</button><div id="users-data"></div></section><section class="panel" id="endpoints"><h2>Endpoint registry</h2><div><input id="ep-name" placeholder="Name"><input id="ep-path" placeholder="/api/example"><input id="ep-desc" placeholder="Description"><select id="ep-tier"><option>FREE</option><option>SULTAN</option><option>SEPUH</option><option>DEWA</option><option>OWNER</option></select><button onclick="addEndpoint()">Add metadata</button></div><div id="endpoints-data"></div><p class="muted">Registry controls metadata/access flags. New executable handlers still require a deployed plugin.</p></section><section class="panel" id="payments"><h2>Payments</h2><div id="payments-data"></div></section><section class="panel" id="server"><h2>Maintenance Server</h2><label><input type="checkbox" id="maint"> Maintenance enabled</label><p><input id="message" placeholder="Maintenance message" style="width:min(100%,600px)"></p><button onclick="saveServer()">Save settings</button><pre id="server-data"></pre></section><section class="panel" id="audit"><h2>Audit Logs</h2><pre id="audit-data"></pre></section></main><script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){const r=await fetch(url,{credentials:'same-origin',...opts});const d=await r.json();if(!r.ok)throw Error(d.message||d.error||'Request failed');return d}const json=o=>JSON.stringify(o,null,2);
async function loadUsers(){try{const d=await api('/owner/users?q='+encodeURIComponent($('q').value));$('users-data').innerHTML='<table><tr><th>User</th><th>Tier / Status</th><th>Actions</th></tr>'+d.users.map(u=>`<tr><td>${esc(u.name)}<br><small>${esc(u.email)}</small><br><small>${esc(u.id)}</small></td><td>${esc(u.tier)} / ${esc(u.status)}</td><td><select id="tier-${esc(u.id)}"><option>FREE</option><option>SULTAN</option><option>SEPUH</option><option>DEWA</option></select><button onclick="changeTier('${esc(u.id)}')">Set tier</button> ${u.status==='pending'?`<button onclick="userAction('${esc(u.id)}','approve')">Approve</button>`:''} <button onclick="userAction('${esc(u.id)}','${u.status==='banned'?'unban':'ban'}')">${u.status==='banned'?'Unban':'Ban'}</button> <button onclick="userAction('${esc(u.id)}','delete')">Delete</button></td></tr>`).join('')+'</table>';}catch(e){$('users-data').textContent=e.message}}
async function userAction(id,action){if(!confirm(`${action} user?`))return;try{await api(`/owner/users/${id}${action==='delete'?'':'/'+action}`,{method:action==='delete'?'DELETE':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason:action==='ban'?prompt('Optional ban reason')||'Owner action':''})});loadUsers()}catch(e){alert(e.message)}}async function changeTier(id){try{await api(`/owner/users/${id}/tier`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({tier:$(`tier-${id}`).value})});loadUsers()}catch(e){alert(e.message)}}
async function loadEndpoints(){try{const d=await api('/owner/api/endpoints');$('endpoints-data').innerHTML='<table><tr><th>Endpoint</th><th>Access</th><th>State</th><th>Actions</th></tr>'+d.endpoints.map(e=>`<tr><td>${esc(e.name)}<br><small>${esc(e.method)} ${esc(e.path)}</small></td><td><select id="ep-tier-${e.id}"><option ${e.minimum_tier==='FREE'?'selected':''}>FREE</option><option ${e.minimum_tier==='SULTAN'?'selected':''}>SULTAN</option><option ${e.minimum_tier==='SEPUH'?'selected':''}>SEPUH</option><option ${e.minimum_tier==='DEWA'?'selected':''}>DEWA</option><option ${e.minimum_tier==='OWNER'?'selected':''}>OWNER</option></select> <button onclick="setEndpointTier('${e.id}')">Save tier</button><br>${e.locked?'locked':'open'}</td><td>${esc(e.status)}</td><td><button onclick="endpointAction('${e.id}','${e.locked?'unlock':'lock'}')">${e.locked?'Unlock':'Lock'}</button> <button onclick="endpointAction('${e.id}','delete')">Delete metadata</button></td></tr>`).join('')+'</table>';}catch(e){$('endpoints-data').textContent=e.message}}async function addEndpoint(){try{await api('/owner/api/endpoints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('ep-name').value,path:$('ep-path').value,description:$('ep-desc').value,minimum_tier:$('ep-tier').value})});loadEndpoints()}catch(e){alert(e.message)}}async function setEndpointTier(id){try{await api(`/owner/api/endpoints/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({minimum_tier:$(`ep-tier-${id}`).value})});loadEndpoints()}catch(e){alert(e.message)}}async function endpointAction(id,action){if(!confirm(`${action} endpoint metadata?`))return;try{await api(`/owner/api/endpoints/${id}${action==='delete'?'':'/'+action}`,{method:action==='delete'?'DELETE':'POST'});loadEndpoints()}catch(e){alert(e.message)}}
async function loadPayments(){try{const d=await api('/owner/payments');$('payments-data').innerHTML='<table><tr><th>Order / User</th><th>Amount / Method</th><th>Status</th><th>Actions</th></tr>'+d.payments.map(p=>`<tr><td>${esc(p.order_code)}<br>${esc(p.name)}<br><small>${esc(p.email)}</small></td><td>Rp${Number(p.amount).toLocaleString('id-ID')}<br>${esc(p.payment_method)} · ${esc(p.tier)}<br>${p.proof_url?`<a href="${esc(p.proof_url)}" rel="noreferrer" target="_blank">Proof link</a>`:''}</td><td>${esc(p.status)}</td><td>${p.status==='pending'&&p.provider==='manual'?`<button onclick="paymentAction('${p.id}','approve')">Approve</button> <button onclick="paymentAction('${p.id}','reject')">Reject</button>`:'—'}</td></tr>`).join('')+'</table>';}catch(e){$('payments-data').textContent=e.message}}async function paymentAction(id,action){if(!confirm(`${action} payment?`))return;try{await api(`/owner/payments/${id}/${action}`,{method:'POST'});loadPayments()}catch(e){alert(e.message)}}
async function saveServer(){try{$('server-data').textContent=json(await api('/owner/server',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({maintenance_enabled:$('maint').checked,maintenance_message:$('message').value})}))}catch(e){$('server-data').textContent=e.message}}
async function load(){try{const d=await api('/owner/dashboard');$('dash-data').textContent=json(d.stats);const s=await api('/owner/server');$('maint').checked=s.settings.maintenance_enabled;$('message').value=s.settings.maintenance_message;$('audit-data').textContent=json(await api('/owner/audit'));await Promise.all([loadUsers(),loadEndpoints(),loadPayments()]);}catch(e){$('dash-data').textContent=e.message}}load();
</script></body></html>
