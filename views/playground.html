<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playground — Yannz API</title>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=2"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<script src="/assets/i18n.js"></script>
<style>
  .hero-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .counter { font: 700 13px "DM Mono", monospace; color: var(--muted); }
  .counter b { color: var(--ink); font-size: 22px; font-family: "Space Grotesk", sans-serif; }
  .toolbar { display: grid; gap: 12px; margin: 22px 0 6px; }
  .toolbar input[type=search] { width: 100%; font-size: 15px; padding: 13px 14px; }
  .folders { display: grid; gap: 14px; margin-top: 14px; }
  .folder { border: var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
  .folder > summary { list-style: none; display: flex; align-items: center; gap: 14px; padding: 18px 20px; cursor: pointer; user-select: none; }
  .folder > summary::-webkit-details-marker { display: none; }
  .folder > summary:hover { background: var(--surface-2); }
  .folder[open] > summary { background: var(--accent); color: var(--accent-ink); }
  .folder-icon { width: 26px; height: 22px; flex: none; }
  .folder-name { font: 700 19px "Space Grotesk", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
  .folder-count { font: 600 13px "DM Mono", monospace; opacity: .75; }
  .folder-chev { margin-left: auto; width: 22px; height: 22px; flex: none; transition: transform .2s var(--ease); }
  .folder[open] .folder-chev { transform: rotate(180deg); }
  .folder-body { border-top: var(--line); }
  .ep { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 14px 20px; border-bottom: 1.5px solid var(--edge-soft); }
  .ep:last-child { border-bottom: 0; }
  .ep:hover { background: var(--surface-2); }
  .ep h2 { font-size: 16px; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
  .ep p { margin: 0; color: var(--muted); font-size: 13.5px; grid-column: 1; }
  .ep code { grid-column: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ep .btn { grid-column: 2; grid-row: 1 / span 3; padding: 8px 12px; font-size: 11px; box-shadow: 3px 3px 0 var(--drop); }
  .ep .chip { font-size: 10px; }
  .folder-tools { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .folder-tools button { padding: 7px 11px; font-size: 11px; box-shadow: 2px 2px 0 var(--drop); }
  @media (max-width: 560px) { .ep { grid-template-columns: 1fr; } .ep .btn { grid-column: 1; grid-row: auto; justify-self: start; } .folder > summary { padding: 16px; } .ep { padding: 14px 16px; } }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
  .site-foot { border-top: 2px solid var(--edge-soft); margin-top: 40px; padding: 26px 16px 40px; }
  .site-foot .inner { max-width: 1180px; margin: auto; display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
  .site-foot nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/home"><span class="brand-mark">Y</span><span id="web-title">Yannz API</span></a><nav class="nav" aria-label="Navigasi utama"><a href="/home">Dashboard</a><a href="/api/playground" aria-current="page">Playground</a><a href="/api">Sandbox</a><a href="/keys">Keys</a><a href="/billing">Billing</a><a href="/pricing">Pricing</a><div data-lang-switch></div></nav></div></header>
<main class="wrap wide">
  <div class="hero-row">
    <div>
      <span class="kicker">Katalog endpoint</span>
      <h1>API Playground</h1>
      <p class="lead">Cari endpoint, cek tier yang dibutuhin, terus langsung coba di Sandbox pakai sesi login atau API key kamu.</p>
    </div>
    <p class="counter" aria-live="polite"><b id="api-counter">—</b> endpoint tersedia</p>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Cari nama, deskripsi, atau path…" aria-label="Cari endpoint" autocomplete="off">
    <div class="folder-tools"><button type="button" id="open-all">Buka semua</button><button type="button" id="close-all">Tutup semua</button></div>
  </div>

  <div class="folders" id="grid" aria-live="polite"><p class="loading">Lagi muat katalog…</p></div>
</main>
<footer class="site-foot"><div class="inner">
  <span>© <span id="year"></span> <span id="creator">Yannz2z</span> · Yannz API</span>
  <nav aria-label="Kontak"><a id="wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a><a id="tg" href="#" target="_blank" rel="noopener noreferrer">Telegram</a><a id="ch" href="#" target="_blank" rel="noopener noreferrer">Saluran WA</a><a id="mail" href="#">Email</a></nav>
</div></footer>
<script>
const $ = s => document.querySelector(s);
const epBadge = b => { const m = { new: ['🍃', 'New'], hot: ['🔥', 'Hot'], recommend: ['👍', 'Recommend'] }[b]; return m ? `<span class="ep-badge ep-badge--${b}"><span class="ep-badge-ic" aria-hidden="true">${m[0]}</span>${m[1]}</span>` : ''; };
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let catalog = {};
const openState = new Set();   // folders the visitor opened (kept while searching)
$('#year').textContent = new Date().getFullYear();

fetch('/api/set').then(r => r.json()).then(s => {
  $('#web-title').textContent = s.webName || 'Yannz API';
  $('#creator').textContent = s.creatorName || 'Yannz2z';
  const links = { wa: s.whatsappLink, tg: s.telegramLink, ch: s.whatsappChannelLink, mail: s.emailAddress ? 'mailto:' + s.emailAddress : '' };
  for (const [id, href] of Object.entries(links)) { if (href) $('#' + id).href = href; else $('#' + id).hidden = true; }
}).catch(() => {});

const FOLDER = '<svg class="folder-icon" viewBox="0 0 26 22" aria-hidden="true"><path fill="currentColor" d="M2 3.5A2.5 2.5 0 0 1 4.5 1h6.2l2.6 3h8.2A2.5 2.5 0 0 1 24 6.5v12a2.5 2.5 0 0 1-2.5 2.5h-17A2.5 2.5 0 0 1 2 18.5z"/></svg>';
const CHEV = '<svg class="folder-chev" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>';

// Each category is a folder (closed by default) holding its endpoints. While searching, folders
// with a match open by themselves and show only the matching endpoints.
function render() {
  const q = $('#search').value.trim().toLowerCase();
  const folders = [];
  for (const [cat, items] of Object.entries(catalog)) {
    const rows = [];
    for (const api of items) {
      const path = api.cleanPath || api.path.split('?')[0];
      if (q && ![api.name, api.desc, path, cat].some(v => String(v || '').toLowerCase().includes(q))) continue;
      const tier = (t => (t === 'OWNER' ? 'DEVELOPER' : t))(api.access?.minimum_tier || 'FREE');
      const state = api.access?.status && api.access.status !== 'active' ? ['nonaktif', 'bad'] : api.access?.locked ? ['terkunci', 'warn'] : null;
      rows.push(`<div class="ep">
        <h2><span data-no-i18n>${esc(api.name)}</span> <span class="chip">GET</span><span class="chip">${esc(tier)}</span>${state ? `<span class="chip ${state[1]}">${state[0]}</span>` : ''}${epBadge(api.access?.badge)}</h2>
        <p data-no-i18n>${esc(api.desc)}</p>
        <code title="${esc(path)}">${esc(path)}</code>
        <a class="btn primary" href="/api?endpoint=${encodeURIComponent(path)}">Coba →</a>
      </div>`);
    }
    if (!rows.length) continue;
    const open = q ? true : openState.has(cat);
    folders.push(`<details class="folder" data-cat="${esc(cat)}"${open ? ' open' : ''}>
      <summary>${FOLDER}<span class="folder-name" data-no-i18n>${esc(cat)}</span><span class="folder-count">(${q ? rows.length + '/' : ''}${items.length})</span>${CHEV}</summary>
      <div class="folder-body">${rows.join('')}</div>
    </details>`);
  }
  $('#grid').innerHTML = folders.length ? folders.join('') : '<div class="empty"><b>Nggak ada yang cocok.</b><br>Coba kata kunci lain.</div>';
}

fetch('/api/endpoints').then(r => r.json()).then(d => {
  catalog = d.endpoints || {};
  $('#api-counter').textContent = d.total ?? Object.values(catalog).flat().length;
  // ?cat=AI opens that folder (links from elsewhere).
  const want = new URLSearchParams(location.search).get('cat');
  if (want) Object.keys(catalog).filter(c => c.toLowerCase() === want.toLowerCase()).forEach(c => openState.add(c));
  render();
}).catch(() => { $('#grid').innerHTML = '<p class="error">Katalog lagi nggak bisa dibuka. Coba muat ulang halamannya.</p>'; });

$('#grid').addEventListener('toggle', e => {
  const d = e.target.closest('details.folder');
  if (!d || $('#search').value.trim()) return;
  if (d.open) openState.add(d.dataset.cat); else openState.delete(d.dataset.cat);
}, true);
$('#open-all').addEventListener('click', () => { Object.keys(catalog).forEach(c => openState.add(c)); render(); });
$('#close-all').addEventListener('click', () => { openState.clear(); render(); });
$('#search').addEventListener('input', render);
</script>
<script src="/assets/music.js" defer></script>
</body>
</html>
