<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playground — Yannz API</title>
<link rel="icon" href="/api/logo-proxy">
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  .hero-row { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .counter { font: 700 13px "DM Mono", monospace; color: var(--muted); }
  .counter b { color: var(--ink); font-size: 22px; font-family: "Space Grotesk", sans-serif; }
  .toolbar { display: grid; gap: 12px; margin: 22px 0 6px; }
  .toolbar input[type=search] { width: 100%; font-size: 15px; padding: 13px 14px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scrollbar-width: thin; }
  .cats button { flex: 0 0 auto; box-shadow: 2px 2px 0 var(--drop); padding: 8px 12px; font-size: 11px; }
  .cats button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
  .ep { display: flex; flex-direction: column; gap: 8px; padding: 18px; border: var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); transition: transform .2s var(--ease), box-shadow .2s var(--ease); min-width: 0; }
  .ep:hover { transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--drop); }
  .ep-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .ep h2 { font-size: 18px; margin: 4px 0 0; }
  .ep p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .ep-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 10px; border-top: 1.5px solid var(--edge-soft); min-width: 0; }
  .ep-foot code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ep-foot .btn { flex: 0 0 auto; padding: 8px 12px; font-size: 11px; box-shadow: 3px 3px 0 var(--drop); }
  .empty { text-align: center; padding: 40px 10px; color: var(--muted); }
  .site-foot { border-top: 2px solid var(--edge-soft); margin-top: 40px; padding: 26px 16px 40px; }
  .site-foot .inner { max-width: 1180px; margin: auto; display: flex; flex-wrap: wrap; gap: 14px 22px; justify-content: space-between; align-items: center; color: var(--muted); font-size: 14px; }
  .site-foot nav { display: flex; flex-wrap: wrap; gap: 8px 16px; }
</style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="/home"><span class="brand-mark">Y</span><span id="web-title">Yannz API</span></a><nav class="nav" aria-label="Navigasi utama"><a href="/home">Dashboard</a><a href="/api/playground" aria-current="page">Playground</a><a href="/api">Sandbox</a><a href="/keys">Keys</a><a href="/billing">Billing</a><a href="/pricing">Pricing</a></nav></div></header>
<main class="wrap wide">
  <div class="hero-row">
    <div>
      <span class="kicker">Katalog endpoint</span>
      <h1>API Playground</h1>
      <p class="lead">Cari endpoint, lihat tier yang dibutuhkan, lalu coba langsung di Sandbox dengan sesi login atau API key kamu.</p>
    </div>
    <p class="counter" aria-live="polite"><b id="api-counter">—</b> endpoint</p>
  </div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="Cari nama, deskripsi, atau path…" aria-label="Cari endpoint" autocomplete="off">
    <div class="cats" id="cats" role="toolbar" aria-label="Kategori"><button type="button" data-cat="ALL" aria-pressed="true">Semua</button></div>
  </div>

  <div class="ep-grid" id="grid" aria-live="polite"><p class="loading">Memuat katalog…</p></div>
</main>
<footer class="site-foot"><div class="inner">
  <span>© <span id="year"></span> <span id="creator">Yannz2z</span> · Yannz API</span>
  <nav aria-label="Kontak"><a id="wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a><a id="tg" href="#" target="_blank" rel="noopener noreferrer">Telegram</a><a id="ig" href="#" target="_blank" rel="noopener noreferrer">Instagram</a><a id="ch" href="#" target="_blank" rel="noopener noreferrer">Saluran WA</a><a id="mail" href="#">Email</a></nav>
</div></footer>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let catalog = {};
let active = 'ALL';
$('#year').textContent = new Date().getFullYear();

fetch('/api/set').then(r => r.json()).then(s => {
  $('#web-title').textContent = s.webName || 'Yannz API';
  $('#creator').textContent = s.creatorName || 'Yannz2z';
  const links = { wa: s.whatsappLink, tg: s.telegramLink, ig: s.instagramLink, ch: s.whatsappChannelLink, mail: s.emailAddress ? 'mailto:' + s.emailAddress : '' };
  for (const [id, href] of Object.entries(links)) { if (href) $('#' + id).href = href; else $('#' + id).hidden = true; }
}).catch(() => {});

function render() {
  const q = $('#search').value.trim().toLowerCase();
  const cards = [];
  for (const [cat, items] of Object.entries(catalog)) {
    if (active !== 'ALL' && active !== cat) continue;
    for (const api of items) {
      const path = api.cleanPath || api.path.split('?')[0];
      if (q && ![api.name, api.desc, path, cat].some(v => String(v || '').toLowerCase().includes(q))) continue;
      const tier = api.access?.minimum_tier || 'FREE';
      const state = api.access?.status && api.access.status !== 'active' ? ['nonaktif', 'bad'] : api.access?.locked ? ['terkunci', 'warn'] : ['aktif', 'ok'];
      cards.push(`<article class="ep">
        <div class="ep-top"><span class="chip">${esc(cat)}</span><span class="chip ${state[1]}">${state[0]}</span></div>
        <h2>${esc(api.name)}</h2>
        <p>${esc(api.desc)}</p>
        <div><span class="chip">GET</span><span class="chip">tier ${esc(tier)}</span></div>
        <div class="ep-foot"><code title="${esc(path)}">${esc(path)}</code><a class="btn primary" href="/api?endpoint=${encodeURIComponent(path)}">Coba →</a></div>
      </article>`);
    }
  }
  $('#grid').innerHTML = cards.length ? cards.join('') : '<div class="empty" style="grid-column:1/-1"><b>Tidak ada yang cocok.</b><br>Coba kata kunci atau kategori lain.</div>';
}

fetch('/api/endpoints').then(r => r.json()).then(d => {
  catalog = d.endpoints || {};
  $('#api-counter').textContent = d.total ?? Object.values(catalog).flat().length;
  $('#cats').insertAdjacentHTML('beforeend', Object.keys(catalog).map(c => `<button type="button" data-cat="${esc(c)}" aria-pressed="false">${esc(c)}</button>`).join(''));
  render();
}).catch(() => { $('#grid').innerHTML = '<p class="error">Katalog sementara tidak tersedia. Coba muat ulang.</p>'; });

$('#cats').addEventListener('click', e => {
  const b = e.target.closest('button[data-cat]'); if (!b) return;
  active = b.dataset.cat;
  document.querySelectorAll('#cats button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
});
$('#search').addEventListener('input', render);
</script>
</body>
</html>
