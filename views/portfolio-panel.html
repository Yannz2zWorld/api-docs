<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diriku Panel</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/views/assets/favicon.png">
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --soft: #f5f5f5;
    --text: #0a0a0a;
    --muted: #737373;
    --line: #e5e5e5;
    --accent: #1d9bf0;
    --danger: #dc2626;
    --ok: #16a34a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0a;
      --card: #111111;
      --soft: #1a1a1a;
      --text: #fafafa;
      --muted: #a3a3a3;
      --line: #262626;
      --danger: #f87171;
      --ok: #4ade80;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg { width: 16px; height: 16px; flex: none; }

  .bar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .bar-in { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { font-weight: 700; font-size: 16px; }
  .status { color: var(--muted); font-size: 13px; }
  .status.dirty { color: var(--text); }
  .status.err { color: var(--danger); }
  .status.ok { color: var(--ok); }
  .sp { flex: 1; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; display: grid; gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .card > summary, .card > header { list-style: none; padding: 14px 16px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary::after { content: ""; margin-left: auto; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
  .card[open] > summary::after { transform: rotate(-135deg); }
  .card h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .card .count { color: var(--muted); font-size: 13px; }
  .body { padding: 0 16px 16px; display: grid; gap: 12px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  label.f { display: grid; gap: 4px; min-width: 0; align-content: start; }
  label.f > span { font-size: 12px; font-weight: 600; color: var(--muted); }
  input[type=text], input[type=url], input[type=email], textarea, select {
    width: 100%; min-width: 0; padding: 9px 11px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit;
  }
  textarea { resize: vertical; min-height: 72px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  .switch { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  .switch input { width: 18px; height: 18px; accent-color: var(--accent); }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 600; text-decoration: none;
  }
  .btn:hover { background: var(--soft); }
  .btn.solid { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.solid:hover { opacity: .85; }
  .btn.solid:disabled { opacity: .4; cursor: default; }
  .btn.danger { color: var(--danger); }
  .btn.add { justify-self: start; border-style: dashed; }
  .ibtn { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--line); background: var(--card); }
  .ibtn:hover { background: var(--soft); }
  .ibtn.danger { color: var(--danger); }
  .ibtn:disabled { opacity: .35; cursor: default; }

  .items { display: grid; gap: 10px; }
  .item { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; background: var(--bg); }
  .item-head { display: flex; align-items: center; gap: 6px; }
  .item-head b { font-size: 13px; }
  .item-head .sp { flex: 1; }
  .media-row { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
  .thumb { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--soft); display: grid; place-items: center; color: var(--muted); font-size: 11px; text-align: center; }
  .thumb.wide { width: 100%; height: auto; aspect-ratio: var(--r, 16 / 9); }
  .thumb.round { border-radius: 50%; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sub-items { display: grid; gap: 8px; padding-left: 10px; border-left: 2px solid var(--line); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 30; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 13px; }
  .toast[hidden] { display: none; }
  .gate { max-width: 420px; margin: 80px auto; padding: 24px; text-align: center; }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <span class="brand">Diriku Panel</span>
    <span class="status" id="status">Memuat…</span>
    <span class="sp"></span>
    <a class="btn" href="/portfolio" target="_blank" rel="noopener">Lihat portfolio</a>
    <button class="btn solid" id="save" disabled>Simpan</button>
  </div>
</header>

<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const isVideo = src => /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(src);
  const ytId = src => (String(src).match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{11})/) || [])[1] || null;
  const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const I = { up: svg('<path d="m18 15-6-6-6 6"/>'), down: svg('<path d="m6 9 6 6 6-6"/>'), del: svg('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'), plus: svg('<path d="M12 5v14M5 12h14"/>') };
  const PLATFORM_NAMES = { youtube: 'YouTube', tiktok: 'TikTok', x: 'X (Twitter)', instagram: 'Instagram', whatsapp: 'WhatsApp', facebook: 'Facebook', telegram: 'Telegram', github: 'GitHub', linkedin: 'LinkedIn', threads: 'Threads', spotify: 'Spotify', discord: 'Discord', website: 'Website' };
  const BG_NAMES_ALL = { dark: 1, light: 1, blue: 1, pink: 1, green: 1, orange: 1, purple: 1 };
  const PLACEHOLDER = { youtube: 'https://youtube.com/@kamu', tiktok: 'https://tiktok.com/@kamu', x: 'https://x.com/kamu', instagram: 'https://instagram.com/kamu', whatsapp: '6281234567890', facebook: 'https://facebook.com/kamu', telegram: 'https://t.me/kamu', github: 'https://github.com/kamu', linkedin: 'https://linkedin.com/in/kamu', threads: 'https://threads.net/@kamu', spotify: 'https://open.spotify.com/…', discord: 'https://discord.gg/…', website: 'https://…' };

  let S = null, platforms = Object.keys(PLATFORM_NAMES), ratios = ['16 / 9', '4 / 3', '3 / 1'], bgs = Object.keys(BG_NAMES_ALL), dirty = false, saving = false;

  // ---------------------------------------------------------------- state helpers
  const getPath = (o, k) => k.split('.').reduce((a, p) => (a == null ? a : a[p]), o);
  function setPath(o, k, v) {
    const parts = k.split('.'), last = parts.pop();
    const t = parts.reduce((a, p) => a[p], o);
    t[last] = v;
  }
  const splitList = v => String(v).split(/[,\n]/).map(s => s.trim()).filter(Boolean);
  function markDirty() {
    dirty = true;
    $('save').disabled = saving;
    status('Ada perubahan yang belum disimpan', 'dirty');
  }
  function status(t, cls = '') { const s = $('status'); s.textContent = t; s.className = 'status ' + cls; }
  let toastTimer;
  function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3500); }

  // ---------------------------------------------------------------- field builders
  const val = k => getPath(S, k) ?? '';
  const input = (k, label, { type = 'text', ph = '', media = false } = {}) => `
    <label class="f"><span>${label}</span><input type="${type}" data-k="${k}" ${media ? 'data-media' : ''} value="${esc(val(k))}" placeholder="${esc(ph)}"></label>`;
  const area = (k, label, ph = '') => `<label class="f"><span>${label}</span><textarea data-k="${k}" placeholder="${esc(ph)}">${esc(val(k))}</textarea></label>`;
  const listInput = (k, label, ph = '') => `<label class="f"><span>${label}</span><input type="text" data-k="${k}" data-list value="${esc((getPath(S, k) || []).join(', '))}" placeholder="${esc(ph)}"></label>`;
  const listArea = (k, label, ph = '') => `<label class="f"><span>${label}</span><textarea data-k="${k}" data-list placeholder="${esc(ph)}">${esc((getPath(S, k) || []).join(', '))}</textarea></label>`;
  function thumb(src, cls = '') {
    if (!src) return `<span class="thumb ${cls}">kosong</span>`;
    const yt = ytId(src);
    if (yt) return `<span class="thumb ${cls}"><img src="https://i.ytimg.com/vi/${yt}/default.jpg" alt=""></span>`;
    return `<span class="thumb ${cls}">${isVideo(src) ? `<video src="${esc(src)}" muted playsinline preload="metadata"></video>` : `<img src="${esc(src)}" alt="" onerror="this.replaceWith(document.createTextNode('gagal dimuat'))">`}</span>`;
  }
  const itemHead = (arrKey, i, n, title) => `
    <div class="item-head"><b>${esc(title)}</b><span class="sp"></span>
      <button class="ibtn" data-move="${arrKey}" data-i="${i}" data-d="-1" ${i === 0 ? 'disabled' : ''} aria-label="Naik">${I.up}</button>
      <button class="ibtn" data-move="${arrKey}" data-i="${i}" data-d="1" ${i === n - 1 ? 'disabled' : ''} aria-label="Turun">${I.down}</button>
      <button class="ibtn danger" data-del="${arrKey}" data-i="${i}" aria-label="Hapus">${I.del}</button>
    </div>`;
  const add = (arrKey, label) => `<button class="btn add" data-add="${arrKey}">${I.plus}${label}</button>`;
  const card = (id, title, count, body, open) => `
    <details class="card" id="c-${id}" ${open ? 'open' : ''}><summary><h2>${title}</h2>${count != null ? `<span class="count">${count}</span>` : ''}</summary><div class="body">${body}</div></details>`;
  // Story items (stories and highlight items): a photo/GIF/video link, or a text card.
  const BG_NAMES = { dark: 'Gelap', light: 'Terang', blue: 'Biru', pink: 'Pink', green: 'Hijau', orange: 'Oranye', purple: 'Ungu' };
  const BG_CSS = { dark: 'linear-gradient(160deg,#171717,#404040)', light: 'linear-gradient(160deg,#fafafa,#d4d4d4)', blue: 'linear-gradient(160deg,#1d4ed8,#38bdf8)', pink: 'linear-gradient(160deg,#be185d,#f472b6)', green: 'linear-gradient(160deg,#047857,#34d399)', orange: 'linear-gradient(160deg,#c2410c,#fb923c)', purple: 'linear-gradient(160deg,#5b21b6,#a78bfa)' };
  const storyItems = (key, nameOf) => {
    const arr = getPath(S, key) || [];
    return `<div class="items">${arr.map((m, i) => {
      const isText = m.type === 'text', k = `${key}.${i}`;
      const typeSel = `<label class="f"><span>Jenis</span><select data-k="${k}.type" data-rerender><option value="media" ${isText ? '' : 'selected'}>Foto / video / GIF</option><option value="text" ${isText ? 'selected' : ''}>Teks</option></select></label>`;
      const body = isText
        ? `<div class="media-row"><span class="thumb" style="background:${BG_CSS[m.bg] || BG_CSS.dark};color:${m.bg === 'light' ? '#0a0a0a' : '#fff'};font-weight:700">Aa</span>
            <div style="display:grid;gap:8px;min-width:0">${typeSel}${area(`${k}.text`, 'Teks cerita', 'Tulis sesuatu…')}
              <label class="f"><span>Latar</span><select data-k="${k}.bg" data-rerender>${bgs.map(b => `<option value="${b}" ${b === (m.bg || 'dark') ? 'selected' : ''}>${BG_NAMES[b] || b}</option>`).join('')}</select></label></div></div>`
        : `<div class="media-row">${thumb(m.media)}
            <div style="display:grid;gap:8px;min-width:0">${typeSel}${input(`${k}.media`, 'Link foto / video / GIF', { type: 'url', ph: 'https://…/foto.jpg', media: true })}${input(`${k}.caption`, 'Keterangan (opsional)')}</div></div>`;
      return `<div class="item">${itemHead(key, i, arr.length, nameOf(i))}${body}</div>`;
    }).join('')}</div>`;
  };
  const addStory = (key, label) => `<div style="display:flex;gap:8px;flex-wrap:wrap">${add(key, label + ' foto/video')}<button class="btn add" data-add="${key}" data-kind="text">${I.plus}${label} teks</button></div>`;

  // ---------------------------------------------------------------- render
  const openCards = new Set(['profil']);
  function render() {
    document.querySelectorAll('details.card').forEach(d => { const id = d.id.slice(2); d.open ? openCards.add(id) : openCards.delete(id); });
    const o = id => openCards.has(id);
    const html = [];

    html.push(card('profil', 'Profil', null, `
      <div class="grid2">${input('name', 'Nama')}${input('username', 'Username (tanpa @)')}</div>
      <label class="switch"><input type="checkbox" data-k="verified" ${S.verified ? 'checked' : ''}> Centang biru (terverifikasi)</label>
      ${area('bio', 'Deskripsi / bio')}
      <div class="grid2">${input('location', 'Lokasi')}${input('joined', 'Teks bergabung', { ph: 'Sejak 2024' })}</div>
      ${input('website', 'Website', { type: 'url', ph: 'https://…' })}`, o('profil')));

    html.push(card('media', 'Banner & foto profil', null, `
      <p class="hint">Tempel link foto, GIF, video (.mp4/.webm), atau YouTube. Bisa juga file di website ini, misalnya /views/assets/portfolio/banner.mp4.</p>
      <div style="--r:${esc(S.bannerRatio)}">${thumb(S.banner, 'wide')}</div>
      ${input('banner', 'Link banner', { type: 'url', ph: 'https://…/banner.jpg', media: true })}
      <label class="f"><span>Rasio banner</span><select data-k="bannerRatio">${ratios.map(r => `<option ${r === S.bannerRatio ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
      <div class="media-row">${thumb(S.avatar, 'round')}${input('avatar', 'Link foto profil', { type: 'url', ph: 'https://…/foto.jpg', media: true })}</div>`, o('media')));

    html.push(card('stories', 'Cerita', `${S.stories.length} item`, `
      <label class="f"><span>Tampilan cerita</span><select data-k="storyStyle">
        <option value="overlay" ${S.storyStyle !== 'view' ? 'selected' : ''}>Overlay: gelembung di samping foto profil, terbuka sebagai kartu (ada tombol View)</option>
        <option value="view" ${S.storyStyle === 'view' ? 'selected' : ''}>View: lingkaran di foto profil, langsung layar penuh</option>
      </select></label>
      <p class="hint">Cerita bisa berupa teks, foto, GIF, atau video. Foto dan teks tampil 5 detik, video sampai habis.</p>
      ${storyItems('stories', i => `Cerita ${i + 1}`)}${addStory('stories', 'Tambah')}`, o('stories')));

    html.push(card('highlights', 'Sorotan', `${S.highlights.length} grup`, `
      <p class="hint">Lingkaran kecil di bawah profil, berisi kumpulan cerita yang tetap tampil.</p>
      <div class="items">${S.highlights.map((h, i) => `
        <div class="item">${itemHead('highlights', i, S.highlights.length, h.title || `Sorotan ${i + 1}`)}
          <div class="grid2">${input(`highlights.${i}.title`, 'Judul')}${input(`highlights.${i}.cover`, 'Link sampul (opsional)', { type: 'url', media: true })}</div>
          <div class="sub-items">${storyItems(`highlights.${i}.items`, j => `Item ${j + 1}`)}${addStory(`highlights.${i}.items`, 'Tambah')}</div>
        </div>`).join('')}</div>${add('highlights', 'Tambah sorotan')}`, o('highlights')));

    html.push(card('projects', 'Portfolio', `${S.projects.length} karya`, `
      <p class="hint">Grid karya di halaman. Media bisa foto, GIF, video, atau link YouTube.</p>
      <div class="items">${S.projects.map((p, i) => `
        <div class="item">${itemHead('projects', i, S.projects.length, p.title || `Karya ${i + 1}`)}
          <div class="media-row">${thumb(p.media)}
            <div style="display:grid;gap:8px;min-width:0">
              ${input(`projects.${i}.title`, 'Judul')}
              ${input(`projects.${i}.media`, 'Link foto / video / GIF / YouTube', { type: 'url', media: true })}
            </div>
          </div>
          ${area(`projects.${i}.desc`, 'Deskripsi')}
          <div class="grid2">${input(`projects.${i}.link`, 'Link proyek (opsional)', { type: 'url' })}${listInput(`projects.${i}.tags`, 'Tag (pisahkan dengan koma)', 'Node.js, UI')}</div>
        </div>`).join('')}</div>${add('projects', 'Tambah karya')}`, o('projects')));

    html.push(card('stats', 'Statistik', `${S.stats.length}/6`, `
      <div class="items">${S.stats.map((s, i) => `
        <div class="item">${itemHead('stats', i, S.stats.length, `Statistik ${i + 1}`)}
          <div class="grid2">${input(`stats.${i}.value`, 'Angka', { ph: '1.2K' })}${input(`stats.${i}.label`, 'Label', { ph: 'Pengikut' })}</div>
        </div>`).join('')}</div>${S.stats.length < 6 ? add('stats', 'Tambah statistik') : ''}`, o('stats')));

    html.push(card('about', 'Keahlian & pengalaman', null, `
      ${listArea('skills', 'Keahlian (pisahkan dengan koma)', 'JavaScript, Node.js, UI/UX')}
      <div class="items">${S.experience.map((x, i) => `
        <div class="item">${itemHead('experience', i, S.experience.length, x.what || `Pengalaman ${i + 1}`)}
          <div class="grid2">${input(`experience.${i}.what`, 'Posisi / kegiatan')}${input(`experience.${i}.where`, 'Tempat')}</div>
          ${input(`experience.${i}.when`, 'Waktu', { ph: '2025 — Sekarang' })}
        </div>`).join('')}</div>${add('experience', 'Tambah pengalaman')}`, o('about')));

    html.push(card('contact', 'Kontak & platform digital', `${S.socials.length} platform`, `
      <div class="grid2">${input('contact.email', 'Email', { type: 'email' })}${input('contact.phone', 'Telepon (opsional)', { ph: '+62 812-…' })}</div>
      <p class="hint">Urutan di sini = urutan ikon di halaman. WhatsApp cukup nomornya (contoh 6281234567890), otomatis jadi link chat dan muncul juga di Kontak.</p>
      <div class="items">${S.socials.map((s, i) => `
        <div class="item">${itemHead('socials', i, S.socials.length, PLATFORM_NAMES[s.platform] || s.platform)}
          <div class="grid2">
            <label class="f"><span>Platform</span><select data-k="socials.${i}.platform" data-rerender>${platforms.map(p => `<option value="${p}" ${p === s.platform ? 'selected' : ''}>${PLATFORM_NAMES[p] || p}</option>`).join('')}</select></label>
            ${input(`socials.${i}.url`, s.platform === 'whatsapp' ? 'Nomor atau link' : 'Link profil', { ph: PLACEHOLDER[s.platform] || 'https://…' })}
          </div>
        </div>`).join('')}</div>${add('socials', 'Tambah platform')}`, o('contact')));

    html.push(`<section class="card"><header><h2>Atur ulang</h2></header><div class="body">
      <p class="hint">Menghapus semua isi yang tersimpan dan kembali ke contoh bawaan.</p>
      <button class="btn danger" id="reset" style="justify-self:start">Kembalikan ke contoh</button>
      <p class="hint" id="reset-confirm" hidden>Yakin? Semua isi portfolio akan hilang. <button class="btn danger" id="reset-yes">Ya, hapus</button> <button class="btn" id="reset-no">Batal</button></p>
    </div></section>`);

    $('app').innerHTML = html.join('');
  }

  const BLANK = {
    stories: () => ({ type: 'media', media: '', caption: '' }),
    highlights: () => ({ title: '', cover: '', items: [{ type: 'media', media: '', caption: '' }] }),
    projects: () => ({ title: '', desc: '', media: '', link: '', tags: [] }),
    stats: () => ({ value: '', label: '' }),
    experience: () => ({ when: '', what: '', where: '' }),
    socials: () => ({ platform: platforms.find(p => !S.socials.some(s => s.platform === p)) || 'website', url: '' }),
    items: () => ({ type: 'media', media: '', caption: '' }),
  };

  // ---------------------------------------------------------------- events
  const app = $('app');
  app.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    const v = e.target.type === 'checkbox' ? e.target.checked : 'list' in e.target.dataset ? splitList(e.target.value) : e.target.value;
    setPath(S, k, v);
    markDirty();
  });
  app.addEventListener('change', e => {
    const t = e.target;
    if ('media' in t.dataset || 'rerender' in t.dataset || t.dataset.k === 'bannerRatio') {
      const sc = window.scrollY, focus = t.dataset.k;
      render(); window.scrollTo(0, sc);
      const again = app.querySelector(`[data-k="${CSS.escape(focus)}"]`);
      if (again && 'media' in t.dataset) again.blur();
    }
  });
  app.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.add) {
      const key = b.dataset.add, arr = getPath(S, key);
      const type = key.endsWith('.items') ? 'items' : key;
      arr.push(b.dataset.kind === 'text' ? { type: 'text', text: '', bg: 'dark' } : BLANK[type]());
      openCards.add({ stories: 'stories', highlights: 'highlights', projects: 'projects', stats: 'stats', experience: 'about', socials: 'contact', items: 'highlights' }[type]);
      markDirty(); keepScroll(render);
      const last = [...app.querySelectorAll(`[data-k^="${CSS.escape(key)}.${arr.length - 1}."]`)][0];
      last?.focus();
    } else if (b.dataset.del) {
      getPath(S, b.dataset.del).splice(+b.dataset.i, 1);
      markDirty(); keepScroll(render);
    } else if (b.dataset.move) {
      const arr = getPath(S, b.dataset.move), i = +b.dataset.i, j = i + +b.dataset.d;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      markDirty(); keepScroll(render);
    } else if (b.id === 'reset') { $('reset-confirm').hidden = false; }
    else if (b.id === 'reset-no') { $('reset-confirm').hidden = true; }
    else if (b.id === 'reset-yes') { resetAll(); }
  });
  function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

  async function api(method, body) {
    const r = await fetch('/owner/portfolio', { method, credentials: 'same-origin', headers: body ? { 'content-type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    return { ok: r.ok && j.success, status: r.status, j };
  }
  function load(r) {
    S = structuredClone(r.profile);
    for (const k of ['stats', 'stories', 'highlights', 'projects', 'skills', 'experience', 'socials']) if (!Array.isArray(S[k])) S[k] = [];
    S.contact = S.contact || { email: '', phone: '' };
    if (r.platforms) platforms = r.platforms;
    if (r.ratios) ratios = r.ratios;
    if (r.storyBgs) bgs = r.storyBgs;
    if (!S.storyStyle) S.storyStyle = 'overlay';
    dirty = false;
    $('save').disabled = true;
    render();
    status(r.saved ? (r.updatedAt ? 'Tersimpan · ' + new Date(r.updatedAt).toLocaleString('id-ID') : 'Tersimpan') : 'Masih contoh bawaan, belum pernah disimpan');
  }

  async function save() {
    if (saving) return;
    saving = true; $('save').disabled = true; status('Menyimpan…');
    try {
      const r = await api('PUT', { profile: S });
      if (r.ok) { load(r.j); status('✓ Tersimpan', 'ok'); toast('Tersimpan. Halaman portfolio sudah diperbarui.'); }
      else {
        const msg = r.j.message || (r.status === 401 ? 'Sesi login habis. Login lagi ya.' : 'Gagal menyimpan.');
        status(msg, 'err'); toast(msg); $('save').disabled = false;
      }
    } catch (_) { status('Gagal terhubung ke server.', 'err'); $('save').disabled = false; }
    saving = false;
  }
  async function resetAll() {
    const r = await api('DELETE');
    if (r.ok) { load(r.j); toast('Dikembalikan ke contoh bawaan.'); }
    else toast(r.j.message || 'Gagal mengatur ulang.');
  }

  $('save').addEventListener('click', save);
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); if (dirty) save(); } });
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  api('GET').then(r => {
    if (r.ok) return load(r.j);
    app.innerHTML = `<div class="gate"><h2>Tidak bisa membuka panel</h2><p class="hint">${esc(r.j.message || 'Login sebagai developer dulu.')}</p><p><a class="btn solid" href="/?next=/portfolio/panel">Login</a></p></div>`;
    status('');
  }).catch(() => status('Gagal terhubung ke server.', 'err'));
})();
</script>
</body>
</html>
